<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6bbf59">
<title>Ферма</title>
<style>
  :root {
    --sky-top: #8fd3ff; --sky-bot: #d8f1ff;
    --grass: #6bbf59; --soil: #8a5a36; --soil-wet: #6e4426;
    --panel: #fff8e7; --ink: #3b2a1a; --accent: #f4a92b; --good: #3e9b3a; --bad: #d9534f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  body { background: var(--grass); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  /* --- HUD --- */
  #sky { position: relative; padding: 10px 12px 8px; transition: background 1s;
         background: linear-gradient(var(--sky-top), var(--sky-bot)); }
  #hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .pill { background: rgba(255,255,255,.85); border-radius: 999px; padding: 4px 10px; font-size: 15px; white-space: nowrap; }
  #timebar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.15); margin-top: 8px; overflow: hidden; }
  #timefill { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  #sun { position: absolute; top: 34px; font-size: 22px; transition: left .2s linear; pointer-events: none; }

  /* --- Stall / visitors --- */
  #stall { background: #c98b4f; border-bottom: 6px solid #8f5b2b; padding: 6px 8px; min-height: 104px; }
  #stall h3 { margin: 0 0 4px; font-size: 13px; color: #fff3dc; font-weight: 600; }
  #queue { display: flex; gap: 6px; overflow-x: auto; min-height: 76px; }
  .visitor { flex: 0 0 auto; width: 78px; background: var(--panel); border-radius: 10px; padding: 4px; text-align: center;
             box-shadow: 0 2px 0 rgba(0,0,0,.2); animation: pop .25s; cursor: pointer; }
  .visitor .face { font-size: 26px; line-height: 1; }
  .visitor .want { font-size: 14px; font-weight: 700; }
  .visitor .pat { height: 4px; background: #eee; border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .visitor .pat > div { height: 100%; background: var(--good); }
  .visitor.ok { outline: 3px solid var(--good); }
  .empty-note { color: #fff3dc; font-size: 13px; align-self: center; opacity: .9; }

  /* --- Field --- */
  #fieldwrap { flex: 1; overflow-y: auto; padding: 10px; }
  #field { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .plot { aspect-ratio: 1; border-radius: 10px; background: var(--soil); position: relative; display: flex;
          align-items: center; justify-content: center; font-size: 30px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); cursor: pointer; }
  .plot.growing { background: var(--soil-wet); }
  .plot.ready { animation: bob 1s infinite; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 0 0 3px #ffe066; }
  .plot .prog { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 5px; background: rgba(0,0,0,.3); border-radius: 3px; overflow: hidden; }
  .plot .prog > div { height: 100%; background: #9be15d; }
  .plot.locked { background: rgba(0,0,0,.12); box-shadow: none; font-size: 20px; opacity: .7; }

  /* --- Bottom bars --- */
  #bottom { background: var(--panel); border-top: 3px solid #e2d3b0; padding: 6px 8px 8px; }
  #inv { display: flex; gap: 6px; flex-wrap: wrap; font-size: 14px; font-weight: 700; min-height: 22px; margin-bottom: 6px; }
  #inv span { background: #f0e5cb; border-radius: 6px; padding: 2px 6px; }
  #seeds { display: flex; gap: 6px; overflow-x: auto; }
  .seed { flex: 0 0 auto; border: 2px solid #e2d3b0; background: #fff; border-radius: 10px; padding: 4px 8px; text-align: center; min-width: 64px; cursor: pointer; }
  .seed .e { font-size: 24px; }
  .seed .c { font-size: 12px; }
  .seed.sel { border-color: var(--accent); background: #fff1d1; }
  .seed.dis { opacity: .4; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  button { font: inherit; font-weight: 700; border: none; border-radius: 10px; padding: 10px 12px; background: var(--accent); color: #3b2a1a; cursor: pointer; }
  button:disabled { opacity: .45; }
  button.wide { flex: 1; }

  /* --- Night --- */
  body.night #sky { --sky-top: #0d1b3d; --sky-bot: #2b3a6b; }
  body.night { background: #3d6b38; }
  body.night .pill { background: rgba(255,255,255,.75); }
  #overlay { position: fixed; inset: 0; background: rgba(10,15,35,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; }
  #sheet { width: 100%; max-width: 520px; max-height: 86%; overflow-y: auto; background: var(--panel); border-radius: 18px 18px 0 0;
           padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); animation: up .3s; }
  #sheet h2 { margin: 0 0 6px; font-size: 20px; }
  .summary { background: #f0e5cb; border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .up { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #e2d3b0; }
  .up .ico { font-size: 28px; width: 36px; text-align: center; }
  .up .txt { flex: 1; font-size: 14px; }
  .up .txt b { display: block; font-size: 15px; }
  .up .txt small { color: #7a6650; }
  .up button { min-width: 78px; padding: 8px; }

  #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(40,30,20,.9); color: #fff;
           padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; white-space: nowrap; }
  #toast.show { opacity: 1; }
  .float { position: fixed; font-weight: 800; color: #ffe066; text-shadow: 0 1px 2px #000; pointer-events: none; animation: float 1s forwards; z-index: 30; }

  @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes bob { 50% { transform: translateY(-3px) } }
  @keyframes up { from { transform: translateY(100%) } to { transform: none } }
  @keyframes float { to { transform: translateY(-40px); opacity: 0 } }
</style>
</head>
<body>
<div id="app">
  <div id="sky">
    <div id="hud">
      <span class="pill" id="day">День 1</span>
      <span class="pill" id="clock">☀️ 06:00</span>
      <span class="pill" id="coins">💰 0</span>
    </div>
    <div id="timebar"><div id="timefill"></div></div>
  </div>

  <div id="stall">
    <h3 id="stallTitle">🏪 Прилавок — нажми на покупателя, чтобы продать</h3>
    <div id="queue"></div>
  </div>

  <div id="fieldwrap"><div id="field"></div></div>

  <div id="bottom">
    <div id="inv"></div>
    <div id="seeds"></div>
    <div class="row">
      <button class="wide" id="harvestAll">🧺 Собрать всё</button>
      <button class="wide" id="nightBtn" style="display:none">🌙 Улучшения</button>
    </div>
  </div>
</div>

<div id="overlay"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
// ================== ДАННЫЕ ==================
const CROPS = [
  { id: 'wheat',      name: 'Пшеница',  e: '🌾', seed: 2,  grow: 8,  price: 5,  unlockCost: 0,   unlockDay: 1 },
  { id: 'carrot',     name: 'Морковь',  e: '🥕', seed: 4,  grow: 12, price: 10, unlockCost: 30,  unlockDay: 2 },
  { id: 'tomato',     name: 'Помидор',  e: '🍅', seed: 6,  grow: 16, price: 16, unlockCost: 80,  unlockDay: 3 },
  { id: 'corn',       name: 'Кукуруза', e: '🌽', seed: 10, grow: 22, price: 26, unlockCost: 160, unlockDay: 5 },
  { id: 'strawberry', name: 'Клубника', e: '🍓', seed: 15, grow: 28, price: 40, unlockCost: 300, unlockDay: 7 },
  { id: 'pumpkin',    name: 'Тыква',    e: '🎃', seed: 25, grow: 40, price: 70, unlockCost: 600, unlockDay: 10 },
];
const CROP = Object.fromEntries(CROPS.map(c => [c.id, c]));
const FACES = ['👩','👨','👵','👴','🧑','👧','👦','🧔','👩‍🦰','👨‍🦱','🧕','👲'];

const DAY_LEN = 90;       // секунд реального времени на день
const MAX_PLOTS = 24;
const MAX_QUEUE = 5;

const UPGRADES = {
  land:   { name: 'Расширить участок', ico: '🚜', desc: l => `+4 грядки (сейчас ${8 + l*4})`, cost: l => 40 + l*l*40 + l*30, max: (MAX_PLOTS-8)/4 },
  ads:    { name: 'Реклама',           ico: '📣', desc: l => `+2 покупателя в день`,           cost: l => 30 + l*35,           max: 10 },
  fert:   { name: 'Удобрения',         ico: '🧪', desc: l => `Рост быстрее (+${l*20}% → +${(l+1)*20}%)`, cost: l => 50 + l*60, max: 5 },
  sign:   { name: 'Красивая вывеска',  ico: '🪧', desc: l => `Цены выше (+${l*10}% → +${(l+1)*10}%)`, cost: l => 60 + l*70, max: 6 },
  bench:  { name: 'Скамейка',          ico: '🪑', desc: l => `Покупатели ждут дольше (+5 сек)`, cost: l => 25 + l*30, max: 5 },
};

// ================== СОСТОЯНИЕ ==================
const SAVE_KEY = 'farm-save-v1';
function newState() {
  return {
    day: 1, t: 0, night: false, coins: 30,
    plots: Array.from({ length: 8 }, () => ({ crop: null, prog: 0 })),
    inv: {}, unlocked: ['wheat'], sel: 'wheat',
    up: { land: 0, ads: 0, fert: 0, sign: 0, bench: 0 },
    queue: [], spawned: 0, toSpawn: 0,
    stats: { earned: 0, served: 0, missed: 0 },
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY)) || newState(); } catch { S = newState(); }
if (!S.stats) S.stats = { earned: 0, served: 0, missed: 0 };
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} }

// ================== ПРАВИЛА ==================
const visitorsPerDay = () => 4 + S.up.ads * 2 + Math.floor(S.day / 2);
const growMult = () => 1 + S.up.fert * 0.2;
const priceMult = () => 1 + S.up.sign * 0.1;
const patience = () => 22 + S.up.bench * 5;
const sellPrice = c => Math.round(CROP[c].price * priceMult());

function startDay() {
  S.night = false; S.t = 0; S.queue = []; S.spawned = 0;
  S.toSpawn = visitorsPerDay();
  S.stats = { earned: 0, served: 0, missed: 0 };
  document.getElementById('overlay').classList.remove('show');
  toast(`☀️ День ${S.day}. Ждём ${S.toSpawn} покупателей`);
  save(); render();
}

function endDay() {
  S.stats.missed += S.queue.length + (S.toSpawn - S.spawned);
  S.queue = []; S.night = true;
  save(); render(); openNight(true);
}

function spawnVisitor() {
  // Хотят то, что открыто; чаще — дешёвое
  const pool = S.unlocked.flatMap((id, i) => Array(S.unlocked.length - i + 1).fill(id));
  const crop = pool[Math.floor(Math.random() * pool.length)];
  const base = CROP[crop].price;
  const qty = 1 + Math.floor(Math.random() * (base < 15 ? 4 : base < 40 ? 3 : 2));
  S.queue.push({ id: Math.random(), face: FACES[Math.floor(Math.random()*FACES.length)], crop, qty, pat: patience(), max: patience() });
  S.spawned++;
}

function sell(v, el) {
  const have = S.inv[v.crop] || 0;
  if (have < v.qty) { toast(`Нужно ${v.qty} ${CROP[v.crop].e}, есть ${have}`); return; }
  S.inv[v.crop] = have - v.qty;
  // Чаевые за быстрое обслуживание
  const tip = v.pat / v.max > 0.6 ? Math.ceil(v.qty * sellPrice(v.crop) * 0.2) : 0;
  const money = v.qty * sellPrice(v.crop) + tip;
  S.coins += money; S.stats.earned += money; S.stats.served++;
  S.queue = S.queue.filter(q => q !== v);
  floatText(el, `+${money}💰${tip ? ' 😊' : ''}`);
  save(); render();
}

function tapPlot(i, el) {
  if (i >= S.plots.length) { toast('🚜 Расширь участок ночью'); return; }
  const p = S.plots[i];
  if (p.crop && p.prog >= 1) { const e = CROP[p.crop].e; harvest(p); floatText(el, `+1 ${e}`); save(); render(); return; }
  if (p.crop) { toast(`${CROP[p.crop].e} растёт… ${Math.floor(p.prog*100)}%`); return; }
  const c = CROP[S.sel];
  if (S.coins < c.seed) { toast('Не хватает монет на семена'); return; }
  S.coins -= c.seed; p.crop = c.id; p.prog = 0;
  save(); render();
}

function harvest(p) {
  S.inv[p.crop] = (S.inv[p.crop] || 0) + 1;
  p.crop = null; p.prog = 0;
}

function buyUpgrade(key) {
  const u = UPGRADES[key], l = S.up[key], cost = u.cost(l);
  if (l >= u.max || S.coins < cost) return;
  S.coins -= cost; S.up[key]++;
  if (key === 'land') for (let k = 0; k < 4; k++) S.plots.push({ crop: null, prog: 0 });
  save(); render(); openNight(false);
}

function unlockCrop(id) {
  const c = CROP[id];
  if (S.unlocked.includes(id) || S.coins < c.unlockCost || S.day + 1 < c.unlockDay) return;
  S.coins -= c.unlockCost; S.unlocked.push(id); S.sel = id;
  save(); render(); openNight(false);
}

// ================== ЦИКЛ ==================
let last = performance.now(), saveAcc = 0;
function tick(now) {
  const dt = Math.min(0.5, (now - last) / 1000); last = now;
  if (!S.night) {
    S.t += dt;
    for (const p of S.plots) if (p.crop && p.prog < 1) p.prog = Math.min(1, p.prog + dt * growMult() / CROP[p.crop].grow);
    // Покупатели приходят равномерно в первые 85% дня
    const due = Math.floor(S.toSpawn * Math.min(1, S.t / (DAY_LEN * 0.85)));
    while (S.spawned < due) {
      if (S.queue.length >= MAX_QUEUE) { S.spawned++; S.stats.missed++; toast('😤 Очередь полная, покупатель ушёл'); }
      else spawnVisitor();
    }
    for (const v of S.queue) v.pat -= dt;
    const gone = S.queue.filter(v => v.pat <= 0);
    if (gone.length) { S.stats.missed += gone.length; S.queue = S.queue.filter(v => v.pat > 0); renderQueue(); }
    if (S.t >= DAY_LEN) endDay();
    saveAcc += dt; if (saveAcc > 3) { saveAcc = 0; save(); }
    renderLive();
  }
  requestAnimationFrame(tick);
}

// ================== ОТРИСОВКА ==================
const $ = id => document.getElementById(id);

function render() {
  document.body.classList.toggle('night', S.night);
  $('day').textContent = `День ${S.day}`;
  $('coins').textContent = `💰 ${S.coins}`;
  $('nightBtn').style.display = S.night ? '' : 'none';
  $('stallTitle').textContent = S.night ? '🌙 Ночь — лавка закрыта. Время улучшений!' : '🏪 Прилавок — нажми на покупателя, чтобы продать';
  renderField(); renderQueue(); renderInv(); renderSeeds(); renderLive();
}

function renderField() {
  const f = $('field'); f.innerHTML = '';
  const shown = Math.min(MAX_PLOTS, S.plots.length + 4);
  for (let i = 0; i < shown; i++) {
    const d = document.createElement('div');
    const p = S.plots[i];
    if (!p) { d.className = 'plot locked'; d.textContent = '🔒'; }
    else if (!p.crop) { d.className = 'plot'; d.innerHTML = ''; }
    else if (p.prog >= 1) { d.className = 'plot ready'; d.textContent = CROP[p.crop].e; }
    else {
      d.className = 'plot growing';
      d.innerHTML = `<span style="font-size:${p.prog < .5 ? 18 : 24}px">${p.prog < .5 ? '🌱' : '🌿'}</span><div class="prog"><div style="width:${p.prog*100}%"></div></div>`;
    }
    d.onclick = () => tapPlot(i, d);
    f.appendChild(d);
  }
}

function renderQueue() {
  const q = $('queue'); q.innerHTML = '';
  if (S.night) { q.innerHTML = '<div class="empty-note">Покупатели придут утром 💤</div>'; return; }
  if (!S.queue.length) { q.innerHTML = `<div class="empty-note">Пока никого… (придёт ещё ${S.toSpawn - S.spawned})</div>`; return; }
  for (const v of S.queue) {
    const d = document.createElement('div');
    d.className = 'visitor' + ((S.inv[v.crop] || 0) >= v.qty ? ' ok' : '');
    d.innerHTML = `<div class="face">${v.face}</div><div class="want">${v.qty}×${CROP[v.crop].e}</div>
      <div style="font-size:11px">${v.qty * sellPrice(v.crop)}💰</div><div class="pat"><div></div></div>`;
    d.onclick = () => sell(v, d);
    v.el = d;
    q.appendChild(d);
  }
}

function renderInv() {
  const items = S.unlocked.filter(id => S.inv[id]).map(id => `<span>${CROP[id].e} ${S.inv[id]}</span>`);
  $('inv').innerHTML = items.length ? items.join('') : '<span style="opacity:.6">Склад пуст — посади и собери урожай</span>';
}

function renderSeeds() {
  const s = $('seeds'); s.innerHTML = '';
  for (const id of S.unlocked) {
    const c = CROP[id];
    const d = document.createElement('div');
    d.className = 'seed' + (S.sel === id ? ' sel' : '') + (S.coins < c.seed ? ' dis' : '');
    d.innerHTML = `<div class="e">${c.e}</div><div class="c">🌰${c.seed} → ${sellPrice(id)}💰</div><div class="c">⏱${Math.round(c.grow/growMult())}с</div>`;
    d.onclick = () => { S.sel = id; renderSeeds(); };
    s.appendChild(d);
  }
}

let lastFieldSig = '';
function renderLive() {
  // Время
  const frac = S.night ? 1 : S.t / DAY_LEN;
  const mins = 6 * 60 + Math.floor(frac * 15 * 60);  // 06:00 → 21:00
  $('clock').textContent = S.night ? '🌙 Ночь' : `☀️ ${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
  $('timefill').style.width = (frac * 100) + '%';
  $('coins').textContent = `💰 ${S.coins}`;
  // Небо темнеет к вечеру
  if (!S.night) {
    const k = Math.max(0, (frac - 0.7) / 0.3);
    $('sky').style.setProperty('--sky-top', mix('#8fd3ff', '#ff9a5a', k));
    $('sky').style.setProperty('--sky-bot', mix('#d8f1ff', '#ffd59a', k));
  } else { $('sky').style.removeProperty('--sky-top'); $('sky').style.removeProperty('--sky-bot'); }
  // Терпение покупателей
  for (const v of S.queue) if (v.el) {
    const bar = v.el.querySelector('.pat > div');
    const r = v.pat / v.max;
    bar.style.width = (r * 100) + '%';
    bar.style.background = r > .5 ? 'var(--good)' : r > .25 ? 'var(--accent)' : 'var(--bad)';
  }
  // Поле: перерисовываем, только если что-то изменилось заметно
  const sig = S.plots.map(p => p.crop ? (p.prog >= 1 ? 'R' : Math.floor(p.prog * 20)) : '_').join(',');
  if (sig !== lastFieldSig) { lastFieldSig = sig; renderField(); }
}

function mix(a, b, k) {
  const pa = [1,3,5].map(i => parseInt(a.substr(i,2),16)), pb = [1,3,5].map(i => parseInt(b.substr(i,2),16));
  return 'rgb(' + pa.map((v,i) => Math.round(v + (pb[i]-v)*k)).join(',') + ')';
}

// ================== НОЧЬ / МАГАЗИН ==================
function openNight(withSummary) {
  const st = S.stats;
  let h = `<h2>🌙 Ночь ${S.day}</h2>`;
  if (withSummary) {
    h += `<div class="summary">За день: заработано <b>${st.earned}💰</b><br>Обслужено: <b>${st.served}</b> · Ушли ни с чем: <b>${st.missed}</b><br>
      Завтра придёт ~<b>${4 + S.up.ads*2 + Math.floor((S.day+1)/2)}</b> покупателей</div>`;
  }
  h += `<div style="font-weight:700;margin:6px 0 2px">У тебя: 💰 ${S.coins}</div>`;
  h += `<h3 style="margin:10px 0 0">Улучшения фермы</h3>`;
  for (const [key, u] of Object.entries(UPGRADES)) {
    const l = S.up[key], maxed = l >= u.max, cost = u.cost(l);
    h += `<div class="up"><div class="ico">${u.ico}</div><div class="txt"><b>${u.name} <small>ур. ${l}/${u.max}</small></b><small>${maxed ? 'Максимум' : u.desc(l)}</small></div>
      <button ${maxed || S.coins < cost ? 'disabled' : ''} onclick="buyUpgrade('${key}')">${maxed ? '✔' : cost + '💰'}</button></div>`;
  }
  h += `<h3 style="margin:14px 0 0">Новые культуры</h3>`;
  for (const c of CROPS) {
    if (S.unlocked.includes(c.id)) continue;
    const early = S.day + 1 < c.unlockDay;
    h += `<div class="up"><div class="ico">${early ? '❓' : c.e}</div><div class="txt"><b>${early ? '???' : c.name}</b>
      <small>${early ? `Откроется после ${c.unlockDay - 1}-го дня` : `Семена ${c.seed}💰 · растёт ${c.grow}с · продаётся за ${c.price}💰`}</small></div>
      <button ${early || S.coins < c.unlockCost ? 'disabled' : ''} onclick="unlockCrop('${c.id}')">${c.unlockCost}💰</button></div>`;
  }
  h += `<div class="row" style="margin-top:14px"><button class="wide" onclick="closeNight()">🌾 К грядкам</button>
        <button class="wide" style="background:#ffd34d" onclick="morning()">☀️ Начать день ${S.day + 1}</button></div>
        <div style="text-align:center;margin-top:10px"><button style="background:none;color:#b0503a;font-size:12px" onclick="resetGame()">Начать заново</button></div>`;
  $('sheet').innerHTML = h;
  $('overlay').classList.add('show');
}
function closeNight() { $('overlay').classList.remove('show'); }
function morning() { S.day++; startDay(); }
function resetGame() { if (confirm('Стереть прогресс и начать заново?')) { S = newState(); startDay(); } }

// ================== МЕЛОЧИ ==================
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }
function floatText(el, txt) {
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'float'; f.textContent = txt; f.style.left = (r.left + r.width/2 - 20) + 'px'; f.style.top = r.top + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}

$('harvestAll').onclick = () => {
  let n = 0; for (const p of S.plots) if (p.crop && p.prog >= 1) { harvest(p); n++; }
  toast(n ? `🧺 Собрано: ${n}` : 'Нечего собирать'); save(); render();
};
$('nightBtn').onclick = () => openNight(false);
$('overlay').onclick = e => { if (e.target.id === 'overlay') closeNight(); };

// Старт
if (S.toSpawn === 0 && !S.night) startDay(); else render();
if (S.night) openNight(false);
requestAnimationFrame(tick);
</script>
</body>
</html>
