<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5a9e4b">
<title>Солнечная ферма</title>
<style>
  :root {
    --panel: #fff8e7; --ink: #3b2a1a; --accent: #f4a92b; --good: #3e9b3a; --bad: #d9534f; --line: #e2d3b0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #4e8c41; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; background: #4e8c41; }

  #stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 10px 0; pointer-events: none; }
  .hr { display: flex; align-items: center; gap: 6px; }
  .round { pointer-events: auto; width: 42px; height: 42px; padding: 0; border-radius: 50%; background: rgba(255,248,231,.95);
           font-size: 20px; line-height: 42px; box-shadow: 0 2px 0 rgba(0,0,0,.18); flex: 0 0 auto; }
  #menuBtn { font-size: 22px; font-weight: 900; }
  .hudrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  #coins { cursor: pointer; pointer-events: auto; }
  .ebar { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 3px 0; }
  .ebar .el { flex: 0 0 38%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ebar .et { flex: 1; height: 10px; background: #efe3c8; border-radius: 5px; overflow: hidden; }
  .ebar .et i { display: block; height: 100%; border-radius: 5px; }
  .ebar b { flex: 0 0 auto; min-width: 54px; text-align: right; }
  .echart { display: flex; gap: 6px; align-items: flex-end; height: 110px; padding: 6px 4px 0; background: #f6eedb; border-radius: 10px; }
  .ecol { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .ebars { flex: 1; width: 100%; display: flex; gap: 2px; align-items: flex-end; justify-content: center; }
  .ebars i { display: block; width: 40%; max-width: 14px; border-radius: 3px 3px 0 0; min-height: 1px; }
  .ecol small { font-size: 10px; color: #7a6650; padding: 2px 0; }
  .pill { background: rgba(255,248,231,.92); border-radius: 999px; padding: 4px 10px; font-size: 15px; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #sunbox { position: relative; width: 132px; height: 52px; border-radius: 14px; overflow: hidden; pointer-events: auto;
            box-shadow: 0 2px 0 rgba(0,0,0,.15); transition: background 1.5s; background: #9fd8ff; cursor: default; }
  #sunbox svg { position: absolute; inset: 0; }
  #sunIcon { position: absolute; font-size: 18px; line-height: 1; transform: translate(-50%, -50%); transition: left .5s linear, top .5s linear; }
  #phase { position: absolute; left: 0; right: 0; bottom: 2px; white-space: nowrap; text-align: center; font-size: 11px; font-weight: 800; color: #3b2a1a; letter-spacing: .02em; }
  #sunbox.dark #phase { color: #e8ecff; }
  .hcard { background: #f0e5cb; border-radius: 12px; padding: 8px 10px; margin-top: 8px; font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  #sunIcon img.ic { display: block; vertical-align: 0; width: 1.2em; height: 1.2em; }
  img.ic { width: 1.25em; height: 1.25em; vertical-align: -.28em; display: inline-block; pointer-events: none; -webkit-user-drag: none; }
  .chip { padding: 6px 9px; font-size: 13px; background: #fff; border: 2px solid var(--line); border-radius: 999px; }
  .chip.on { background: #3e9b3a; border-color: #3e9b3a; color: #fff; }
  .recipe { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 5px 0; background: #f6eedb; border: 2px solid transparent; border-radius: 12px; cursor: pointer; }
  .recipe.on { border-color: #3e9b3a; background: #eaf5e1; }
  .recipe.off { opacity: .55; }
  .recipe .re { font-size: 30px; }
  .recipe .rt { flex: 1; font-size: 14px; line-height: 1.35; }
  .recipe .rt small { font-size: 12px; color: #7a6650; }
  .recipe .rn { color: #3e9b3a; }
  .cheats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .cheats button { padding: 9px 6px; font-size: 14px; }
  .cheats button.on { background: #3e9b3a; color: #fff; }

  #inv { display: flex; gap: 4px; flex-wrap: wrap; font-size: 13px; font-weight: 800; margin: 8px 64px 0 0; }
  #inv span { background: rgba(255,248,231,.88); border-radius: 999px; padding: 2px 8px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  #seeds { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px;
           max-height: calc(100% - 300px); overflow-y: auto; padding: 4px 2px; scrollbar-width: none; }
  .seed { position: relative; flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,248,231,.95);
          border: 3px solid transparent; box-shadow: 0 2px 0 rgba(0,0,0,.18); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .seed .e { font-size: 24px; margin-top: -6px; }
  .seed .c { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 800; }
  .seed.sel { border-color: var(--accent); background: #fff1d1; transform: scale(1.08); }
  .seed.dis { opacity: .45; }
  .seed .ghb { position: absolute; top: -4px; right: -4px; font-size: 13px; background: #fff; border-radius: 50%; width: 19px; height: 19px; display: flex; align-items: center; justify-content: center; }
  #actions { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px calc(10px + env(safe-area-inset-bottom));
             display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #actions button { pointer-events: auto; }
  .arow { display: flex; gap: 14px; justify-content: center; }
  .act { width: 64px; height: 64px; padding: 0; border-radius: 50%; background: rgba(255,248,231,.96); box-shadow: 0 3px 0 rgba(0,0,0,.2);
         display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; line-height: 1.1; }
  .act span { font-size: 24px; line-height: 1; margin-bottom: 2px; }
  .sunrise { background: #ffd34d; padding: 12px 22px; border-radius: 999px; font-size: 17px; box-shadow: 0 3px 0 rgba(0,0,0,.2); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .menu button { display: block; width: 100%; text-align: left; margin-top: 6px; background: #f0e5cb; padding: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  button { font: inherit; font-weight: 700; border: none; border-radius: 10px; padding: 10px 8px; background: var(--accent); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .45; }
  button.wide { flex: 1; }
  button.alt { background: #e9dcbc; }

  #overlay { position: fixed; inset: 0; background: rgba(10,15,35,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; }
  #sheet { width: 100%; max-width: 640px; max-height: 86%; overflow-y: auto; background: var(--panel); border-radius: 18px 18px 0 0;
           padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); animation: up .3s; }
  #sheet h2 { margin: 0 0 6px; font-size: 20px; }
  .summary { background: #f0e5cb; border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .up { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .up .ico { font-size: 28px; width: 36px; text-align: center; }
  .up .txt { flex: 1; font-size: 14px; }
  .up .txt b { display: block; font-size: 15px; }
  .up .txt small { color: #7a6650; }
  .up button { min-width: 78px; padding: 8px; }

  #toast { position: fixed; left: calc(50% - 30px); top: 20%; transform: translateX(-50%); background: rgba(40,30,20,.9); color: #fff;
           padding: 8px 14px; border-radius: 18px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
           width: max-content; max-width: calc(100% - 100px); text-align: center; }
  #toast.show { opacity: 1; }
  @keyframes up { from { transform: translateY(100%) } to { transform: none } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="hudrow">
        <button class="round" id="profileBtn" title="Профиль">🧑‍🌾</button>
        <div id="sunbox" title="Время суток">
          <svg viewBox="0 0 132 52" width="132" height="52"><path d="M14 40 A52 26 0 0 1 118 40" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-dasharray="3 4"/>
            <line x1="6" y1="40" x2="126" y2="40" stroke="rgba(60,40,20,.35)" stroke-width="1.5"/></svg>
          <span id="sunIcon">☀️</span><span id="phase">Рассвет</span>
        </div>
        <div class="hr"><span class="pill" id="coins">💰 0</span><button class="round" id="menuBtn" title="Меню">☰</button></div>
      </div>
      <div id="inv"></div>
    </div>
    <div id="seeds"></div>
    <div id="actions">
      <button class="wide sunrise" id="dayBtn" style="display:none">☀️ Начать день 2</button>
      <div class="arow">
        <button class="act" id="harvestAll"><span>🧺</span>Собрать</button>
        <button class="act" id="plantAll"><span>🌱</span>Засеять</button>
        <button class="act" id="nightBtn" style="display:none"><span>⬆️</span>Улучшить</button>
        <button class="act" id="helperBtn" style="display:none"><span>🧑‍🌾</span>Команда</button>
      </div>
    </div>
  </div>
</div>

<div id="overlay"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
// ================== ДАННЫЕ ==================
const CROPS = [
  // бесплатная культура: всегда можно что-то посадить, даже без денег
  { id: 'sunflower',  name: 'Подсолнух', e: '🌻', seed: 0, grow: 6,  price: 2,  unlockCost: 0,   unlockDay: 1 },
  { id: 'wheat',      name: 'Пшеница',  e: '🌾', seed: 2,  grow: 8,  price: 5,  unlockCost: 0,   unlockDay: 1 },
  { id: 'carrot',     name: 'Морковь',  e: '🥕', seed: 4,  grow: 12, price: 10, unlockCost: 30,  unlockDay: 2 },
  { id: 'tomato',     name: 'Помидор',  e: '🍅', seed: 6,  grow: 16, price: 16, unlockCost: 80,  unlockDay: 3 },
  { id: 'corn',       name: 'Кукуруза', e: '🌽', seed: 10, grow: 22, price: 26, unlockCost: 160, unlockDay: 5 },
  { id: 'strawberry', name: 'Клубника', e: '🍓', seed: 15, grow: 28, price: 40, unlockCost: 300, unlockDay: 7 },
  { id: 'pumpkin',    name: 'Тыква',    e: '🎃', seed: 25, grow: 40, price: 70, unlockCost: 600, unlockDay: 10 },
];
const CROP = Object.fromEntries(CROPS.map(c => [c.id, c]));

const DAY_LEN = 180;      // секунд реального времени на день
const MAX_QUEUE = 5;
const SPEED = 3.2;        // клеток в секунду

// Деревья сада: сажаются один раз и потом плодоносят снова и снова.
// Чтобы добавить грушу — допиши сюда запись и товар в GOODS.
const TREES = {
  apple: { name: 'Яблоня', e: '🍎', fruit: 'apple', sapling: 40, mature: 150, regrow: 50, yield: 3, leaf: '#4f9e45', leafLight: '#6dbb5a', fruitColor: '#e0393e' },
};
// Всё, что продаётся на лотке
const GOODS = {
  ...Object.fromEntries(CROPS.map(c => [c.id, { e: c.e, name: c.name, price: c.price }])),
  apple: { e: '🍎', name: 'Яблоко', price: 12 },
  egg:   { e: '🥚', name: 'Яйцо',   price: 9 },
  milk:  { e: '🥛', name: 'Молоко', price: 22 },
  flour: { e: '🍚', name: 'Мука',   price: 30 },
  cheese:{ e: '🧀', name: 'Сыр',    price: 85 },
  bread: { e: '🍞', name: 'Хлеб',    price: 100 },
  pie:   { e: '🥧', name: 'Яблочный пирог', price: 170 },
  pizza: { e: '🍕', name: 'Пицца',   price: 270 },
  cake:  { e: '🎂', name: 'Клубничный торт', price: 380 },
};
// Производство: сырьё со склада → товар. Работает днём, как растут грядки
const PROD = {
  mill:  { name: 'Мельница',  ico: '🌬️', in: 'wheat', n: 3, out: 'flour',  time: 24, cap: 8, spot: { x: 18, y: 7 } },
  dairy: { name: 'Сыроварня', ico: '🧀', in: 'milk',  n: 2, out: 'cheese', time: 36, cap: 8, spot: { x: 17, y: 7 } },
};
// Пекарня — пристройка к дому: печёт из муки и продуктов фермы по выбранному рецепту
const BAKE = {
  bread: { in: { flour: 2, egg: 1 }, time: 30 },
  pie:   { in: { flour: 2, apple: 3, egg: 2 }, time: 40 },
  pizza: { in: { flour: 2, cheese: 1, tomato: 3 }, time: 45 },
  cake:  { in: { flour: 2, strawberry: 4, egg: 2, milk: 2 }, time: 60 },
};
const BAKE_CAP = 6, BAKE_SPOT = { x: 4, y: 4 };
const MAIL = { x: 4, y: 5 }, MAIL_SPOT = { x: 5, y: 5 };   // почтовый ящик у тропинки
// Уют: что появляется у дома на каждом уровне
const COZY = ['🌷 Клумбы у сада', '🐕 Собака и будка', '🪣 Колодец', '🌳 Качели у лавки', '🐓 Флюгер и фонарики на доме'];
const COZY_SPOTS = [{ x: 4, y: 6 }, { x: 1, y: 4 }, { x: 4, y: 8 }, { x: 1, y: 9 }, { x: 3, y: 4 }];
const COZY_CELLS = [[2, 1, 4], [3, 4, 8], [4, 1, 9], [4, 2, 9]];   // [уровень, x, y] — занятые клетки
const GH_CROPS = ['tomato', 'strawberry'];   // растут только в теплице
const GH_YIELD = 6, GH_SLOW = 3;             // в теплице зреют гроздью по 6, но в 3 раза дольше
const FEED_PER_HEN = 3;            // растений на курицу на день
const EGG_EVERY = DAY_LEN / 5;     // сытая курица несёт ~5 яиц за день
const COW_FOOD = ['sunflower', 'wheat'];   // коровы едят только подсолнухи и пшеницу
const FEED_PER_COW = 4;            // растений на корову на день
const MILK_EVERY = DAY_LEN / 6;    // сытая корова даёт ~6 бутылок молока за день

const UPGRADES = {
  land:   { name: 'Расширить участок', ico: '🚜', desc: l => `+4 грядки (сейчас ${8 + l*4})`, cost: l => 40 + l*l*40 + l*30, max: 4 },
  orchard:{ name: 'Фруктовый сад',     ico: '🌳', desc: l => l === 0 ? 'Место под 2 яблони. Саженец 40💰, растёт ~день, потом плодоносит каждый день' : '+2 места под деревья', cost: l => [150, 260][l], max: 2 },
  coop:   { name: 'Курятник',          ico: '🐔', desc: l => l === 0 ? 'Курятник и 2 курицы. Ночью корми их урожаем — днём несут яйца' : `+1 курица (сейчас ${l + 1})`, cost: l => [150, 100, 140, 190][l], max: 4 },
  barn:   { name: 'Коровник',          ico: '🐄', desc: l => l === 0 ? 'Коровник, пастбище и корова. Ночью корми подсолнухами или пшеницей — днём даёт молоко' : `+1 корова (сейчас ${l})`, cost: l => [220, 180, 260][l], max: 3 },
  greenhouse: { name: 'Теплица',      ico: '🏡', desc: l => l === 0 ? 'Стеклянная теплица на 3 грядки. Только в ней растут 🍅 помидоры и 🍓 клубника — медленнее, зато гроздью по 6' : '+3 грядки в теплице', cost: l => [260, 380][l], max: 2 },
  clear:  { name: 'Расчистить лес',    ico: '🪓', desc: l => l === 0 ? 'Вырубить лес справа от пастбища — место под новое здание' : 'Вырубить лес у теплицы — место ещё под одно здание', cost: l => [2500, 4000][l], max: 2 },
  mill:   { name: 'Мельница',          ico: '🌬️', desc: l => l === 0 ? 'Мелет пшеницу: 3 🌾 → 1 🍚 мука (продаётся за 30💰)' : 'Мелет вдвое быстрее', cost: l => [3500, 5500][l], max: 2, need: () => S.up.clear >= 1, needText: 'Откроется, когда расчистишь лес 🪓' },
  dairy:  { name: 'Сыроварня',         ico: '🧀', desc: l => l === 0 ? 'Варит сыр: 2 🥛 → 1 🧀 (продаётся за 85💰)' : 'Варит вдвое быстрее', cost: l => [5000, 8000][l], max: 2, need: () => S.up.clear >= 2, needText: 'Откроется, когда расчистишь второй участок леса 🪓' },
  house:  { name: 'Дом фермера',       ico: '🏠', desc: l => l === 0 ? 'Веранда и кухня: помощники сыты и работают на 20% быстрее' : 'Второй этаж: помощники работают ещё на 20% быстрее (всего +40%)', cost: l => [3000, 7000][l], max: 2 },
  bakery: { name: 'Пекарня',           ico: '🥖', desc: l => l === 0 ? 'Пристройка к дому. Печёт из 🍚 муки и продуктов фермы: 🍞 хлеб, 🥧 пирог, 🍕 пиццу и 🎂 торт' : 'Печёт вдвое быстрее', cost: l => [6000, 9000][l], max: 2, need: () => S.up.mill >= 1, needText: 'Откроется после новой постройки в лесу 🪓' },
  cozy:   { name: 'Уют',               ico: '🌷', desc: l => `${COZY[l]}. Покупателям нравится — платят на 5% больше (+${l * 5}% → +${(l + 1) * 5}%)`, cost: l => [600, 1200, 2000, 3200, 5000][l], max: 5 },
  ads:    { name: 'Реклама',           ico: '📣', desc: l => `+3 покупателя в день`,           cost: l => 30 + l*35,           max: 10 },
  fert:   { name: 'Удобрения',         ico: '🧪', desc: l => `Рост быстрее (+${l*20}% → +${(l+1)*20}%)`, cost: l => 50 + l*60, max: 5 },
  sign:   { name: 'Красивая вывеска',  ico: '🪧', desc: l => `Цены выше (+${l*10}% → +${(l+1)*10}%)`, cost: l => 60 + l*70, max: 6 },
  helper: { name: 'Помощник',         ico: '🧑‍🌾', desc: l => `Работает на одной или нескольких станциях: поле, сад, курятник, коровник, лавка (помощников: ${l} → ${l+1})`, cost: l => [120, 280, 520, 800, 1150, 1600, 2100, 2700, 3400, 4200][l], max: 10 },
  bench:  { name: 'Скамейка',          ico: '🪑', desc: l => `Покупатели ждут дольше (+5 сек)`, cost: l => 25 + l*30, max: 5 },
};

const upLocked = key => !!(UPGRADES[key].need && !UPGRADES[key].need());   // ещё не открыто

// ================== КАРТА ==================
// Изометрия: клетка (x, y) → экран ((x−y)·TW/2, (x+y)·TH/2)
const TW = 64, TH = 32, W = 22, H = 14;   // справа от поля — пастбище с коровником, дальше лес
const ground = Array.from({ length: H }, () => Array(W).fill('g'));
const blocked = Array.from({ length: H }, () => Array(W).fill(false));
const decor = [];

for (let x = 0; x < W; x++) { ground[12][x] = 'r'; ground[13][x] = 'r'; }   // дорога
for (let y = 1; y <= 11; y++) ground[y][5] = 'p';                          // тропинки
for (let x = 6; x <= 21; x++) ground[7][x] = 'p';   // тропинка уходит в лес
for (let x = 2; x <= 8; x++) ground[11][x] = 'p';                          // площадка у лавки
for (const [x, y] of [[10,9],[11,9],[10,10],[11,10]]) { ground[y][x] = 'w'; blocked[y][x] = true; }  // пруд

// 24 места под грядки: открываются блоками по 4
const PLOT_SLOTS = [];
for (const [xs, ys] of [[[6,7,8,9],[2,3]], [[6,7,8,9],[4]], [[6,7,8,9],[5]], [[10,11],[2,3]], [[10,11],[4,5]]])
  for (const y of ys) for (const x of xs) PLOT_SLOTS.push({ x, y });
const MAX_PLOTS = PLOT_SLOTS.length;
PLOT_SLOTS.forEach(s => ground[s.y][s.x] = 's');

// ---------- Курятник ----------
const hens = () => S.up.coop > 0 ? S.up.coop + 1 : 0;

function feedHens(byHelper) {
  if (!hens()) return false;

    const k = Math.min(need, S.inv[c.id] || 0); S.inv[c.id] = (S.inv[c.id] || 0) - k; need -= k; if (!need) break;
  }
  S.coop.fedDay = S.day + 1; S.coop.fedHens = already + n;

}

}

let hensState = [];
function syncHens() {
  while (hensState.length < hens()) hensState.push({ x: 7 + Math.random() * 2, y: 9.4 + Math.random() * 1.2, tx: 0, ty: 0, wait: Math.random() * 2, phase: 0, moving: false, flip: false });

}

      const done = stepToward(h, 6.4 + i * 0.32, 9.35, 0.8, dt);

    }

    if (stepToward(h, h.tx, h.ty, 0.9, dt)) { h.moving = false; h.wait = 1 + Math.random() * 3; }

// ---------- Мельница и сыроварня ----------
const prodSpeed = k => S.up[k];   // 2-й уровень — вдвое быстрее
function prodHave(k, byHelper) {   // сколько сырья можно взять со склада
  const P = PROD[k];
  let have = S.inv[P.in] || 0;
  if (byHelper && P.in === 'wheat' && cows()) have -= cows() * FEED_PER_COW;   // помощник оставляет пшеницу коровам
  return Math.max(0, have);
}
function loadProd(k, byHelper) {
  const P = PROD[k], st = S.prod[k];
  const n = Math.min(P.cap - st.q, Math.floor(prodHave(k, byHelper) / P.n));
  if (n <= 0) return 0;
  S.inv[P.in] -= n * P.n; st.q += n;
  addFloat(P.spot.x + .5, P.spot.y + .5, `−${n * P.n} ${GOODS[P.in].e}`);
  return n;
}
function collectProd(k) {
  const P = PROD[k], st = S.prod[k];
  if (!st.out) return false;
  S.inv[P.out] = (S.inv[P.out] || 0) + st.out; S.life[P.out] = (S.life[P.out] || 0) + st.out;
  addFloat(P.spot.x + .5, P.spot.y - .5, `+${st.out} ${GOODS[P.out].e}`);
  st.out = 0; save(); renderUI(); return true;
}
function prodAct(k, byHelper) {   // забрать готовое и догрузить сырьё
  const P = PROD[k], st = S.prod[k];
  if (!S.up[k]) return false;
  const got = collectProd(k), n = loadProd(k, byHelper);
  if (!got && !n) {
    if (!byHelper) toast(st.q >= P.cap ? `${P.ico} ${P.name} загружена полностью — ${st.q} ${GOODS[P.out].e} в работе`
      : `${P.ico} Нужно ${P.n} ${GOODS[P.in].e} на 1 ${GOODS[P.out].e}, на складе ${S.inv[P.in] || 0}`);
    return false;
  }
  if (n && !byHelper) toast(`${P.ico} Загружено ${n * P.n} ${GOODS[P.in].e} → будет ${n} ${GOODS[P.out].e}${S.night ? ' (утром)' : ''}`);
  if (n && !S.night) beginClock();
  save(); renderUI(); return true;
}
function tapProd(k) {
  if (!S.up[k]) { toast(`${PROD[k].ico} Ночью тапни сюда — построишь: ${PROD[k].name.toLowerCase()}`); return; }
  setTasks([{ ...PROD[k].spot, fn: () => prodAct(k) }]);
}
function updateProd(dt) {
  for (const k in PROD) {
    if (!S.up[k]) continue;
    const st = S.prod[k], T = PROD[k].time;
    if (!st.q) { st.t = 0; continue; }
    if (st.out >= 20) continue;   // склад здания полон — ждёт, пока заберут
    st.t += dt * prodSpeed(k);
    while (st.t >= T && st.q > 0) { st.t -= T; st.q--; st.out++; }
  }
}

// ---------- Пекарня ----------
// можно ли вообще получить товар на ферме (для покупателей, рецептов и заказов)
function canMake(g) {
  if (CROP[g]) return S.unlocked.includes(g) && (!GH_CROPS.includes(g) || S.up.greenhouse > 0);
  if (BAKE[g]) return S.up.bakery > 0 && Object.keys(BAKE[g].in).every(canMake);
  return { apple: S.trees.some(t => t.kind), egg: hens() > 0, milk: cows() > 0, flour: S.up.mill > 0, cheese: S.up.dairy > 0 }[g] || false;
}
const bakeOut = () => Object.values(S.bake.out).reduce((a, b) => a + b, 0);
const bakeHave = r => Math.min(...Object.entries(BAKE[r].in).map(([g, n]) => Math.floor((S.inv[g] || 0) / n)));

function loadBake(r) {

  if (n <= 0) return 0;
  for (const [g, k] of Object.entries(BAKE[r].in)) S.inv[g] -= n * k;
  for (let i = 0; i < n; i++) st.q.push(r);
  addFloat(BAKE_SPOT.x + .5, BAKE_SPOT.y + .5, `в печь ${n} ${GOODS[r].e}`);
  return n;
}
function collectBake() {

  if (!n) return false;
  const txt = Object.entries(out).filter(([, k]) => k).map(([g, k]) => `+${k} ${GOODS[g].e}`).join(' ');
  for (const [g, k] of Object.entries(out)) S.inv[g] = (S.inv[g] || 0) + k;
  S.life.baked = (S.life.baked || 0) + n;
  addFloat(BAKE_SPOT.x + .5, BAKE_SPOT.y - .5, txt);
  S.bake.out = {}; save(); renderUI(); return true;
}
function bakeAct(byHelper) {   // забрать готовое и поставить в печь выбранный рецепт
  if (!S.up.bakery) return false;
  const r = S.bake.sel, got = collectBake(), n = loadBake(r);
  if (!got && !n) {
    if (!byHelper) toast(S.bake.q.length >= BAKE_CAP ? `🥖 Печь занята — ${S.bake.q.length} в работе` : `🥖 Для ${GOODS[r].e} нужно ${bakeNeed(r)}`);
    return false;
  }
  if (n && !byHelper) toast(`🥖 В печи ${n} ${GOODS[r].e}${S.night ? ' — испечётся утром' : ''}`);
  if (n && !S.night) beginClock();
  save(); renderUI(); return true;
}
function updateBake(dt) {

  if (bakeOut() >= 20) return;   // полки заставлены — ждёт, пока заберут
  st.t += dt * S.up.bakery;
  while (st.q.length && st.t >= BAKE[st.q[0]].time) { st.t -= BAKE[st.q[0]].time; const r = st.q.shift(); st.out[r] = (st.out[r] || 0) + 1; }
}
function tapBakery() {

  openBakery();
}
function setBake(r) { S.bake.sel = r; save(); openBakery(); }
function openBakery() {

  const inQ = cnt(st.q.reduce((o, r) => (o[r] = (o[r] || 0) + 1, o), {}));

    <h3 style="margin:10px 0 4px">Что печь</h3>`;

    const ing = Object.entries(BAKE[r].in).map(([g, n]) => `<span style="color:${(S.inv[g] || 0) >= n ? '#3e9b3a' : '#b0503a'}">${n}${GOODS[g].e}</span>`).join(' + ');
    h += `<div class="recipe${r === sel ? ' on' : ''}${ok ? '' : ' off'}" onclick="setBake('${r}')"><span class="re">${GOODS[r].e}</span>
      <div class="rt"><b>${GOODS[r].name}</b> · ${sellPrice(r)}💰<br><small>${ing} · ${Math.round(BAKE[r].time / S.up.bakery)} сек${gain > 0 ? ` · <b style="color:#3e9b3a">+${gain}💰</b> выгоды` : ''}</small>
      ${ok ? '' : `<br><small style="color:#b0503a">Не хватает источника: ${Object.keys(BAKE[r].in).filter(g => !canMake(g)).map(g => GOODS[g].e).join(' ')}</small>`}</div>

    <div style="font-size:12px;color:#7a6650;margin-top:6px">Помощник на станции 🥖 печёт выбранный рецепт и забирает готовое. Печь работает днём.</div>
    <button class="wide alt" style="width:100%;margin-top:10px" onclick="closeNight()">Закрыть</button>`;
  $('sheet').dataset.view = ''; $('sheet').innerHTML = h;
  $('overlay').classList.add('show');

// ---------- Почта: заказы на несколько дней ----------
const ORDER_FROM = ['Кафе «Колосок»', 'Школьная столовая', 'Бабушка Нина', 'Ресторан «Подсолнух»', 'Ярмарка в городе', 'Детский лагерь', 'Гостиница у реки'];
const ORDER_BONUS = 1.6;   // заказ платит в 1,6 раза больше, чем лоток
function newOrder() {
  const pool = Object.keys(GOODS).filter(g => g !== 'sunflower' && canMake(g));
  if (pool.length < 2) return null;
  const k = Math.min(pool.length, S.day >= 10 && Math.random() < .5 ? 3 : 2);
  const goods = [];
  while (goods.length < k) {   // дорогое — чаще: вес растёт с ценой
    const w = pool.filter(g => !goods.includes(g)).map(g => [g, Math.sqrt(GOODS[g].price)]);
    let r = Math.random() * w.reduce((a, [, v]) => a + v, 0);
    goods.push((w.find(([, v]) => (r -= v) < 0) || w[w.length - 1])[0]);
  }
  const value = Math.min(5000, 120 + S.day * 45) * (0.8 + Math.random() * .4), items = {};
  for (const g of goods) items[g] = Math.max(2, Math.min(30, Math.round(value / k / GOODS[g].price)));
  return { from: pick(ORDER_FROM), items, due: S.day + 2, seen: false };
}
const orderWorth = o => Object.entries(o.items).reduce((a, [g, n]) => a + n * sellPrice(g), 0);
const orderReward = o => Math.round(orderWorth(o) * ORDER_BONUS / 10) * 10;
const orderReady = () => !!S.order && Object.entries(S.order.items).every(([g, n]) => (S.inv[g] || 0) >= n);
function orderMorning() {
  if (S.order && S.day > S.order.due) { S.order = null; S.orderNext = S.day; }   // просрочен — сразу новый
  if (!S.order && S.day >= Math.max(3, S.orderNext || 0)) S.order = newOrder();
}
function deliverOrder() {
  const o = S.order;
  if (!o) return false;
  if (!orderReady()) { toast('📬 Для заказа не хватает товара'); return false; }
  const money = orderReward(o);
  for (const [g, n] of Object.entries(o.items)) S.inv[g] -= n;
  S.coins += money; S.stats.earned += money; S.life.earned += money; S.life.orders = (S.life.orders || 0) + 1;
  for (const st of [S.stats, S.life]) { st.sold ??= {}; st.sold.order = (st.sold.order || 0) + money; }
  addFloat(MAIL.x + .5, MAIL.y + .5, `+${money}💰`);
  toast(`📬 Заказ отправлен! ${o.from}: +${money}💰. Новый придёт завтра`);
  S.order = null; S.orderNext = S.day + 1;
  save(); renderUI(); return true;
}

  const o = S.order;

  if (!o) h += `<div class="summary">Писем нет. ${S.day < 3 ? 'Первые заказы придут с 3-го дня.' : 'Новый заказ придёт утром.'}</div>`;
  else {
    o.seen = true;
    const left = o.due - S.day, money = orderReward(o);
    h += `<div class="summary">✉️ <b>${o.from}</b> просит прислать:</div>`;
    for (const [g, n] of Object.entries(o.items)) {
      const have = S.inv[g] || 0;
      h += `<div class="stat"><span>${GOODS[g].e} ${GOODS[g].name}</span><b style="color:${have >= n ? '#3e9b3a' : '#b0503a'}">${Math.min(have, n)} / ${n}${have >= n ? ' ✔' : ''}</b></div>`;
    }
    h += `<div class="summary">Награда: <b>${money}💰</b> — на лотке это ушло бы за ${orderWorth(o)}💰<br>
      Срок: ${left > 0 ? `ещё ${left + 1} дн. (до конца ${o.due}-го дня)` : '<b style="color:#b0503a">сегодня последний день</b>'}</div>
      <div class="row"><button class="wide" ${orderReady() ? '' : 'disabled'} onclick="closeNight(); setTasks([{ ...MAIL_SPOT, fn: deliverOrder }])">📦 Отправить</button>
      <button class="wide alt" onclick="declineOrder()">Отказаться</button></div>`;
  }
  h += `<button class="wide alt" style="width:100%;margin-top:10px" onclick="closeNight()">Закрыть</button>`;
  $('sheet').dataset.view = ''; $('sheet').innerHTML = h;
  $('overlay').classList.add('show');
  save();
}

// ---------- Коровник ----------

}

function routeThrough(list) {   // жадный обход: каждый раз к ближайшей клетке
  const out = []; let cx = Math.floor(P.x), cy = Math.floor(P.y);
  const rest = list.slice();
  while (rest.length) {
    let bi = 0, bd = 1e9;
    rest.forEach((t, k) => { const d = Math.abs(t.x - cx) + Math.abs(t.y - cy); if (d < bd) { bd = d; bi = k; } });
    const t = rest.splice(bi, 1)[0]; out.push(t); cx = t.x; cy = t.y;
  }
  return out;
}

// ================== ПЕРЕДВИЖЕНИЕ ==================
const walkable = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !blocked[y][x];
function findPath(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) return null;
  const key = (x, y) => y * W + x, prev = new Map([[key(sx, sy), -1]]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (walkable(nx, ny) && !prev.has(key(nx, ny))) { prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]); }
    }
  }
  if (!prev.has(key(tx, ty))) return null;
  const out = []; let k = key(tx, ty);
  while (k !== -1) { out.push([k % W, Math.floor(k / W)]); k = prev.get(k); }
  return out.reverse();
}
function setTasks(list) { tasks = list; path = []; nextTask(); }
function nextTask() {
  while (tasks.length) {
    const t = tasks[0];
    const p = findPath(Math.floor(P.x), Math.floor(P.y), t.x, t.y);
    if (p) { path = p; return; }
    tasks.shift();
  }
  path = [];
}

function stepToward(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy), st = speed * dt;
  const sdx = dx - dy; if (Math.abs(sdx) > 0.02) o.flip = sdx < 0;
  if (d <= st) { o.x = tx; o.y = ty; return true; }
  o.x += dx / d * st; o.y += dy / d * st; return false;
}

function updatePlayer(dt) {
  if (P.work > 0) { P.work -= dt; P.moving = false; return; }
  if (path.length) {
    const [tx, ty] = path[0];
    if (stepToward(P, tx + .5, ty + .5, SPEED, dt)) path.shift();
    P.moving = true; P.phase += dt * 13;
  } else {
    P.moving = false;
    if (tasks.length) { const t = tasks.shift(); if (t.fn) { t.fn(); P.work = 0.2; } nextTask(); }
    else if (!S.night && Math.floor(P.x) === COUNTER.x && Math.floor(P.y) === COUNTER.y && (P.sellT = (P.sellT || 0) - dt) <= 0) {
      P.sellT = 0.5;   // стоишь за прилавком — торгуешь со всеми, на кого хватает товара
      const v = visitors.find(v => v.state === 'waiting' && (S.inv[v.crop] || 0) >= v.qty);
      if (v) { sell(v); P.work = 0.25; }
    }
  }
}

function updateVisitors(dt) {
  for (const v of visitors) {
    if (v.wps.length) {
      const w = v.wps[0];
      if (stepToward(v, w.x, w.y, 2.2, dt)) v.wps.shift();
      v.moving = true; v.phase += dt * 11;
    } else {
      v.moving = false;
      if (v.state === 'coming') {
        if (v.slot >= MAX_QUEUE) { S.stats.missed++; leave(v, 'angry'); toast('😤 Очередь полная, покупатель ушёл'); }   // дошёл — а мест нет
        else { v.state = 'waiting'; v.flip = true; }   // лицом к лавке
      }
    }
    if (v.moodT > 0) v.moodT -= dt;
    if (v.state === 'waiting' && !S.night) {
      v.pat -= dt;
      if (v.pat <= 0) { S.stats.missed++; leave(v, 'angry'); toast('😠 Покупатель не дождался'); }
    }
  }
  visitors = visitors.filter(v => !(v.state === 'leaving' && v.x < -1.5));
}

  floats.forEach(f => f.t += dt); floats = floats.filter(f => f.t < 1.2);
  saveAcc += dt; if (saveAcc > 5) { saveAcc = 0; save(); }

}
function step(dt) {

  updateHens(dt);
  updateCows(dt);
  if (!S.night && !S.started && shouldAutoStart()) beginClock();
  if (!S.night && S.started) {
    S.t += dt;
    for (const p of S.plots) if (p.crop && p.prog < 1) p.prog = Math.min(1, p.prog + dt * growMult() / CROP[p.crop].grow);
    for (const p of S.gh) if (p.crop && p.prog < 1) p.prog = Math.min(1, p.prog + dt * growMult() / (CROP[p.crop].grow * GH_SLOW));
    for (const t of S.trees) if (t.kind) {
      const T = TREES[t.kind];
      if (t.grow < 1) t.grow = Math.min(1, t.grow + dt * growMult() / T.mature);
      else if (t.fruit < 1) t.fruit = Math.min(1, t.fruit + dt * growMult() / T.regrow);
    }
    const fh = fedToday();   // сытые куры несут яйца
    if (fh) { S.coop.layT += dt * fh; while (S.coop.layT >= EGG_EVERY) { S.coop.layT -= EGG_EVERY; S.coop.eggs = Math.min(30, S.coop.eggs + 1); } }
    updateProd(dt); updateBake(dt);
    const fc = cowsFedToday();   // сытые коровы дают молоко
    if (fc) { S.barn.milkT += dt * fc; while (S.barn.milkT >= MILK_EVERY) { S.barn.milkT -= MILK_EVERY; S.barn.milk = Math.min(40, S.barn.milk + 1); } }
    // покупатели идут весь день: первый через пару секунд, последний — уже на закате,
    // а вечером, после работы, их заметно больше
    const f = Math.min(1, S.t / (DAY_LEN * 0.97)), share = f < 0.6 ? f / 1.24 : (0.6 + (f - 0.6) * 1.6) / 1.24;
    const due = Math.min(S.toSpawn, Math.floor(S.toSpawn * share + 0.6));
    while (S.spawned < due) {
      // решает, остаться ли, сам покупатель — когда дойдёт до конца очереди (см. updateVisitors);
      // здесь — только предел на число людей на дороге
      if (queueCount() >= MAX_QUEUE + 3) { S.spawned++; S.stats.missed++; toast('😤 Очередь полная, покупатель ушёл'); }
      else spawnVisitor();
    }
    // на закате лавка закрывается, но последних покупателей обслужить можно
    if (S.t >= DAY_LEN) {
      if (!S.closing) { S.closing = true; if (queueCount()) toast('🌇 Лавка закрывается — обслужи последних покупателей'); }
      if (!queueCount() || S.t >= DAY_LEN + 30) endDay();
    }
  }
}

let down = null, pinch = null;
const pointers = new Map();

function onTap(sx, sy) {
  const wx = (sx - cw / 2) / zoom + cam.x, wy = (sy - ch / 2) / zoom + cam.y;
  // сначала покупатели (вместе с облачком над головой)
  if (S.night) for (const b of badgeHits) if (Math.abs(wx - b.x) < b.w / 2 + 4 && Math.abs(wy - b.y) < 14) { openUpgrade(b.key); return; }
  let bv = null, bdv = 1e9;
  for (const v of visitors) {
    if (v.state === 'leaving') continue;
    const c = iso(v.x, v.y), dx = Math.abs(wx - c.x);
    if (dx > 24 || wy < c.y - 84 || wy > c.y + 8) continue;
    if (dx < bdv) { bdv = dx; bv = v; }
  }
  if (bv) { tapVisitor(bv); return; }
  const fx = (wx / (TW / 2) + wy / (TH / 2)) / 2, fy = (wy / (TH / 2) - wx / (TW / 2)) / 2;
  const tx = Math.floor(fx), ty = Math.floor(fy);
  if (tx < 0 || ty < 0 || tx >= W || ty >= H) return;
  if (S.night) { const k = upAtNight(tx, ty); if (k) { openUpgrade(k); return; } }
  if (tx === MAIL.x && ty === MAIL.y) { openMail(); return; }
  if (tx === 4 && (ty === 2 || ty === 3)) { tapBakery(); return; }
  const si = slotAt(tx, ty);
  if (si >= 0) { tapPlot(si); return; }
  const oi = orchardAt(tx, ty);
  if (oi >= 0) { tapTree(oi); return; }
  const gi = ghAt(tx, ty);
  if (gi >= 0) { tapGh(gi); return; }
  if (inCoopArea(tx, ty)) { tapCoop(); return; }
  if (inBarnArea(tx, ty)) { tapBarn(); return; }
  const li = lotAt(tx, ty);
  if (li >= 0 && S.up.clear <= li) { toast('🪓 Ночью тапни сюда — расчистишь лес под новое здание'); return; }
  const pk = prodAt(tx, ty);
  if (pk) { tapProd(pk); return; }
  if (tx >= 17 && !walkable(tx, ty)) return;   // дальний лес
  if (ty === 10 && (tx === 3 || tx === 4)) { setTasks([{ x: COUNTER.x, y: COUNTER.y }]); toast('🏪 За прилавком фермер сам продаёт всем, на кого хватает товара'); return; }

}

// Общий график: выручка, траты и прибыль по дням или нарастающим итогом (SVG)
let econCum = false;
function econChart(hist) {
  const Wd = 320, Hd = 150, L = 34, R = 8, T = 10, B = 22;
  let pts = hist.map(x => ({ d: x.d, e: x.e, s: x.s, n: x.e - x.s, now: x.now }));
  if (econCum) { let e = 0, sp = 0; pts = pts.map(x => ({ ...x, e: e += x.e, s: sp += x.s, n: e - sp })); }
  if (pts.length < 2) return '<div style="color:#7a6650;font-size:13px;margin:4px 0">График появится со второго дня — каждый вечер добавляется точка</div>';
  const vals = pts.flatMap(x => [x.e, x.s, x.n]), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const X = i => L + i * (Wd - L - R) / (pts.length - 1), Y = v => T + (max - v) / (max - min) * (Hd - T - B);
  const fmt = n => Math.abs(n) >= 10000 ? Math.round(n / 1000) + 'к' : Math.round(n).toLocaleString('ru-RU');
  const line = (k, col, w, dash) => `<polyline fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${dash ? ' stroke-dasharray="4 3"' : ''} points="${pts.map((x, i) => X(i).toFixed(1) + ',' + Y(x[k]).toFixed(1)).join(' ')}"/>`;
  const area = `<polygon fill="rgba(91,141,239,.12)" points="${X(0)},${Y(0)} ${pts.map((x, i) => X(i).toFixed(1) + ',' + Y(x.n).toFixed(1)).join(' ')} ${X(pts.length - 1)},${Y(0)}"/>`;
  const grid = [max, (max + min) / 2, min].filter((v, i, a) => a.indexOf(v) === i).map(v => `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6d9bb" stroke-width="1"/><text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="#7a6650">${fmt(v)}</text>`).join('');
  const zero = min < 0 ? `<line x1="${L}" x2="${Wd - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#7a6650" stroke-width="1"/>` : '';
  const step = Math.max(1, Math.ceil(pts.length / 6));
  const xl = pts.map((x, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${X(i)}" y="${Hd - 6}" text-anchor="middle" font-size="9" fill="#7a6650">${x.now ? 'сег.' : x.d}</text>` : '').join('');
  const last = pts[pts.length - 1];
  const dot = (k, col) => `<circle cx="${X(pts.length - 1)}" cy="${Y(last[k])}" r="3" fill="${col}"/>`;
  return `<svg viewBox="0 0 ${Wd} ${Hd}" style="width:100%;height:auto;background:#f6eedb;border-radius:10px">${grid}${zero}${area}
    ${line('s', '#e07a50', 2, true)}${line('e', '#3e9b3a', 2.2)}${line('n', '#4570c4', 2.6)}${dot('e', '#3e9b3a')}${dot('s', '#e07a50')}${dot('n', '#4570c4')}${xl}</svg>
    <div style="font-size:12px;color:#7a6650;text-align:center;margin-top:2px"><b style="color:#3e9b3a">—</b> выручка ${fmt(last.e)} · <b style="color:#e07a50">- -</b> траты ${fmt(last.s)} · <b style="color:#4570c4">—</b> прибыль ${fmt(last.n)}</div>`;
}

    }
    h += `<div class="up"><div class="ico">${u.ico}</div><div class="txt"><b>${u.name} <small>ур. ${l}/${u.max}</small></b><small>${maxed ? 'Максимум' : u.desc(l)}</small></div>
      <button ${maxed || S.coins < cost ? 'disabled' : ''} onclick="buyUpgrade('${key}')">${maxed ? '✔' : cost + '💰'}</button></div>`;
  }
  h += `<h3 style="margin:14px 0 0">Новые культуры</h3>`;
  for (const c of CROPS) {
    if (S.unlocked.includes(c.id)) continue;
    const early = S.day + 1 < c.unlockDay;
    h += `<div class="up"><div class="ico">${early ? '❓' : c.e}</div><div class="txt"><b>${early ? '???' : c.name}</b>
      <small>${early ? `Откроется после ${c.unlockDay - 1}-го дня` : `Семена ${c.seed}💰 · продаётся за ${c.price}💰 · ${GH_CROPS.includes(c.id) ? `🏡 только в теплице: растёт ${c.grow * GH_SLOW}с, гроздь ×${GH_YIELD}` : `растёт ${c.grow}с`}`}</small></div>
      <button ${early || S.coins < c.unlockCost ? 'disabled' : ''} onclick="unlockCrop('${c.id}')">${c.unlockCost}💰</button></div>`;
  }
  h += `<div class="row" style="margin-top:14px"><button class="wide alt" onclick="closeNight()">🌾 К грядкам</button>
        <button class="wide" style="background:#ffd34d" onclick="morning()">☀️ Начать день ${S.day + 1}</button></div>
`;
  $('sheet').dataset.view = ''; $('sheet').innerHTML = h;
  $('overlay').classList.add('show');
}
function closeNight() { $('overlay').classList.remove('show'); $('sheet').dataset.view = ''; }
function morning() {   // итог дня — в историю (последние 14 дней)
  S.hist ??= [];
  S.hist.push({ d: S.day, e: S.stats.earned || 0, s: spentSum(S.stats), sv: S.stats.served || 0, m: S.stats.missed || 0 });
  if (S.hist.length > 400) S.hist.shift();   // история для общего графика
  S.day++; startDay();
}
let resetArmed = false;
function resetGame(btn) {
  if (!resetArmed) { resetArmed = true; btn.textContent = 'Точно стереть прогресс? Нажми ещё раз'; setTimeout(() => { resetArmed = false; if (btn.isConnected) btn.textContent = 'Начать заново'; }, 3000); return; }
  resetArmed = false; S = newState(); S.prod = { mill: { q: 0, t: 0, out: 0 }, dairy: { q: 0, t: 0, out: 0 } }; S.life.flour = S.life.cheese = 0; applyLots(); P.x = S.player.x; P.y = S.player.y; visitors = []; helpers = []; hensState = []; cowsState = []; setTasks([]); startDay();
}

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

$('harvestAll').onclick = () => {   // грядки, яблони и гнездо — по кратчайшему маршруту
  const covered = new Set(S.helpers.flatMap(c => c.stations));
  const kindOf = j => Object.keys(PROD).find(k => PROD[k].spot.x === j.x && PROD[k].spot.y === j.y) || (j.x === BAKE_SPOT.x && j.y === BAKE_SPOT.y ? 'bakery' : j.x === COOP_SPOT.x && j.y === COOP_SPOT.y ? 'coop' : j.x === BARN_SPOT.x && j.y === BARN_SPOT.y ? 'barn' : orchardAt(j.x, j.y) >= 0 ? 'orchard' : ghAt(j.x, j.y) >= 0 ? 'gh' : 'field');
  const zoneTaken = j => zoneOwner(zoneOfXY(j.x, j.y)) >= 0;   // на поле — только участки без помощника
  const all = readyJobs(), mine = all.filter(j => kindOf(j) === 'field' ? !zoneTaken(j) : !covered.has(kindOf(j)));
  const list = mine.map(j => ({ x: j.x, y: j.y, fn: () => j.act('player') }));
  if (!list.length) { toast(all.length ? '🧑‍🌾 Это уже собирают помощники' : 'Пока нечего собирать'); return; }
  setTasks(routeThrough(list));
};
$('plantAll').onclick = () => {
  const c = CROP[S.sel], can = c.seed ? Math.floor(S.coins / c.seed) : Infinity;
  const list = [];
  if (GH_CROPS.includes(S.sel)) {   // помидоры и клубника — в теплицу
    if (!S.gh.length) { toast(`${c.e} растёт только в теплице 🏡 — построй её ночью`); return; }
    const ghSows = S.helpers.some(h => h.stations.includes('gh') && h.ghReplant);
    S.gh.forEach((p, i) => { if (!p.crop && !ghSows) list.push({ x: GH_SLOTS[i].x, y: GH_SLOTS[i].y, fn: () => plotAct(i, 'plant', true) }); });
    if (!list.length) { toast(ghSows && S.gh.some(p => !p.crop) ? '🧑‍🌾 Теплицу засеет помощник' : 'В теплице свободных грядок нет'); return; }
  } else {
    const sows = i => { const o = zoneOwner(zoneOf(i)); return o >= 0 && S.helpers[o].replant; };   // там сажает помощник
    S.plots.forEach((p, i) => { if (!p.crop && !sows(i)) list.push({ x: PLOT_SLOTS[i].x, y: PLOT_SLOTS[i].y, fn: () => plotAct(i, 'plant') }); });
    if (!list.length) { toast(S.plots.some((p, i) => !p.crop) ? '🧑‍🌾 Пустые грядки засеют помощники' : 'Свободных грядок нет'); return; }
  }
  if (!can) { toast('Не хватает монет — посади бесплатный подсолнух 🌻'); return; }
  setTasks(routeThrough(list).slice(0, can));
};
$('nightBtn').onclick = () => openNight(false);
$('dayBtn').onclick = () => morning();
$('profileBtn').onclick = openProfile;
$('coins').onclick = openEconomy;
$('menuBtn').onclick = openMenu;

// ================== ЧИТ-МЕНЮ (тройной тап по «День N») ==================
const CHEATS = {
  money:   ['💰 +1000', () => { S.coins += 1000; }],
  money2:  ['💰 +10 000', () => { S.coins += 10000; }],
  goods:   ['📦 +10 всего', () => { for (const id of [...S.unlocked, 'apple', 'egg', 'milk', 'flour', 'cheese', ...(S.up.bakery ? Object.keys(BAKE) : [])]) S.inv[id] = (S.inv[id] || 0) + 10; }],
  grow:    ['🌱 Всё созрело', () => { [...S.plots, ...S.gh].forEach(p => { if (p.crop) p.prog = 1; }); S.trees.forEach(t => { if (t.kind) { t.grow = 1; t.fruit = 1; } }); if (hens()) S.coop.eggs += 5; if (cows()) S.barn.milk += 3; for (const k in PROD) if (S.up[k]) S.prod[k].out += 3; if (S.up.bakery) S.bake.out[S.bake.sel] = (S.bake.out[S.bake.sel] || 0) + 3; }],
  crops:   ['🔓 Все культуры', () => { S.unlocked = CROPS.map(c => c.id); }],
  maxup:   ['⭐ Все улучшения', () => {
    for (const [k, u] of Object.entries(UPGRADES)) S.up[k] = u.max;
    while (S.plots.length < MAX_PLOTS) S.plots.push({ crop: null, prog: 0 });
    syncHelpers(); syncTrees(); syncHens(); syncCows(); syncGh(); applyLots();
  }],
  feed:    ['🐔🐄 Накормить всех', () => { if (hens()) { S.coop.fedDay = S.night ? S.day + 1 : S.day; S.coop.fedHens = hens(); } if (cows()) { S.barn.fedDay = S.night ? S.day + 1 : S.day; S.barn.fedCows = cows(); } }],
  visitor: ['🧍 Покупатель', () => { if (!S.night && queueCount() < MAX_QUEUE) { spawnVisitor(); S.spawned--; } }],
  evening: ['🌇 Вечер', () => { if (!S.night) { S.started = true; S.t = Math.max(S.t, DAY_LEN * 0.75); } }],
  sunset:  ['🌆 Закат', () => { if (!S.night) { S.started = true; S.t = Math.max(S.t, DAY_LEN - 4); } }],
  night:   ['🌙 Сразу ночь', () => { if (!S.night) { S.started = true; endDay(); return true; } }],
  morning: ['☀️ Сразу утро', () => { if (S.night) morning(); else { endDay(); morning(); } return true; }],
};
function cheat(k) {
  const leave = CHEATS[k][1]();
  save(); renderUI();
  if (!leave) openCheats(); else if (!S.night) closeNight();
}
function setSpeed(x) { timeScale = x; renderUI(); openCheats(); }
function openCheats() {
  let h = `<h2>🛠 Чит-меню</h2><div style="font-size:13px;color:#7a6650;margin-bottom:8px">Только для тестов</div>
    <div style="font-weight:700;margin-bottom:4px">Скорость времени</div><div class="cheats" style="grid-template-columns:repeat(4,1fr)">`;
  for (const x of [1, 3, 10, 30]) h += `<button class="${timeScale === x ? 'on' : 'alt'}" onclick="setSpeed(${x})">×${x}</button>`;
  h += `</div><div class="cheats">`;
  for (const [k, [label]] of Object.entries(CHEATS)) h += `<button class="alt" onclick="cheat('${k}')">${label}</button>`;
  h += `</div><button class="wide" style="width:100%" onclick="closeNight()">Закрыть</button>`;
  $('sheet').dataset.view = ''; $('sheet').innerHTML = h;
  $('overlay').classList.add('show');
}
$('helperBtn').onclick = openHelpers;
$('sunbox').onclick = () => { if (!S.night && !S.started) beginClock(); else if (!S.night) toast(`Покупателей сегодня: ${S.spawned} из ${S.toSpawn}`); };
$('overlay').onclick = e => { if (e.target.id === 'overlay') closeNight(); };

// ================== СТАРТ ==================
syncHelpers(); syncTrees(); syncHens(); syncCows(); syncGh(); applyLots(); orderMorning();
new ResizeObserver(resize).observe($('stage'));
resize();
if (tablet) { centerCam(); clampCam(); }   // на планшете — вся ферма
else { const a = iso(3, 11), b = iso(10, 4); cam.x = (a.x + b.x) / 2; cam.y = (a.y + b.y) / 2 - 10; clampCam(); }   // на телефоне — поле и лавка в кадре
if (S.toSpawn === 0 && !S.night) startDay(); else renderUI();
if (!S.night) S.toSpawn = Math.max(S.toSpawn, visitorsPerDay());   // старые сохранения получают новый поток покупателей сразу
if (S.night) openNight(false);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });   // свернули — сохраняемся сразу
addEventListener('pagehide', save);
requestAnimationFrame(tick);
</script>
</body>
