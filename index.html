<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5a9e4b">
<title>Солнечная ферма</title>
<style>
  :root {
    --panel: #fff8e7; --ink: #3b2a1a; --accent: #f4a92b; --good: #3e9b3a; --bad: #d9534f; --line: #e2d3b0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #4e8c41; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; background: #4e8c41; }

  #stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 10px 0; pointer-events: none; }
  .hr { display: flex; align-items: center; gap: 6px; }
  .round { pointer-events: auto; width: 42px; height: 42px; padding: 0; border-radius: 50%; background: rgba(255,248,231,.95);
           font-size: 20px; line-height: 42px; box-shadow: 0 2px 0 rgba(0,0,0,.18); flex: 0 0 auto; }
  #menuBtn { font-size: 22px; font-weight: 900; }
  .hudrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .pill { background: rgba(255,248,231,.92); border-radius: 999px; padding: 4px 10px; font-size: 15px; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #sunbox { position: relative; width: 132px; height: 52px; border-radius: 14px; overflow: hidden; pointer-events: auto;
            box-shadow: 0 2px 0 rgba(0,0,0,.15); transition: background 1.5s; background: #9fd8ff; cursor: default; }
  #sunbox svg { position: absolute; inset: 0; }
  #sunIcon { position: absolute; font-size: 18px; line-height: 1; transform: translate(-50%, -50%); transition: left .5s linear, top .5s linear; }
  #phase { position: absolute; left: 0; right: 0; bottom: 2px; white-space: nowrap; text-align: center; font-size: 11px; font-weight: 800; color: #3b2a1a; letter-spacing: .02em; }
  #sunbox.dark #phase { color: #e8ecff; }
  .hcard { background: #f0e5cb; border-radius: 12px; padding: 8px 10px; margin-top: 8px; font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { padding: 6px 9px; font-size: 13px; background: #fff; border: 2px solid var(--line); border-radius: 999px; }
  .chip.on { background: #3e9b3a; border-color: #3e9b3a; color: #fff; }
  .cheats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .cheats button { padding: 9px 6px; font-size: 14px; }
  .cheats button.on { background: #3e9b3a; color: #fff; }

  #inv { display: flex; gap: 4px; flex-wrap: wrap; font-size: 13px; font-weight: 800; margin: 8px 64px 0 0; }
  #inv span { background: rgba(255,248,231,.88); border-radius: 999px; padding: 2px 8px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  #seeds { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px;
           max-height: calc(100% - 300px); overflow-y: auto; padding: 4px 2px; scrollbar-width: none; }
  .seed { position: relative; flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,248,231,.95);
          border: 3px solid transparent; box-shadow: 0 2px 0 rgba(0,0,0,.18); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .seed .e { font-size: 24px; margin-top: -6px; }
  .seed .c { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 800; }
  .seed.sel { border-color: var(--accent); background: #fff1d1; transform: scale(1.08); }
  .seed.dis { opacity: .45; }
  #actions { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px calc(10px + env(safe-area-inset-bottom));
             display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #actions button { pointer-events: auto; }
  .arow { display: flex; gap: 14px; justify-content: center; }
  .act { width: 64px; height: 64px; padding: 0; border-radius: 50%; background: rgba(255,248,231,.96); box-shadow: 0 3px 0 rgba(0,0,0,.2);
         display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; line-height: 1.1; }
  .act span { font-size: 24px; line-height: 1; margin-bottom: 2px; }
  .sunrise { background: #ffd34d; padding: 12px 22px; border-radius: 999px; font-size: 17px; box-shadow: 0 3px 0 rgba(0,0,0,.2); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .menu button { display: block; width: 100%; text-align: left; margin-top: 6px; background: #f0e5cb; padding: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  button { font: inherit; font-weight: 700; border: none; border-radius: 10px; padding: 10px 8px; background: var(--accent); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .45; }
  button.wide { flex: 1; }
  button.alt { background: #e9dcbc; }

  #overlay { position: fixed; inset: 0; background: rgba(10,15,35,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; }
  #sheet { width: 100%; max-width: 640px; max-height: 86%; overflow-y: auto; background: var(--panel); border-radius: 18px 18px 0 0;
           padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); animation: up .3s; }
  #sheet h2 { margin: 0 0 6px; font-size: 20px; }
  .summary { background: #f0e5cb; border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .up { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .up .ico { font-size: 28px; width: 36px; text-align: center; }
  .up .txt { flex: 1; font-size: 14px; }
  .up .txt b { display: block; font-size: 15px; }
  .up .txt small { color: #7a6650; }
  .up button { min-width: 78px; padding: 8px; }

  #toast { position: fixed; left: calc(50% - 30px); top: 20%; transform: translateX(-50%); background: rgba(40,30,20,.9); color: #fff;
           padding: 8px 14px; border-radius: 18px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
           width: max-content; max-width: calc(100% - 100px); text-align: center; }
  #toast.show { opacity: 1; }
  @keyframes up { from { transform: translateY(100%) } to { transform: none } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="hudrow">
        <button class="round" id="profileBtn" title="Профиль">🧑‍🌾</button>
        <div id="sunbox" title="Время суток">
          <svg viewBox="0 0 132 52" width="132" height="52"><path d="M14 40 A52 26 0 0 1 118 40" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-dasharray="3 4"/>
            <line x1="6" y1="40" x2="126" y2="40" stroke="rgba(60,40,20,.35)" stroke-width="1.5"/></svg>
          <span id="sunIcon">☀️</span><span id="phase">Рассвет</span>
        </div>
        <div class="hr"><span class="pill" id="coins">💰 0</span><button class="round" id="menuBtn" title="Меню">☰</button></div>
      </div>
      <div id="inv"></div>
    </div>
    <div id="seeds"></div>
    <div id="actions">
      <button class="wide sunrise" id="dayBtn" style="display:none">☀️ Начать день 2</button>
      <div class="arow">
        <button class="act" id="harvestAll"><span>🧺</span>Собрать</button>
        <button class="act" id="plantAll"><span>🌱</span>Засеять</button>
        <button class="act" id="nightBtn" style="display:none"><span>⬆️</span>Улучшить</button>
        <button class="act" id="helperBtn" style="display:none"><span>🧑‍🌾</span>Команда</button>
      </div>
    </div>
  </div>
</div>

<div id="overlay"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
// ================== ДАННЫЕ ==================
const CROPS = [
  // бесплатная культура: всегда можно что-то посадить, даже без денег
  { id: 'sunflower',  name: 'Подсолнух', e: '🌻', seed: 0, grow: 6,  price: 2,  unlockCost: 0,   unlockDay: 1 },
  { id: 'wheat',      name: 'Пшеница',  e: '🌾', seed: 2,  grow: 8,  price: 5,  unlockCost: 0,   unlockDay: 1 },
  { id: 'carrot',     name: 'Морковь',  e: '🥕', seed: 4,  grow: 12, price: 10, unlockCost: 30,  unlockDay: 2 },
  { id: 'tomato',     name: 'Помидор',  e: '🍅', seed: 6,  grow: 16, price: 16, unlockCost: 80,  unlockDay: 3 },
  { id: 'corn',       name: 'Кукуруза', e: '🌽', seed: 10, grow: 22, price: 26, unlockCost: 160, unlockDay: 5 },
  { id: 'strawberry', name: 'Клубника', e: '🍓', seed: 15, grow: 28, price: 40, unlockCost: 300, unlockDay: 7 },
  { id: 'pumpkin',    name: 'Тыква',    e: '🎃', seed: 25, grow: 40, price: 70, unlockCost: 600, unlockDay: 10 },
];
const CROP = Object.fromEntries(CROPS.map(c => [c.id, c]));

const DAY_LEN = 180;      // секунд реального времени на день
const MAX_QUEUE = 5;
const SPEED = 3.2;        // клеток в секунду

// Деревья сада: сажаются один раз и потом плодоносят снова и снова.
// Чтобы добавить грушу — допиши сюда запись и товар в GOODS.
const TREES = {
  apple: { name: 'Яблоня', e: '🍎', fruit: 'apple', sapling: 40, mature: 150, regrow: 50, yield: 3, leaf: '#4f9e45', leafLight: '#6dbb5a', fruitColor: '#e0393e' },
};
// Всё, что продаётся на лотке
const GOODS = {
  ...Object.fromEntries(CROPS.map(c => [c.id, { e: c.e, name: c.name, price: c.price }])),
  apple: { e: '🍎', name: 'Яблоко', price: 12 },
  egg:   { e: '🥚', name: 'Яйцо',   price: 9 },
  milk:  { e: '🥛', name: 'Молоко', price: 22 },
};
const FEED_PER_HEN = 3;            // растений на курицу на день
const EGG_EVERY = DAY_LEN / 5;     // сытая курица несёт ~5 яиц за день
const COW_FOOD = ['sunflower', 'wheat'];   // коровы едят только подсолнухи и пшеницу
const FEED_PER_COW = 4;            // растений на корову на день
const MILK_EVERY = DAY_LEN / 3;    // сытая корова даёт ~3 бутылки молока за день

const UPGRADES = {
  land:   { name: 'Расширить участок', ico: '🚜', desc: l => `+4 грядки (сейчас ${8 + l*4})`, cost: l => 40 + l*l*40 + l*30, max: 4 },
  orchard:{ name: 'Фруктовый сад',     ico: '🌳', desc: l => l === 0 ? 'Место под 2 яблони. Саженец 40💰, растёт ~день, потом плодоносит каждый день' : '+2 места под деревья', cost: l => [150, 260][l], max: 2 },
  coop:   { name: 'Курятник',          ico: '🐔', desc: l => l === 0 ? 'Курятник и 2 курицы. Ночью корми их урожаем — днём несут яйца' : `+1 курица (сейчас ${l + 1})`, cost: l => [150, 100, 140, 190][l], max: 4 },
  barn:   { name: 'Коровник',          ico: '🐄', desc: l => l === 0 ? 'Коровник, пастбище и корова. Ночью корми подсолнухами или пшеницей — днём даёт молоко' : `+1 корова (сейчас ${l})`, cost: l => [220, 180, 260][l], max: 3 },
  ads:    { name: 'Реклама',           ico: '📣', desc: l => `+3 покупателя в день`,           cost: l => 30 + l*35,           max: 10 },
  fert:   { name: 'Удобрения',         ico: '🧪', desc: l => `Рост быстрее (+${l*20}% → +${(l+1)*20}%)`, cost: l => 50 + l*60, max: 5 },
  sign:   { name: 'Красивая вывеска',  ico: '🪧', desc: l => `Цены выше (+${l*10}% → +${(l+1)*10}%)`, cost: l => 60 + l*70, max: 6 },
  helper: { name: 'Помощник',         ico: '🧑‍🌾', desc: l => `Назначь его на поле, в сад, в курятник или за прилавок (помощников: ${l} → ${l+1})`, cost: l => [120, 280, 520][l], max: 3 },
  bench:  { name: 'Скамейка',          ico: '🪑', desc: l => `Покупатели ждут дольше (+5 сек)`, cost: l => 25 + l*30, max: 5 },
};

// ================== КАРТА ==================
// Изометрия: клетка (x, y) → экран ((x−y)·TW/2, (x+y)·TH/2)
const TW = 64, TH = 32, W = 17, H = 14;   // справа от поля — пастбище с коровником
const ground = Array.from({ length: H }, () => Array(W).fill('g'));
const blocked = Array.from({ length: H }, () => Array(W).fill(false));
const decor = [];

for (let x = 0; x < W; x++) { ground[12][x] = 'r'; ground[13][x] = 'r'; }   // дорога
for (let y = 1; y <= 11; y++) ground[y][5] = 'p';                          // тропинки
for (let x = 6; x <= 15; x++) ground[7][x] = 'p';
for (let x = 2; x <= 8; x++) ground[11][x] = 'p';                          // площадка у лавки
for (const [x, y] of [[10,9],[11,9],[10,10],[11,10]]) { ground[y][x] = 'w'; blocked[y][x] = true; }  // пруд

// 24 места под грядки: открываются блоками по 4
const PLOT_SLOTS = [];
for (const [xs, ys] of [[[6,7,8,9],[2,3]], [[6,7,8,9],[4]], [[6,7,8,9],[5]], [[10,11],[2,3]], [[10,11],[4,5]]])
  for (const y of ys) for (const x of xs) PLOT_SLOTS.push({ x, y });
const MAX_PLOTS = PLOT_SLOTS.length;
PLOT_SLOTS.forEach(s => ground[s.y][s.x] = 's');
const slotAt = (x, y) => PLOT_SLOTS.findIndex(s => s.x === x && s.y === y);

function addBox(kind, x, y, w, d) {
  decor.push({ kind, x, y, w, d, z: x + w + y + d - 1.01 });
  for (let i = x; i < x + w; i++) for (let j = y; j < y + d; j++) blocked[j][i] = true;
}
addBox('house', 2, 2, 2, 2);
addBox('stall', 3, 10, 2, 1);
const COUNTER = { x: 4, y: 9 };   // где стоит фермер за прилавком

// Сад слева от дома: 4 места под деревья
const ORCHARD_SLOTS = [{ x: 1, y: 5 }, { x: 3, y: 5 }, { x: 1, y: 7 }, { x: 3, y: 7 }];
for (let y = 5; y <= 8; y++) for (let x = 1; x <= 3; x++) ground[y][x] = 'o';
const orchardAt = (x, y) => ORCHARD_SLOTS.findIndex(s => s.x === x && s.y === y);

// Курятник (клетки 6–7 × 8) и вольер (клетки 6–9 × 9–10)
const COOP_SPOT = { x: 8, y: 8 };   // здесь фермер кормит кур и собирает яйца из гнезда
const YARD = { x0: 6, y0: 9, x1: 10, y1: 11 };
decor.push({ kind: 'coop', z: 6 + 2 + 8 + 1 - 1.01 });
for (let x = 6; x <= 7; x++) blocked[8][x] = true;
for (let y = 9; y <= 10; y++) for (let x = 6; x <= 9; x++) { blocked[y][x] = true; ground[y][x] = 'y'; }
const inCoopArea = (x, y) => (y === 8 && (x === 6 || x === 7)) || (y >= 9 && y <= 10 && x >= 6 && x <= 9) || (x === COOP_SPOT.x && y === COOP_SPOT.y);
// забор: задние отрезки рисуются до кур, передние — после
for (const [a, b, back] of [[[8,9],[9,9],1],[[9,9],[10,9],1],[[6,9],[6,10],1],[[6,10],[6,11],1],
                            [[6,11],[7,11],0],[[7,11],[8,11],0],[[8,11],[9,11],0],[[9,11],[10,11],0],[[10,9],[10,10],0],[[10,10],[10,11],0]])
  decor.push({ kind: 'fence', a, b, z: (a[0] + b[0]) / 2 + (a[1] + b[1]) / 2 + (back ? -0.4 : 0.4) });

// Коровник (клетки 14–15 × 1–2) и пастбище (клетки 13–15 × 3–6), кормушка у тропинки
const BARN_SPOT = { x: 14, y: 7 };
const PASTURE = { x0: 13, y0: 3, x1: 16, y1: 7 };
decor.push({ kind: 'barn', z: 16.6 });   // раньше коров на пастбище (они всегда южнее коровника)
for (let y = 1; y <= 2; y++) for (let x = 14; x <= 15; x++) blocked[y][x] = true;
for (let y = 3; y <= 6; y++) for (let x = 13; x <= 15; x++) { blocked[y][x] = true; ground[y][x] = 'm'; }
const inBarnArea = (x, y) => (x >= 14 && x <= 15 && y >= 1 && y <= 2) || (x >= 13 && x <= 15 && y >= 3 && y <= 6) || (x === BARN_SPOT.x && y === BARN_SPOT.y);
for (const [a, b, back] of [[[13,3],[14,3],1],[[13,3],[13,4],1],[[13,4],[13,5],1],[[13,5],[13,6],1],[[13,6],[13,7],0],
                            [[13,7],[14,7],0],[[14,7],[15,7],0],[[15,7],[16,7],0],[[16,3],[16,4],0],[[16,4],[16,5],0],[[16,5],[16,6],0],[[16,6],[16,7],0]])
  decor.push({ kind: 'fence', pen: 'barn', a, b, z: (a[0] + b[0]) / 2 + (a[1] + b[1]) / 2 + (back ? -0.4 : 0.4) });
decor.push({ kind: 'trough', z: 14.5 + 6.8 + 0.2 });

// Видимые улучшения
decor.push({ kind: 'billboard', z: 12 + 10 + 1 }); blocked[10][12] = true;             // реклама — щит у дороги
for (let i = 0; i < 5; i++) decor.push({ kind: 'sack', i, x: 12, y: 2 + i, z: 12 + 2 + i + 1 });   // удобрения — мешки у поля
const BENCHES = [{ x: 9, y: 11 }, { x: 10, y: 11 }, { x: 11, y: 11 }, { x: 1, y: 10 }, { x: 1, y: 11 }];
BENCHES.forEach((b, i) => decor.push({ kind: 'bench', i, x: b.x, y: b.y, z: b.x + b.y + 1 }));

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const treeSpots = [[12,8]];
for (let x = 0; x < W; x++) treeSpots.push([x, 0]);
for (let y = 1; y <= 11; y++) { treeSpots.push([0, y]); if (y > 7) treeSpots.push([W-1, y]); }   // справа у пастбища — без деревьев
for (const [x, y] of treeSpots) {
  if (ground[y][x] !== 'g' || blocked[y][x]) continue;
  decor.push({ kind: 'tree', x, y, s: 0.85 + rnd() * 0.35, z: x + y + 1 });
  blocked[y][x] = true;
}
const tuft = Array.from({ length: H }, () => Array.from({ length: W }, () => rnd()));

// ================== СОСТОЯНИЕ ==================
const SAVE_KEY = 'farm-save-v1';
function newState() {
  return {
    day: 1, t: 0, night: false, coins: 30,
    plots: Array.from({ length: 8 }, () => ({ crop: null, prog: 0 })),
    inv: {}, unlocked: ['sunflower', 'wheat'], sel: 'wheat',
    up: { land: 0, ads: 0, fert: 0, sign: 0, bench: 0, helper: 0, orchard: 0, coop: 0, barn: 0 },
    trees: [], coop: { fedDay: 0, fedHens: 0, eggs: 0, layT: 0 },
    barn: { fedDay: 0, fedCows: 0, milk: 0, milkT: 0 },
    spawned: 0, toSpawn: 0,
    stats: { earned: 0, served: 0, missed: 0 },
    life: { earned: 0, served: 0, harvested: 0, eggs: 0 },
    player: { x: 5.5, y: 8.5 },
    helpers: [],
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY)) || newState(); } catch { S = newState(); }
delete S.queue;
if (!S.stats) S.stats = { earned: 0, served: 0, missed: 0 };
S.life ??= { earned: 0, served: 0, harvested: 0, eggs: 0 };
S.life.milk ??= 0;
S.up.helper ??= 0;
// у каждого помощника своя станция: поле, сад, курятник, лавка или отдых
if (!S.helpers) {
  const m = S.helperMode || 'harvest';
  S.helpers = Array.from({ length: S.up.helper }, () => ({ station: m === 'rest' ? 'rest' : 'field', replant: m === 'replant', seed: 'same' }));
}
delete S.helperMode;
S.up.orchard ??= 0; S.up.coop ??= 0;
S.trees ??= [];
S.coop ??= { fedDay: 0, fedHens: 0, eggs: 0, layT: 0 };
S.up.barn ??= 0;
S.barn ??= { fedDay: 0, fedCows: 0, milk: 0, milkT: 0 };
if (!S.unlocked.includes('sunflower')) S.unlocked.unshift('sunflower');
S.started ??= S.night || S.t > 0;
if (!S.player || blocked[Math.floor(S.player.y)]?.[Math.floor(S.player.x)] !== false) S.player = { x: 5.5, y: 8.5 };
function save() { S.player = { x: P.x, y: P.y }; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} }

const P = { x: S.player.x, y: S.player.y, phase: 0, moving: false, flip: false, work: 0 };
const PLAYER_LOOK = { shirt: '#e8604c', shirtDark: '#c44d3b', pants: '#3f6fb5', skin: '#f2c49b', hair: '#7a4a2a', hat: 'straw', overalls: true };
let visitors = [];
let tasks = [], path = [];
let floats = [];

// ================== ПРАВИЛА ==================
const visitorsPerDay = (d = S.day) => 10 + d + S.up.ads * 3;   // день 1 → 11 покупателей (~1 каждые 14 сек)
const growMult = () => 1 + S.up.fert * 0.2;
const priceMult = () => 1 + S.up.sign * 0.1;
const patience = () => 30 + S.up.bench * 5;
const sellPrice = c => Math.round(GOODS[c].price * priceMult());

function startDay() {
  S.night = false; S.t = 0; S.spawned = 0; S.closing = false;
  S.toSpawn = visitorsPerDay();
  S.stats = { earned: 0, served: 0, missed: 0 };
  closeNight();
  S.started = false;
  if (shouldAutoStart()) beginClock();
  else toast('🌅 Рассвет. Посади семечко (или нажми на солнце) — и день начнётся');
  save(); renderUI();
}

// День стартует сам, если на грядках уже что-то растёт (иначе — с первой посадки)
function shouldAutoStart() {
  return S.plots.some(p => p.crop && p.prog < 1);
}

function beginClock() {
  if (S.night || S.started) return;
  S.started = true;
  toast(`☀️ День ${S.day} начался. Ждём ${S.toSpawn} покупателей`);
}

function endDay() {
  const waiting = visitors.filter(v => v.state !== 'leaving');
  S.stats.missed += waiting.length + (S.toSpawn - S.spawned);
  waiting.forEach(v => leave(v, null));
  S.night = true;
  save(); renderUI(); openNight(true);
}

// ---------- Покупатели ----------
const SHIRTS = ['#5b8def','#e07ab8','#f0b429','#6cc08b','#9b7be0','#ef7d57','#4fb6c4'];
const SKINS = ['#f2c49b','#d9a37a','#a8714a','#7a4f33','#f6d5b8'];
const HAIRS = ['#2b1d14','#6b3e1f','#c9a15a','#8a8a8a','#b5462f','#111111'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const darken = (hex, k) => '#' + [1,3,5].map(i => Math.round(parseInt(hex.substr(i,2),16) * k).toString(16).padStart(2,'0')).join('');

function spawnVisitor() {
  const paid = S.unlocked.filter(id => CROP[id].seed > 0);
  const pool = ['sunflower', ...paid.flatMap((id, i) => Array(paid.length - i + 1).fill(id))];   // дешёвое спрашивают чаще, подсолнух — изредка
  if (S.trees.some(t => t.kind && t.grow >= 1)) pool.push('apple', 'apple');
  if (hens()) pool.push('egg', 'egg');
  if (cows()) pool.push('milk', 'milk');
  const crop = pick(pool);
  const base = GOODS[crop].price;
  const qty = 1 + Math.floor(Math.random() * (base < 15 ? 4 : base < 40 ? 3 : 2));
  const shirt = pick(SHIRTS);
  visitors.push({
    x: W + 1, y: 12.5, state: 'coming', crop, qty, pat: patience(), max: patience(), wps: [],
    phase: Math.random() * 6, moving: true, flip: true, mood: null, moodT: 0,
    look: { shirt, shirtDark: darken(shirt, .8), pants: pick(['#3b4a6b','#5a4632','#2f2f3a','#6b6b6b']), skin: pick(SKINS), hair: pick(HAIRS), hat: Math.random() < .3 ? 'cap' : null, capColor: pick(SHIRTS) },
  });
  S.spawned++;
  retarget();
}
// Очередь стоит сбоку от лавки и уходит к дороге — прилавок с товаром остаётся на виду
const QUEUE_SLOTS = [{ x: 5.5, y: 10.5 }, { x: 6.5, y: 11.5 }, { x: 7.5, y: 11.5 }, { x: 8.5, y: 11.5 }, { x: 9.5, y: 11.5 }];
function retarget() {
  visitors.filter(v => v.state !== 'leaving').forEach((v, i) => {
    v.slot = i;
    const q = QUEUE_SLOTS[Math.min(i, QUEUE_SLOTS.length - 1)];
    v.wps = [{ x: q.x, y: v.y }, { x: q.x, y: q.y }];
  });
}
function leave(v, mood) {
  v.state = 'leaving'; v.mood = mood; v.moodT = 1.6;
  v.wps = [{ x: v.x, y: 13.2 }, { x: -2, y: 13.2 }];
  retarget();
}
const queueCount = () => visitors.filter(v => v.state !== 'leaving').length;

function sell(v) {
  if (v.state !== 'waiting') { toast('Покупатель ещё подходит'); return; }
  const have = S.inv[v.crop] || 0;
  if (have < v.qty) { toast(`Нужно ${v.qty} ${GOODS[v.crop].e}, есть ${have}`); return; }
  S.inv[v.crop] = have - v.qty;
  const tip = v.pat / v.max > 0.6 ? Math.ceil(v.qty * sellPrice(v.crop) * 0.2) : 0;   // чаевые за скорость
  const money = v.qty * sellPrice(v.crop) + tip;
  S.coins += money; S.stats.earned += money; S.stats.served++; S.life.earned += money; S.life.served++;
  addFloat(v.x, v.y, `+${money}💰`);
  leave(v, 'happy');
  save(); renderUI();
}

function tapVisitor(v) {
  if (v.state === 'leaving') return;
  const have = S.inv[v.crop] || 0;
  if (have < v.qty) { toast(`Нужно ${v.qty} ${GOODS[v.crop].e}, на складе ${have}`); return; }
  const atCounter = Math.hypot(P.x - COUNTER.x - .5, P.y - COUNTER.y - .5) < 0.2 && !path.length;
  if (atCounter) sell(v);
  else setTasks([{ x: COUNTER.x, y: COUNTER.y, fn: () => sell(v) }]);
}

// ---------- Грядки ----------
function plotAct(i, mode) {
  const p = S.plots[i], s = PLOT_SLOTS[i];
  if (!p) return;
  if (p.crop && p.prog >= 1 && mode !== 'plant') {
    S.inv[p.crop] = (S.inv[p.crop] || 0) + 1; S.life.harvested++;
    addFloat(s.x + .5, s.y + .5, `+1 ${CROP[p.crop].e}`);
    p.crop = null; p.prog = 0;
  } else if (!p.crop && mode !== 'harvest') {
    const c = CROP[S.sel];
    if (S.coins < c.seed) { toast('Не хватает монет — посади бесплатный подсолнух 🌻'); return; }
    S.coins -= c.seed; p.crop = c.id; p.prog = 0;
  } else return;
  beginClock();
  save(); renderUI();
}

function tapPlot(i) {
  if (i >= S.plots.length) { toast('🚜 Ночью тапни на замочек — и расширишь участок'); return; }
  const p = S.plots[i], s = PLOT_SLOTS[i];
  if (p.crop && p.prog < 1) { toast(`${CROP[p.crop].e} растёт… ${Math.floor(p.prog * 100)}%`); return; }
  if (!p.crop && S.coins < CROP[S.sel].seed) { toast('Не хватает монет — посади бесплатный подсолнух 🌻'); return; }
  setTasks([{ x: s.x, y: s.y, fn: () => plotAct(i) }]);
}

// ---------- Сад ----------
function syncTrees() { while (S.trees.length < S.up.orchard * 2) S.trees.push({ kind: null, grow: 0, fruit: 0 }); }
const treeReady = t => t.kind && t.grow >= 1 && t.fruit >= 1;
function treeAct(i, mode) {
  const t = S.trees[i], s = ORCHARD_SLOTS[i];
  if (!t) return false;
  if (treeReady(t)) {
    const T = TREES[t.kind];
    S.inv[T.fruit] = (S.inv[T.fruit] || 0) + T.yield; S.life.harvested += T.yield;
    addFloat(s.x + .5, s.y + .5, `+${T.yield} ${GOODS[T.fruit].e}`);
    t.fruit = 0;
  } else if (!t.kind && mode !== 'harvest') {
    const T = TREES.apple;
    if (S.coins < T.sapling) { toast(`Саженец яблони стоит ${T.sapling}💰`); return false; }
    S.coins -= T.sapling; t.kind = 'apple'; t.grow = 0; t.fruit = 0;
    toast('🌱 Яблоня посажена! Вырастет примерно за день и будет давать яблоки снова и снова');
    beginClock();
  } else return false;
  save(); renderUI(); return true;
}
function tapTree(i) {
  if (i >= S.trees.length) { toast('🌳 Ночью тапни сюда — купишь сад'); return; }
  const t = S.trees[i], s = ORCHARD_SLOTS[i];
  if (t.kind && t.grow < 1) { toast(`🌳 Яблоня растёт… ${Math.floor(t.grow * 100)}%`); return; }
  if (t.kind && t.fruit < 1) { toast(`🍏 Яблоки зреют… ${Math.floor(t.fruit * 100)}%`); return; }
  if (!t.kind && S.coins < TREES.apple.sapling) { toast(`Саженец яблони стоит ${TREES.apple.sapling}💰`); return; }
  setTasks([{ x: s.x, y: s.y, fn: () => treeAct(i) }]);
}

// ---------- Курятник ----------
const hens = () => S.up.coop > 0 ? S.up.coop + 1 : 0;
const fedToday = () => S.coop.fedDay === S.day ? S.coop.fedHens : 0;
const fedTomorrow = () => S.coop.fedDay === S.day + 1 ? S.coop.fedHens : 0;
const feedStock = () => CROPS.reduce((n, c) => n + (S.inv[c.id] || 0), 0);
function feedHens() {
  if (!hens()) return false;
  if (!S.night) { toast('🐔 Кур кормят ночью — так они «заряжаются» на следующий день'); return false; }
  const already = fedTomorrow(), want = hens() - already;
  if (want <= 0) { toast('🐔 Куры уже накормлены на завтра'); return false; }
  const n = Math.min(want, Math.floor(feedStock() / FEED_PER_HEN));
  if (!n) { toast(`🐔 Нужно ${FEED_PER_HEN} любых растения на курицу, на складе ${feedStock()}`); return false; }
  let need = n * FEED_PER_HEN;   // кормим сначала самым дешёвым урожаем
  for (const c of CROPS.slice().sort((a, b) => a.price - b.price)) {
    const k = Math.min(need, S.inv[c.id] || 0); S.inv[c.id] = (S.inv[c.id] || 0) - k; need -= k; if (!need) break;
  }
  S.coop.fedDay = S.day + 1; S.coop.fedHens = already + n;
  addFloat(COOP_SPOT.x + .5, COOP_SPOT.y + .5, `🐔 сыты: ${S.coop.fedHens}`);
  toast(S.coop.fedHens < hens() ? `🐔 Накормлено ${S.coop.fedHens} из ${hens()} кур — на остальных не хватило урожая` : `🐔 Все куры накормлены — завтра будут яйца`);
  save(); renderUI(); return true;
}
function collectEggs() {
  if (!S.coop.eggs) return false;
  S.inv.egg = (S.inv.egg || 0) + S.coop.eggs; S.life.eggs += S.coop.eggs;
  addFloat(COOP_SPOT.x + .5, COOP_SPOT.y + .5, `+${S.coop.eggs} 🥚`);
  S.coop.eggs = 0;
  save(); renderUI(); return true;
}
function tapCoop() {
  if (!hens()) { toast('🐔 Ночью тапни сюда — построишь курятник'); return; }
  if (S.night) { setTasks([{ ...COOP_SPOT, fn: feedHens }]); return; }
  if (!S.coop.eggs) { toast(fedToday() ? '🐔 Куры несутся… загляни чуть позже' : '🐔 Куры голодные — покорми их ночью урожаем'); return; }
  setTasks([{ ...COOP_SPOT, fn: collectEggs }]);
}
let hensState = [];
function syncHens() {
  while (hensState.length < hens()) hensState.push({ x: 7 + Math.random() * 2, y: 9.4 + Math.random() * 1.2, tx: 0, ty: 0, wait: Math.random() * 2, phase: 0, moving: false, flip: false });
  hensState.length = hens();
}
function updateHens(dt) {
  hensState.forEach((h, i) => {
    if (S.night) {   // ночью спят у дверцы курятника
      const done = stepToward(h, 6.4 + i * 0.32, 9.35, 0.8, dt);
      h.moving = !done; h.phase += dt * 10; return;
    }
    if (h.wait > 0) { h.wait -= dt; h.moving = false; return; }
    if (!h.moving) { h.tx = YARD.x0 + .3 + Math.random() * (YARD.x1 - YARD.x0 - .6); h.ty = YARD.y0 + .3 + Math.random() * (YARD.y1 - YARD.y0 - .6); h.moving = true; }
    if (stepToward(h, h.tx, h.ty, 0.9, dt)) { h.moving = false; h.wait = 1 + Math.random() * 3; }
    h.phase += dt * 14;
  });
}

// ---------- Коровник ----------
const cows = () => S.up.barn;
const cowsFedToday = () => S.barn.fedDay === S.day ? S.barn.fedCows : 0;
const cowsFedTomorrow = () => S.barn.fedDay === S.day + 1 ? S.barn.fedCows : 0;
const cowFoodStock = () => COW_FOOD.reduce((n, id) => n + (S.inv[id] || 0), 0);
function feedCows() {
  if (!cows()) return false;
  if (!S.night) { toast('🐄 Коров кормят ночью — утром они дают молоко'); return false; }
  const already = cowsFedTomorrow(), want = cows() - already;
  if (want <= 0) { toast('🐄 Коровы уже накормлены на завтра'); return false; }
  const n = Math.min(want, Math.floor(cowFoodStock() / FEED_PER_COW));
  if (!n) { toast(`🐄 Нужно ${FEED_PER_COW} 🌻 или 🌾 на корову, на складе ${cowFoodStock()}`); return false; }
  let need = n * FEED_PER_COW;   // сначала подсолнухи — они дешевле
  for (const id of COW_FOOD) { const k = Math.min(need, S.inv[id] || 0); S.inv[id] = (S.inv[id] || 0) - k; need -= k; if (!need) break; }
  S.barn.fedDay = S.day + 1; S.barn.fedCows = already + n;
  addFloat(BARN_SPOT.x + .5, BARN_SPOT.y + .5, `🐄 сыты: ${S.barn.fedCows}`);
  toast(S.barn.fedCows < cows() ? `🐄 Накормлено ${S.barn.fedCows} из ${cows()} коров — не хватило 🌻/🌾` : '🐄 Коровы накормлены — завтра будет молоко');
  save(); renderUI(); return true;
}
function collectMilk() {
  if (!S.barn.milk) return false;
  S.inv.milk = (S.inv.milk || 0) + S.barn.milk; S.life.milk += S.barn.milk;
  addFloat(BARN_SPOT.x + .5, BARN_SPOT.y + .5, `+${S.barn.milk} 🥛`);
  S.barn.milk = 0;
  save(); renderUI(); return true;
}
function tapBarn() {
  if (!cows()) { toast('🐄 Ночью тапни сюда — построишь коровник'); return; }
  if (S.night) { setTasks([{ ...BARN_SPOT, fn: feedCows }]); return; }
  if (!S.barn.milk) { toast(cowsFedToday() ? '🐄 Коровы дают молоко… загляни чуть позже' : '🐄 Коровы голодные — покорми их ночью 🌻 или 🌾'); return; }
  setTasks([{ ...BARN_SPOT, fn: collectMilk }]);
}
let cowsState = [];
function syncCows() {
  while (cowsState.length < cows()) cowsState.push({ x: 13.6 + Math.random() * 1.8, y: 4 + Math.random() * 2.4, tx: 0, ty: 0, wait: Math.random() * 3, phase: 0, moving: false, flip: false });
  cowsState.length = cows();
}
function updateCows(dt) {
  cowsState.forEach((c, i) => {
    if (S.night) { const done = stepToward(c, 13.7 + i * 0.75, 3.55, 0.5, dt); c.moving = !done; c.phase += dt * 6; return; }   // ночью у ворот коровника
    if (c.wait > 0) { c.wait -= dt; c.moving = false; return; }
    if (!c.moving) { c.tx = PASTURE.x0 + .5 + Math.random() * (PASTURE.x1 - PASTURE.x0 - 1); c.ty = PASTURE.y0 + .6 + Math.random() * (PASTURE.y1 - PASTURE.y0 - 1.1); c.moving = true; }
    if (stepToward(c, c.tx, c.ty, 0.45, dt)) { c.moving = false; c.wait = 2 + Math.random() * 4; }
    c.phase += dt * 7;
  });
}

// Всё, что можно собрать прямо сейчас: грядки, деревья, гнездо, молоко
function readyJobs() {
  const jobs = [];
  S.plots.forEach((p, i) => { if (p.crop && p.prog >= 1) jobs.push({ x: PLOT_SLOTS[i].x, y: PLOT_SLOTS[i].y, act: () => plotAct(i, 'harvest') }); });
  S.trees.forEach((t, i) => { if (treeReady(t)) jobs.push({ x: ORCHARD_SLOTS[i].x, y: ORCHARD_SLOTS[i].y, act: () => treeAct(i, 'harvest') }); });
  if (S.coop.eggs > 0) jobs.push({ ...COOP_SPOT, act: collectEggs });
  if (S.barn.milk > 0) jobs.push({ ...BARN_SPOT, act: collectMilk });
  return jobs;
}

function routeThrough(list) {   // жадный обход: каждый раз к ближайшей клетке
  const out = []; let cx = Math.floor(P.x), cy = Math.floor(P.y);
  const rest = list.slice();
  while (rest.length) {
    let bi = 0, bd = 1e9;
    rest.forEach((t, k) => { const d = Math.abs(t.x - cx) + Math.abs(t.y - cy); if (d < bd) { bd = d; bi = k; } });
    const t = rest.splice(bi, 1)[0]; out.push(t); cx = t.x; cy = t.y;
  }
  return out;
}

function buyUpgrade(key) {
  const u = UPGRADES[key], l = S.up[key], cost = u.cost(l);
  if (l >= u.max || S.coins < cost) return;
  S.coins -= cost; S.up[key]++;
  const before = S.plots.length;
  if (key === 'land') for (let k = 0; k < 4 && S.plots.length < MAX_PLOTS; k++) S.plots.push({ crop: null, prog: 0 });
  if (key === 'helper') syncHelpers();
  if (key === 'orchard') syncTrees();
  if (key === 'coop') syncHens();
  if (key === 'barn') syncCows();
  // закрываем меню и показываем камерой, что появилось на ферме
  const spot = key === 'land' ? PLOT_SLOTS[before] : key === 'fert' ? { x: 12, y: 1 + S.up.fert } : key === 'bench' ? BENCHES[S.up.bench - 1] : upSpot(key);
  const msg = {
    land: '🚜 Новые грядки готовы', orchard: '🌳 Сад готов — тапни на место, чтобы посадить яблоню',
    barn: S.up.barn === 1 ? '🐄 Коровник построен! Ночью тапни на пастбище — фермер покормит коров 🌻 или 🌾' : '🐄 На пастбище новая корова',
    coop: S.up.coop === 1 ? '🐔 Курятник построен! Ночью тапни на него — фермер покормит кур' : '🐔 В курятнике новая курица',
    helper: '🧑‍🌾 Помощник нанят! Кнопка «Помощники» внизу — назначь ему работу', ads: S.up.ads === 1 ? '📣 У дороги появилась реклама' : '📣 Рекламный щит стал заметнее',
    fert: '🧪 Мешки удобрений у поля', sign: '🪧 Новая вывеска над лотком', bench: '🪑 Скамейка у очереди',
  }[key];
  closeNight();
  focusOn(spot.x + .5, spot.y + .5);
  addFloat(spot.x + .5, spot.y + .5, '✨');
  toast(msg);
  save(); renderUI();
}

// Где на ферме «живёт» каждое улучшение (сюда же ведёт тап ночью)
function upSpot(key) {
  const l = S.up[key];
  return {
    land: PLOT_SLOTS[Math.min(S.plots.length, MAX_PLOTS - 1)], orchard: ORCHARD_SLOTS[Math.min(S.trees.length, 3)],
    coop: { x: 8, y: 10 }, barn: { x: 14, y: 5 }, helper: { x: 3, y: 3 }, ads: { x: 12, y: 10 },
    fert: { x: 12, y: 2 + Math.min(l, 4) }, sign: { x: 4, y: 10 }, bench: BENCHES[Math.min(l, BENCHES.length - 1)],
  }[key];
}
function upAt(x, y) {   // какое улучшение относится к клетке
  const si = slotAt(x, y); if (si >= S.plots.length) return 'land';
  const oi = orchardAt(x, y); if (oi >= 0 ? oi >= S.trees.length : ground[y][x] === 'o') return 'orchard';
  if (inCoopArea(x, y)) return 'coop';
  if (inBarnArea(x, y)) return 'barn';
  if (x >= 2 && x <= 3 && y >= 2 && y <= 3) return 'helper';
  if (y === 10 && (x === 3 || x === 4)) return 'sign';
  if (x >= 12 && x <= 13 && y >= 9 && y <= 11) return 'ads';
  if (x === 12 && y >= 1 && y <= 6) return 'fert';
  if (BENCHES.some(b => b.x === x && b.y === y)) return 'bench';
  return null;
}
function upAtNight(x, y) {   // по проходимым клеткам с максимальным улучшением фермер просто идёт
  const k = upAt(x, y);
  return k && (!walkable(x, y) || S.up[k] < UPGRADES[k].max) ? k : null;
}
// Ночью над местами улучшений, на которые хватает денег, — значок ⬆
let badgeHits = [];
function drawUpBadges(t) {
  badgeHits = [];
  if (!S.night) return;
  for (const [key, u] of Object.entries(UPGRADES)) {
    const l = S.up[key]; if (l >= u.max) continue;
    const s = upSpot(key), ok = S.coins >= u.cost(l);
    const c = lift(s.x + .5, s.y + .5, { helper: 80, sign: 86, ads: 74, coop: 30, barn: 30 }[key] || 30);
    const y = c.y + Math.sin(t * 3 + s.x) * 2.5;
    badgeHits.push({ key, x: c.x, y });
    ctx.globalAlpha = ok ? 1 : .7;
    circle(c.x, y, 12, ok ? '#fff8e7' : '#d8cdb5');

// ================== ПЕРЕДВИЖЕНИЕ ==================
const walkable = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !blocked[y][x];
function findPath(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) return null;
  const key = (x, y) => y * W + x, prev = new Map([[key(sx, sy), -1]]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (walkable(nx, ny) && !prev.has(key(nx, ny))) { prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]); }
    }
  }
  if (!prev.has(key(tx, ty))) return null;
  const out = []; let k = key(tx, ty);
  while (k !== -1) { out.push([k % W, Math.floor(k / W)]); k = prev.get(k); }
  return out.reverse();
}
function setTasks(list) { tasks = list; path = []; nextTask(); }
function nextTask() {
  while (tasks.length) {
    const t = tasks[0];
    const p = findPath(Math.floor(P.x), Math.floor(P.y), t.x, t.y);
    if (p) { path = p; return; }
    tasks.shift();
  }
  path = [];
}

function stepToward(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy), st = speed * dt;
  const sdx = dx - dy; if (Math.abs(sdx) > 0.02) o.flip = sdx < 0;
  if (d <= st) { o.x = tx; o.y = ty; return true; }
  o.x += dx / d * st; o.y += dy / d * st; return false;
}

function updatePlayer(dt) {
  if (P.work > 0) { P.work -= dt; P.moving = false; return; }
  if (path.length) {
    const [tx, ty] = path[0];
    if (stepToward(P, tx + .5, ty + .5, SPEED, dt)) path.shift();
    P.moving = true; P.phase += dt * 13;
  } else {
    P.moving = false;
    if (tasks.length) { const t = tasks.shift(); if (t.fn) { t.fn(); P.work = 0.2; } nextTask(); }
    else if (!S.night && Math.floor(P.x) === COUNTER.x && Math.floor(P.y) === COUNTER.y && (P.sellT = (P.sellT || 0) - dt) <= 0) {
      P.sellT = 0.5;   // стоишь за прилавком — торгуешь со всеми, на кого хватает товара
      const v = visitors.find(v => v.state === 'waiting' && (S.inv[v.crop] || 0) >= v.qty);
      if (v) { sell(v); P.work = 0.25; }
    }
  }
}

function updateVisitors(dt) {
  for (const v of visitors) {
    if (v.wps.length) {
      const w = v.wps[0];
      if (stepToward(v, w.x, w.y, 2.2, dt)) v.wps.shift();
      v.moving = true; v.phase += dt * 11;
    } else {
      v.moving = false;
      if (v.state === 'coming') { v.state = 'waiting'; v.flip = true; }   // лицом к лавке
    }
    if (v.moodT > 0) v.moodT -= dt;
    if (v.state === 'waiting' && !S.night) {
      v.pat -= dt;
      if (v.pat <= 0) { S.stats.missed++; leave(v, 'angry'); toast('😠 Покупатель не дождался'); }
    }
  }
  visitors = visitors.filter(v => !(v.state === 'leaving' && v.x < -1.5));
}

function helperSell(h) {   // продавец за прилавком
  if ((h.sellT -= 1) > 0) return;
  const v = visitors.find(v => v.state === 'waiting' && (S.inv[v.crop] || 0) >= v.qty);
  if (v) { sell(v); h.work = 0.45; h.sellT = 1; }
}
function updateHelper(h, dt) {
  if (h.work > 0) { h.work -= dt; h.moving = false; return; }
  if (h.path.length) {
    const [tx, ty] = h.path[0];
    if (stepToward(h, tx + .5, ty + .5, 2.4, dt)) h.path.shift();
    h.moving = true; h.phase += dt * 12; return;
  }
  h.moving = false;
  const cfg = S.helpers[h.id] || { station: 'rest' };
  if (h.target) {                          // дошёл до места работы
    const job = h.target; h.target = null;
    if (job.act()) h.work = 0.45;
    return;
  }
  if ((h.think -= dt) > 0) return;
  h.think = 0.5;
  const hx = Math.floor(h.x), hy = Math.floor(h.y), st = STATIONS[cfg.station];
  if (cfg.station === 'stall' && hx === st.idle.x && hy === st.idle.y) { h.flip = false; if (!S.night) helperSell(h); return; }
  const claimed = new Set(helpers.filter(o => o.target).map(o => o.target.x + ',' + o.target.y));
  if (tasks[0]) claimed.add(tasks[0].x + ',' + tasks[0].y);
  let best = null, bd = 1e9;
  for (const j of helperJobs(cfg)) {
    if (claimed.has(j.x + ',' + j.y)) continue;
    const d = Math.abs(j.x - hx) + Math.abs(j.y - hy);
    if (d < bd) { bd = d; best = j; }
  }
  if (best) {
    const pth = findPath(hx, hy, best.x, best.y);
    if (pth) { h.path = pth; h.target = best; }
  } else {   // работы нет — ждёт на своей станции
    const spot = cfg.station === 'stall' ? st.idle : { x: st.idle.x + (h.id % 2), y: st.idle.y };
    if ((hx !== spot.x || hy !== spot.y) && walkable(spot.x, spot.y)) h.path = findPath(hx, hy, spot.x, spot.y) || [];
  }
}

// ================== ЦИКЛ ==================
let last = performance.now(), saveAcc = 0;
let timeScale = 1;   // чит-ускорение
function tick(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  for (let k = 0; k < timeScale; k++) step(dt);
  floats.forEach(f => f.t += dt); floats = floats.filter(f => f.t < 1.2);
  saveAcc += dt; if (saveAcc > 3) { saveAcc = 0; save(); }
  updateCam(dt);
  draw(now / 1000);
  renderHud();
  requestAnimationFrame(tick);
}
function step(dt) {
  updatePlayer(dt);
  updateVisitors(dt);
  helpers.forEach(h => updateHelper(h, dt));
  updateHens(dt);
  updateCows(dt);
  if (!S.night && !S.started && shouldAutoStart()) beginClock();
  if (!S.night && S.started) {
    S.t += dt;
    for (const p of S.plots) if (p.crop && p.prog < 1) p.prog = Math.min(1, p.prog + dt * growMult() / CROP[p.crop].grow);
    for (const t of S.trees) if (t.kind) {
      const T = TREES[t.kind];
      if (t.grow < 1) t.grow = Math.min(1, t.grow + dt * growMult() / T.mature);
      else if (t.fruit < 1) t.fruit = Math.min(1, t.fruit + dt * growMult() / T.regrow);
    }
    const fh = fedToday();   // сытые куры несут яйца
    if (fh) { S.coop.layT += dt * fh; while (S.coop.layT >= EGG_EVERY) { S.coop.layT -= EGG_EVERY; S.coop.eggs = Math.min(30, S.coop.eggs + 1); } }
    const fc = cowsFedToday();   // сытые коровы дают молоко
    if (fc) { S.barn.milkT += dt * fc; while (S.barn.milkT >= MILK_EVERY) { S.barn.milkT -= MILK_EVERY; S.barn.milk = Math.min(20, S.barn.milk + 1); } }
    // покупатели идут весь день: первый через пару секунд, последний — уже на закате,
    // а вечером, после работы, их заметно больше
    const f = Math.min(1, S.t / (DAY_LEN * 0.97)), share = f < 0.6 ? f / 1.24 : (0.6 + (f - 0.6) * 1.6) / 1.24;
    const due = Math.min(S.toSpawn, Math.floor(S.toSpawn * share + 0.6));
    while (S.spawned < due) {
      if (queueCount() >= MAX_QUEUE) { S.spawned++; S.stats.missed++; toast('😤 Очередь полная, покупатель ушёл'); }
      else spawnVisitor();
    }
    // на закате лавка закрывается, но последних покупателей обслужить можно
    if (S.t >= DAY_LEN) {
      if (!S.closing) { S.closing = true; if (queueCount()) toast('🌇 Лавка закрывается — обслужи последних покупателей'); }
      if (!queueCount() || S.t >= DAY_LEN + 30) endDay();
    }
  }
}

const $ = id => document.getElementById(id);

const cam = { x: 0, y: 0 };
const iso = (x, y) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 });
const lift = (x, y, z) => { const p = iso(x, y); return { x: p.x, y: p.y - z }; };

// Планшет и компьютер: вся ферма целиком помещается на экран (с запасом под верхние и нижние кнопки)
const WORLD = { x0: -330, x1: W * TW / 2, y0: -60, y1: (W + H) * TH / 2 };   // слева — пустой конец дороги, его можно обрезать
let tablet = false;

function centerCam() { cam.x = (WORLD.x0 + WORLD.x1) / 2 + 40 / zoom; cam.y = (WORLD.y0 + WORLD.y1) / 2 - 10 / zoom; }
function resize() {
  const r = $('stage').getBoundingClientRect();
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const wasTablet = tablet; tablet = cw >= 700;
  if (!userZoom) zoom = tablet ? fitZoom() : Math.max(0.55, Math.min(1.2, Math.max(cw / 620, ch / 950)));
  if (tablet && (!wasTablet || !userZoom)) centerCam();
  clampCam();
}
function clampCam() {

  const minX = -H * TW / 2 - 90, maxX = W * TW / 2 + 90,   // запас: край карты можно вытащить из-под кнопок
        minY = -70, maxY = (W + H) * TH / 2 + 10;
  cam.x = hw * 2 >= maxX - minX ? (minX + maxX) / 2 : Math.max(minX + hw, Math.min(maxX - hw, cam.x));
  cam.y = hh * 2 >= maxY - minY ? (minY + maxY) / 2 : Math.max(minY + hh, Math.min(maxY - hh, cam.y));
}
let camTarget = null;
function focusOn(x, y) { const p = iso(x, y); camTarget = { x: p.x, y: p.y - 20 }; }
function updateCam(dt) {
  if (camTarget) {   // плавный перелёт к новому улучшению
    const k = Math.min(1, dt * 3);
    cam.x += (camTarget.x - cam.x) * k; cam.y += (camTarget.y - cam.y) * k;
    if (Math.hypot(camTarget.x - cam.x, camTarget.y - cam.y) < 2) camTarget = null;
    clampCam(); return;
  }
  if (!P.moving) return;   // камера подтягивается, только когда фермер идёт к краю экрана
  const p = iso(P.x, P.y), mx = cw * 0.3 / zoom, my = ch * 0.28 / zoom;
  const k = Math.min(1, dt * 5);
  if (p.x < cam.x - mx) cam.x += (p.x + mx - cam.x) * k;
  if (p.x > cam.x + mx) cam.x += (p.x - mx - cam.x) * k;
  if (p.y - 20 < cam.y - my) cam.y += (p.y - 20 + my - cam.y) * k;
  if (p.y > cam.y + my) cam.y += (p.y - my - cam.y) * k;

let down = null, pinch = null;

cv.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  camTarget = null;
  if (pointers.size === 2) { pinch = { d: pdist(), z: zoom }; if (down) down.moved = true; return; }
  down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
});
cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) { setZoom(pinch.z * pdist() / pinch.d); return; }
  if (!down || pinch) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (!down.moved && Math.hypot(dx, dy) > 8) down.moved = true;
  if (down.moved) { cam.x = down.cx - dx / zoom; cam.y = down.cy - dy / zoom; clampCam(); }
});
cv.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size === 0) { pinch = null; down = null; } return; }
  if (down && !down.moved) { const r = cv.getBoundingClientRect(); onTap(e.clientX - r.left, e.clientY - r.top); }
  down = null;
});
cv.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); pinch = null; down = null; });

function onTap(sx, sy) {
  const wx = (sx - cw / 2) / zoom + cam.x, wy = (sy - ch / 2) / zoom + cam.y;
  // сначала покупатели (вместе с облачком над головой)
  if (S.night) for (const b of badgeHits) if (Math.hypot(wx - b.x, wy - b.y) < 20) { openUpgrade(b.key); return; }
  let bv = null, bdv = 1e9;
  for (const v of visitors) {
    if (v.state === 'leaving') continue;
    const c = iso(v.x, v.y), dx = Math.abs(wx - c.x);
    if (dx > 24 || wy < c.y - 84 || wy > c.y + 8) continue;
    if (dx < bdv) { bdv = dx; bv = v; }
  }
  if (bv) { tapVisitor(bv); return; }
  const fx = (wx / (TW / 2) + wy / (TH / 2)) / 2, fy = (wy / (TH / 2) - wx / (TW / 2)) / 2;
  const tx = Math.floor(fx), ty = Math.floor(fy);
  if (tx < 0 || ty < 0 || tx >= W || ty >= H) return;
  if (S.night) { const k = upAtNight(tx, ty); if (k) { openUpgrade(k); return; } }
  const si = slotAt(tx, ty);
  if (si >= 0) { tapPlot(si); return; }
  const oi = orchardAt(tx, ty);
  if (oi >= 0) { tapTree(oi); return; }
  if (inCoopArea(tx, ty)) { tapCoop(); return; }
  if (inBarnArea(tx, ty)) { tapBarn(); return; }
  if (ty === 10 && (tx === 3 || tx === 4)) { setTasks([{ x: COUNTER.x, y: COUNTER.y }]); toast('🏪 За прилавком фермер сам продаёт всем, на кого хватает товара'); return; }
  if (walkable(tx, ty)) setTasks([{ x: tx, y: ty }]);
}

// ================== ОТРИСОВКА ==================
function poly(pts, fill, stroke, lw = 1) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
const tilePts = (x, y) => [iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)];
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function rr(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, Math.max(0, w), h, r); ctx.fillStyle = fill; ctx.fill(); }
function emoji(e, x, y, size) { ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }

function setWorld() { ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * (cw / 2 - cam.x * zoom), dpr * (ch / 2 - cam.y * zoom)); }

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#4e8c41'; ctx.fillRect(0, 0, cv.width, cv.height);
  setWorld();
  drawOutside();
  drawGround(t);
  drawReserved();
  drawMarker(t);

  const list = [];
  const DRAW = { tree: drawTree, house: drawHouse, stall: drawStall, coop: drawCoop, barn: drawBarn, trough: drawTrough, fence: drawFence, billboard: drawBillboard, sack: drawSack, bench: drawBench };
  for (const d of decor) list.push({ z: d.z, f: () => DRAW[d.kind](d, t) });
  S.trees.forEach((tr, i) => { if (tr.kind) { const s = ORCHARD_SLOTS[i]; list.push({ z: s.x + s.y + 1, f: () => drawOrchardTree(i, t) }); } });
  for (const h of hensState) list.push({ z: h.x + h.y, f: () => drawHen(h, t) });
  for (const c of cowsState) list.push({ z: c.x + c.y, f: () => drawCow(c, t) });
  S.plots.forEach((p, i) => { if (p.crop) { const s = PLOT_SLOTS[i]; list.push({ z: s.x + s.y + 1, f: () => drawCrop(i, t) }); } });
  list.push({ z: P.x + P.y + 0.01, f: () => drawPerson(P, PLAYER_LOOK) });
  for (const h of helpers) list.push({ z: h.x + h.y, f: () => { drawPerson(h, h.look); const c = iso(h.x, h.y); circle(c.x, c.y - 60, 9, 'rgba(255,253,246,.95)'); emoji(STATIONS[S.helpers[h.id]?.station || 'rest'].ico, c.x, c.y - 59, 11); } });
  for (const v of visitors) list.push({ z: v.x + v.y, f: () => drawPerson(v, v.look) });
  list.sort((a, b) => a.z - b.z).forEach(o => o.f());

  drawLighting();
  setWorld();
  drawBars();
  drawCoopBubble();
  drawBarnBubble();
  drawUpBadges(t);
  visitors.slice().sort((a, b) => (a.x + a.y) - (b.x + b.y)).forEach(v => drawBubble(v));
  drawFloats();
}

// Мир вокруг фермы: лес позади, луг впереди, дорога уходит за край — экран заполнен на любом устройстве
const hash = (x, y) => { const v = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return v - Math.floor(v); };
function drawOutside() {
  const vw = cw / 2 / zoom + TW, vh = ch / 2 / zoom + 80, R = 30, trees = [];
  for (let y = -R; y < H + R; y++) for (let x = -R; x < W + R; x++) {
    if (x >= 0 && y >= 0 && x < W && y < H) continue;
    const c = iso(x + .5, y + .5);
    if (Math.abs(c.x - cam.x) > vw || c.y - cam.y > vh || c.y - cam.y < -vh - 60) continue;
    const road = (y === 12 || y === 13) && x >= W || (y === 12 || y === 13) && x < 0, h = hash(x, y);
    const col = road ? ((x + y) % 2 ? '#d8bf8a' : '#d3b983') : (x + y) % 2 ? '#6db151' : '#68aa4c';
    poly(tilePts(x, y), col, col);
    if (road) continue;
    const behind = x < 0 || y < 0;   // за фермой — лес, перед ней — открытый луг
    if (behind && h > (x < -2 || y < -2 ? 0.25 : 0.5)) trees.push({ x, y, s: 0.8 + hash(y, x) * 0.45 });
    else if (h > .82) circle(c.x + (h - .9) * 40, c.y, 2.2, ['#ffffff', '#ffd84d', '#ff8fb1'][Math.floor(h * 1000) % 3]);
    else if (!behind && h < .06) { circle(c.x - 5, c.y - 5, 7, '#4f9a40'); circle(c.x + 5, c.y - 4, 6, '#5aa64a'); }   // кусты
  }
  trees.sort((a, b) => (a.x + a.y) - (b.x + b.y)).forEach(drawTree);
}

function drawGround(t) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const g = ground[y][x], pts = tilePts(x, y);
    const grass = (x + y) % 2 ? '#7cc35e' : '#76bc58';
    let col = grass;
    if (g === 'r') col = (x + y) % 2 ? '#d8bf8a' : '#d3b983';
    else if (g === 'p') col = '#cfae78';
    else if (g === 'w') col = '#5bb0e0';
    else if (g === 'o') col = (x + y) % 2 ? '#84c260' : '#7ebc5b';
    else if (g === 'y') col = hens() ? ((x + y) % 2 ? '#cfae78' : '#c9a771') : grass;
    else if (g === 'm') col = cows() ? ((x + y) % 2 ? '#93d36b' : '#8bcc63') : grass;
    else if (g === 's') {
      const i = slotAt(x, y);
      if (i < S.plots.length) col = S.plots[i].crop && S.plots[i].prog < 1 ? '#6b4327' : '#8a5a36';
    }
    poly(pts, col, col);

    const c = iso(x + .5, y + .5);
    if (g === 'g' && tuft[y][x] > .55) {          // травинки и цветочки
      ctx.strokeStyle = '#5ea548'; ctx.lineWidth = 1.2; ctx.beginPath();
      const ox = (tuft[y][x] - .75) * 30;
      ctx.moveTo(c.x + ox - 3, c.y); ctx.lineTo(c.x + ox - 4, c.y - 5);
      ctx.moveTo(c.x + ox, c.y); ctx.lineTo(c.x + ox, c.y - 6);
      ctx.moveTo(c.x + ox + 3, c.y); ctx.lineTo(c.x + ox + 4, c.y - 5); ctx.stroke();
      if (tuft[y][x] > .9) circle(c.x - ox, c.y - 2, 2.2, ['#ffffff','#ffd84d','#ff8fb1'][Math.floor(tuft[y][x] * 100) % 3]);
    }
    if (g === 'o') {
      const i = orchardAt(x, y);
      if (i >= 0 && i < S.trees.length) {
        ctx.fillStyle = '#8a5a36'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 18, 9, 0, 0, 7); ctx.fill();
        if (treeReady(S.trees[i])) { ctx.strokeStyle = `rgba(255,224,102,${.6 + Math.sin(t * 5) * .35})`; ctx.lineWidth = 2.5; ctx.stroke(); }
        if (!S.trees[i].kind) { ctx.globalAlpha = .7; emoji('🌱', c.x, c.y - 4, 12); ctx.globalAlpha = 1; }
      } else if (i >= 0) {
        ctx.setLineDash([4, 4]); poly(pts, null, 'rgba(255,255,255,.35)', 1.2); ctx.setLineDash([]);
        if (i === S.trees.length) { ctx.globalAlpha = .8; emoji('🔒', c.x, c.y - 4, 14); ctx.globalAlpha = 1; }
      }
    }
    if (g === 'y' && hens() && tuft[y][x] > .3) {   // солома и зёрнышки в вольере
      ctx.fillStyle = '#e8cf86';
      for (let k = 0; k < 3; k++) ctx.fillRect(c.x - 12 + ((tuft[y][x] * 97 + k * 31) % 24), c.y - 4 + ((tuft[y][x] * 53 + k * 17) % 9), 4, 1.3);
    }
    if (g === 'w') {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2; ctx.beginPath();
      const o = Math.sin(t * 2 + x + y) * 3;
      ctx.moveTo(c.x - 8 + o, c.y); ctx.lineTo(c.x + 2 + o, c.y); ctx.stroke();
    }
    if (g === 's') {
      const i = slotAt(x, y);
      if (i < S.plots.length) {
        ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.5;
        for (const k of [.3, .55, .8]) { const a = iso(x + k, y + .12), b = iso(x + k, y + .88); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        const p = S.plots[i];
        if (p.crop && p.prog >= 1) poly(pts, null, `rgba(255,224,102,${.6 + Math.sin(t * 5) * .35})`, 2.5);
      } else {
        ctx.setLineDash([4, 4]); poly(pts, null, 'rgba(255,255,255,.35)', 1.2); ctx.setLineDash([]);
        if (i === S.plots.length) { ctx.globalAlpha = .8; emoji('🔒', c.x, c.y - 4, 14); ctx.globalAlpha = 1; }
      }
    }
  }
}

function drawReserved() {
  if (!cows()) {
    ctx.setLineDash([5, 5]);
    poly([iso(14, 1), iso(16, 1), iso(16, 7), iso(13, 7), iso(13, 3), iso(14, 3)], 'rgba(255,255,255,.08)', 'rgba(255,255,255,.45)', 1.4);
    ctx.setLineDash([]);
    const c = iso(14.5, 5); ctx.globalAlpha = .85; emoji('🐄', c.x - 8, c.y - 4, 16); emoji('🔒', c.x + 10, c.y - 4, 12); ctx.globalAlpha = 1;
  }
  // место под курятник, пока он не построен
  if (!hens()) {
    ctx.setLineDash([5, 5]);
    poly([iso(6, 8), iso(8, 8), iso(8, 9), iso(10, 9), iso(10, 11), iso(6, 11)], 'rgba(255,255,255,.08)', 'rgba(255,255,255,.45)', 1.4);
    ctx.setLineDash([]);
    const c = iso(8, 10); ctx.globalAlpha = .85; emoji('🐔', c.x - 8, c.y - 4, 16); emoji('🔒', c.x + 10, c.y - 4, 12); ctx.globalAlpha = 1;
  }
}

function drawMarker(t) {
  if (!tasks.length) return;
  const tk = tasks[0], r = 0.12 + Math.sin(t * 6) * 0.04;
  poly([iso(tk.x + r, tk.y + r), iso(tk.x + 1 - r, tk.y + r), iso(tk.x + 1 - r, tk.y + 1 - r), iso(tk.x + r, tk.y + 1 - r)], null, '#ffffff', 2);
}

function drawTree(d) {
  const c = iso(d.x + .5, d.y + .5), s = d.s;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 16 * s, 7 * s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a4a2a'; ctx.fillRect(c.x - 3 * s, c.y - 22 * s, 6 * s, 22 * s);
  circle(c.x - 10 * s, c.y - 28 * s, 12 * s, '#3c8236');
  circle(c.x + 10 * s, c.y - 28 * s, 12 * s, '#3c8236');
  circle(c.x, c.y - 40 * s, 15 * s, '#4a9a42');
  circle(c.x - 5 * s, c.y - 45 * s, 6 * s, '#66b957');
}

function drawBox(x0, y0, w, d, h, top, left, right, z0 = 0) {
  const X = x0 + w, Y = y0 + d, H = z0 + h;
  poly([lift(x0, Y, z0), lift(X, Y, z0), lift(X, Y, H), lift(x0, Y, H)], left);
  poly([lift(X, y0, z0), lift(X, Y, z0), lift(X, Y, H), lift(X, y0, H)], right);
  if (top) poly([lift(x0, y0, H), lift(X, y0, H), lift(X, Y, H), lift(x0, Y, H)], top);
}
function vline(x, y, z0, z1, color, w) { const a = lift(x, y, z0), b = lift(x, y, z1); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
// текст на вертикальной доске, повёрнутой вдоль оси x
function textOnX(x0, y, z, wTiles, text, color, size) {
  const o = lift(x0, y, z);
  ctx.save(); ctx.translate(o.x, o.y); ctx.transform(1, 0.5, 0, 1, 0, 0);
  ctx.fillStyle = color; ctx.font = `800 ${size}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, wTiles * 16, 0, wTiles * 32 - 4);
  ctx.restore();
}

function drawHouse() {
  drawBox(2, 2, 2, 2, 40, null, '#efd9ae', '#d9bd8a');
  poly([lift(2.55, 4, 0), lift(3.1, 4, 0), lift(3.1, 4, 27), lift(2.55, 4, 27)], '#8a5a36', '#6b4327');
  const knob = lift(3.0, 4, 13); circle(knob.x, knob.y, 1.5, '#f4d35e');
  poly([lift(4, 2.55, 15), lift(4, 3.35, 15), lift(4, 3.35, 30), lift(4, 2.55, 30)], S.night ? '#ffd76a' : '#a8dcff', '#8a5a36', 2);
  const o = 0.18, x0 = 2 - o, y0 = 2 - o, X = 4 + o, Y = 4 + o, h = 38, apex = lift(3, 3, 74);
  const A = lift(x0, y0, h), B = lift(X, y0, h), C = lift(X, Y, h), D = lift(x0, Y, h);
  poly([A, B, apex], '#a8403a'); poly([A, D, apex], '#b5473f');
  poly([D, C, apex], '#d0574c', '#a8403a'); poly([C, B, apex], '#bb4a42', '#a8403a');
}

const LIGHT_COLORS = ['#ffd84d', '#ff6b6b', '#6bd3ff', '#9cff6b'];
function drawStall(d, t) {
  const L = S.up.sign;
  // вывеска на двух столбах за прилавком — над головой фермера
  vline(3.12, 10.1, 0, 64, '#7a4a2a', 3); vline(4.88, 10.1, 0, 64, '#7a4a2a', 3);
  const xa = L ? 2.95 : 3.3, xb = L ? 5.05 : 4.7, z0 = 50, z1 = L ? 66 : 60;
  if (L >= 6) for (let k = 0; k < 8; k++) {   // флажки под вывеской
    const a = xa + k * (xb - xa) / 8, b = a + (xb - xa) / 8;
    poly([lift(a, 10.1, z0 - 1), lift(b, 10.1, z0 - 1), lift((a + b) / 2, 10.1, z0 - 7)], LIGHT_COLORS[k % 4]);
  }
  poly([lift(xa, 10.1, z0), lift(xb, 10.1, z0), lift(xb, 10.1, z1), lift(xa, 10.1, z1)], L ? '#fff3d6' : '#b88a55', L >= 4 ? '#e8b923' : '#6b4327', L >= 4 ? 3 : 1.5);
  textOnX(xa, 10.1, (z0 + z1) / 2 - 1, xb - xa, L ? 'ФЕРМА' : 'лавка', L ? '#c0392b' : '#3b2416', L ? 11 : 8);
  if (L >= 5) { const a = lift(xa + .12, 10.1, z1 - 4), b = lift(xb - .12, 10.1, z1 - 4); emoji('⭐', a.x, a.y, 7); emoji('⭐', b.x, b.y, 7); }
  if (L >= 3) for (let k = 0; k <= 8; k++) {   // гирлянда
    const p = lift(xa + k * (xb - xa) / 8, 10.1, z1 + 3), on = S.night || Math.sin(t * 3 + k) > -0.3;
    circle(p.x, p.y, on ? 2 : 1.5, on ? LIGHT_COLORS[k % 4] : '#776655');
  }
  // прилавок
  drawBox(3, 10, 2, 1, 16, '#d9a066', '#b07a45', '#8f5b2b');
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
  for (const z of [5.5, 11]) { const a = lift(3, 11, z), b = lift(5, 11, z); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  if (L >= 2) { const a = lift(3.08, 10.9, 16), b = lift(4.92, 10.9, 16); emoji('🌷', a.x, a.y - 6, 13); emoji('🌷', b.x, b.y - 6, 13); }
  // ящики с товаром: 3 × 2 на столешнице, в каждом — товар и количество
  const goods = Object.keys(GOODS).filter(id => S.inv[id] > 0).slice(0, 6);
  const cells = [[3.12, 10.06], [3.76, 10.06], [4.4, 10.06], [3.12, 10.52], [3.76, 10.52], [4.4, 10.52]];
  goods.forEach((id, k) => {
    const [cx, cy] = cells[k];
    drawBox(cx, cy, .5, .4, 5, '#7a4f2c', '#c9955c', '#a8783f', 16);
    const p = lift(cx + .25, cy + .2, 21);
    emoji(GOODS[id].e, p.x - 2, p.y - 7, 20);
    ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(40,25,10,.85)'; ctx.strokeText(S.inv[id], p.x + 10, p.y + 2);
    ctx.fillStyle = '#fff'; ctx.fillText(S.inv[id], p.x + 10, p.y + 2);
  });
}

function drawCoop() {
  if (!hens()) return;
  const x0 = 6, y0 = 8, X = 8, Y = 9, h = 26, o = 0.15, rz = 44;
  poly([lift(x0 - o, y0 - o, h), lift(X + o, y0 - o, h), lift(X + o, 8.5, rz), lift(x0 - o, 8.5, rz)], '#6b3f2a');
  drawBox(x0, y0, 2, 1, h, null, '#c0583f', '#a3462f');
  ctx.strokeStyle = '#f4ead8'; ctx.lineWidth = 2;   // белые уголки
  for (const [x, y] of [[x0, Y], [X, Y], [X, y0]]) { const a = lift(x, y, 0), b = lift(x, y, h); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  poly([lift(6.75, Y, 0), lift(7.25, Y, 0), lift(7.25, Y, 11), lift(6.75, Y, 11)], '#3b2416');               // дверца для кур
  poly([lift(6.8, Y, 0), lift(7.2, Y, 0), lift(7.2, Y + .45, 0), lift(6.8, Y + .45, 0)], '#b5864f');         // лесенка
  poly([lift(6.18, Y, 13), lift(6.55, Y, 13), lift(6.55, Y, 20), lift(6.18, Y, 20)], S.night ? '#ffd76a' : '#a8dcff', '#f4ead8', 1.5);
  poly([lift(X, y0, h), lift(X, Y, h), lift(X, 8.5, rz)], '#a3462f', '#f4ead8', 1.5);                       // фронтон
  poly([lift(x0 - o, Y + o, h), lift(X + o, Y + o, h), lift(X + o, 8.5, rz), lift(x0 - o, 8.5, rz)], '#8a5236', '#6b3f2a');
  // гнездо с яйцами на правой стене
  drawBox(X, 8.15, .32, .7, 9, '#e8cf86', '#c9955c', '#a8783f', 3);
  for (let k = 0; k < Math.min(S.coop.eggs, 4); k++) { const p = lift(X + .16, 8.28 + k * .15, 12); emoji('🥚', p.x, p.y - 2, 8); }
}

function drawBarn() {
  if (!cows()) return;
  const x0 = 14, y0 = 1, X = 16, Y = 3, h = 34, o = 0.15, rz = 58, mid = 2;
  poly([lift(x0 - o, y0 - o, h), lift(X + o, y0 - o, h), lift(X + o, mid, rz), lift(x0 - o, mid, rz)], '#6b3f2a');
  drawBox(x0, y0, 2, 2, h, null, '#b8432f', '#9c3826');
  ctx.strokeStyle = '#f4ead8'; ctx.lineWidth = 2.2;   // белые уголки
  for (const [x, y] of [[x0, Y], [X, Y], [X, y0]]) vline(x, y, 0, h, '#f4ead8', 2.2);
  // большие ворота на пастбище с белым крестом
  const d0 = 14.55, d1 = 15.45;
  poly([lift(d0, Y, 0), lift(d1, Y, 0), lift(d1, Y, 24), lift(d0, Y, 24)], '#7a2e22', '#f4ead8', 2);
  for (const [a, b] of [[[d0, 0], [d1, 24]], [[d0, 24], [d1, 0]]]) { const p = lift(a[0], Y, a[1]), q = lift(b[0], Y, b[1]); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
  poly([lift(X, y0, h), lift(X, Y, h), lift(X, mid, rz)], '#9c3826', '#f4ead8', 1.5);   // фронтон
  poly([lift(X, 1.75, 38), lift(X, 2.25, 38), lift(X, 2.25, 48), lift(X, 1.75, 48)], S.night ? '#ffd76a' : '#e8cf86', '#f4ead8', 1.5);   // сеновал
  poly([lift(x0 - o, Y + o, h), lift(X + o, Y + o, h), lift(X + o, mid, rz), lift(x0 - o, mid, rz)], '#8a5236', '#6b3f2a');
}

function drawCow(c, t) {
  const p = iso(c.x, c.y), lie = S.night && !c.moving;
  const bob = c.moving ? Math.abs(Math.sin(c.phase)) * 1 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 15, 5, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(p.x, p.y - bob); if (c.flip) ctx.scale(-1, 1);
  const by = lie ? -7 : -14, sw = c.moving ? Math.sin(c.phase) * 2 : 0;
  if (!lie) {   // ноги
    ctx.strokeStyle = '#3a2a22'; ctx.lineWidth = 2.6;
    for (const [x, k] of [[-8, 1], [-4, -1], [5, 1], [9, -1]]) { ctx.beginPath(); ctx.moveTo(x, by + 3); ctx.lineTo(x + sw * k, -1); ctx.stroke(); }
  }
  ctx.strokeStyle = '#3a2a22'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-12, by - 2); ctx.quadraticCurveTo(-16, by + 2, -15, by + 7 + Math.sin(t * 3 + c.x) * 1.5); ctx.stroke();   // хвост
  ctx.fillStyle = '#fbfaf5'; ctx.beginPath(); ctx.ellipse(0, by, 13, 7.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#cfc8b8'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#2b2522';   // пятна
  for (const [x, y, rx, ry] of [[-5, -2, 4, 3], [4, 2, 3.5, 2.5], [-8, 3, 2.5, 2]]) { ctx.beginPath(); ctx.ellipse(x, by + y, rx, ry, .3, 0, 7); ctx.fill(); }
  if (!lie) { ctx.fillStyle = '#f2a7b5'; ctx.beginPath(); ctx.ellipse(1, by + 7, 3, 2, 0, 0, 7); ctx.fill(); }   // вымя
  const graze = !c.moving && !lie && Math.sin(t * 1.3 + c.x * 3) > 0.4 ? 6 : 0;   // щиплет травку
  const hx = 13, hy = by - 5 + graze;
  ctx.fillStyle = '#fbfaf5'; ctx.beginPath(); ctx.ellipse(hx, hy, 5.5, 5, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#cfc8b8'; ctx.stroke();
  ctx.fillStyle = '#f2b8c2'; ctx.beginPath(); ctx.ellipse(hx + 3.5, hy + 2.5, 3.2, 2.6, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e6d6a0'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(hx - 2, hy - 4); ctx.lineTo(hx - 4, hy - 8); ctx.moveTo(hx + 1, hy - 4.5); ctx.lineTo(hx + 1.5, hy - 9); ctx.stroke();
  ctx.fillStyle = '#2b2522'; ctx.beginPath(); ctx.ellipse(hx - 5, hy - 2, 2.5, 1.4, -.4, 0, 7); ctx.fill();   // ухо
  if (lie) { ctx.strokeStyle = '#222'; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(hx + .5, hy - 1); ctx.lineTo(hx + 2.5, hy - 1); ctx.stroke(); }
  else circle(hx + 1.5, hy - 1.2, .9, '#222');
  ctx.restore();
}

  const bob = h.moving ? Math.abs(Math.sin(h.phase)) * 1.2 : 0;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 6, 2.5, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(c.x, c.y - bob); if (h.flip) ctx.scale(-1, 1);
  const by = sleep ? -4 : -7;
  if (!sleep) { ctx.strokeStyle = '#e39a35'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-1, -3); ctx.lineTo(-1, 0); ctx.moveTo(2, -3); ctx.lineTo(2, 0); ctx.stroke(); }
  poly([{ x: -5, y: by - 1 }, { x: -9, y: by - 7 }, { x: -3, y: by - 3 }], '#f4f1ea');
  ctx.fillStyle = '#fbfaf5'; ctx.beginPath(); ctx.ellipse(0, by, 7, 5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#d9d2c3'; ctx.lineWidth = 1; ctx.stroke();

  poly([{ x: 7.8, y: by - 6 + pk }, { x: 10, y: by - 5 + pk }, { x: 7.8, y: by - 4 + pk }], '#f2a43a');

  else circle(6.1, by - 5.6 + pk, .75, '#222');
  ctx.restore();
}

function drawOrchardTree(i, t) {
  const tr = S.trees[i], s = ORCHARD_SLOTS[i], c = iso(s.x + .5, s.y + .5), T = TREES[tr.kind];
  const k = tr.grow < 1 ? 0.3 + 0.6 * tr.grow : 1;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(c.x, c.y, 15 * k, 7 * k, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a4a2a'; ctx.fillRect(c.x - 2.5 * k, c.y - 26 * k, 5 * k, 26 * k);
  circle(c.x - 9 * k, c.y - 30 * k, 11 * k, T.leaf);
  circle(c.x + 9 * k, c.y - 30 * k, 11 * k, T.leaf);
  circle(c.x, c.y - 40 * k, 14 * k, T.leaf);
  circle(c.x - 4 * k, c.y - 44 * k, 5 * k, T.leafLight);
  if (tr.grow >= 1) {
    const ripe = tr.fruit >= 1, n = ripe ? 8 : tr.fruit > .5 ? 5 : 0;

  }
}

function drawBillboard(d, t) {
  const L = S.up.ads; if (!L) return;
  // 1–2: табличка на столбике · 3–4: щит · 5–6: рамка и лампочки · 7–9: флаг · 10: золотой щит
  const big = L >= 3, x0 = big ? 12.02 : 12.2, x1 = big ? 13.08 : 12.9, zb = big ? 26 : 16, zt = big ? 56 : 32;
  if (big) { vline(12.2, 10.5, 0, zt, '#7a4a2a', 3.5); vline(12.85, 10.5, 0, zt, '#7a4a2a', 3.5); }
  else vline(12.55, 10.5, 0, zt, '#7a4a2a', 3);
  const frame = L >= 10 ? '#e0b23a' : L >= 5 ? '#c0392b' : '#8a5a36';
  poly([lift(x0, 10.5, zb), lift(x1, 10.5, zb), lift(x1, 10.5, zt), lift(x0, 10.5, zt)], L >= 10 ? '#fff6cf' : '#fff3d6', frame, L >= 5 ? 3.5 : 2);
  const w = x1 - x0;
  if (!big) textOnX(x0, 10.5, (zb + zt) / 2, w, 'ФЕРМА', '#c0392b', 8);
  else {
    textOnX(x0, 10.5, zt - 9, w, 'ФЕРМА', '#c0392b', 11);
    textOnX(x0, 10.5, zb + 9, w, L >= 10 ? '★ ЛУЧШАЯ ★' : L >= 5 ? '★'.repeat(L - 4) : '→ свежее', L >= 5 ? '#e0a020' : '#3e7d32', L >= 5 && L < 10 ? 9 : 7);
  }
  if (L >= 5) for (let k = 0; k <= 6; k++) {   // лампочки по верхнему краю
    const p = lift(x0 + w * k / 6, 10.5, zt + 2), on = (Math.floor(t * 3) + k) % 2;
    circle(p.x, p.y, 2.2, on ? '#ffe066' : '#b88a2a');
  }
  if (L >= 7) {   // флаг над щитом
    vline(13.0, 10.5, zt, zt + 26, '#6b4327', 2);
    const a = lift(13.0, 10.5, zt + 26), wave = Math.sin(t * 4) * 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(a.x + 9, a.y + 2 + wave, a.x + 18, a.y + 5);
    ctx.lineTo(a.x + 18, a.y + 15); ctx.quadraticCurveTo(a.x + 9, a.y + 12 + wave, a.x, a.y + 10); ctx.closePath();
    ctx.fillStyle = L >= 10 ? '#e0b23a' : '#e0554a'; ctx.fill();
  }
  const n = Math.min(L - 1, 9);   // шарики: по одному за каждый уровень рекламы после первого
  for (let i = 0; i < n; i++) {
    const top = lift(12.3, 10.5, zt), bx = top.x + (i - (n - 1) / 2) * 7 - 8, byy = top.y - 16 - (i % 3) * 6 + Math.sin(t * 2 + i) * 1.5;
    ctx.strokeStyle = 'rgba(80,60,40,.6)'; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(bx, byy + 5); ctx.stroke();
    ctx.fillStyle = LIGHT_COLORS[i % 4]; ctx.beginPath(); ctx.ellipse(bx, byy, 4, 5, 0, 0, 7); ctx.fill();
  }
}

function drawCrop(i, t) {
  const s = PLOT_SLOTS[i], p = S.plots[i], c = iso(s.x + .5, s.y + .5);
  if (p.prog >= 1) {
    emoji(CROP[p.crop].e, c.x, c.y - 9 + Math.sin(t * 4 + i) * 1.5, 24);
    return;
  }
  const spots = [[-12, -1], [12, -1], [0, -6], [0, 5]];
  for (const [ox, oy] of spots) {
    const x = c.x + ox, y = c.y + oy;
    if (p.prog < 0.35) {
      ctx.fillStyle = '#7ccf4f';
      ctx.beginPath(); ctx.ellipse(x - 2, y - 3, 3, 1.5, -0.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 2, y - 3, 3, 1.5, 0.6, 0, 7); ctx.fill();
    } else {
      const h = 6 + p.prog * 8;
      ctx.strokeStyle = '#4f9a3a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - h); ctx.stroke();
      ctx.fillStyle = '#6cc04a';
      ctx.beginPath(); ctx.ellipse(x - 3, y - h * .55, 4, 1.8, -0.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 3, y - h * .75, 4, 1.8, 0.5, 0, 7); ctx.fill();
      if (p.prog > 0.75) { ctx.globalAlpha = .85; emoji(CROP[p.crop].e, x, y - h - 2, 9); ctx.globalAlpha = 1; }
    }
  }
}

  rr(5, -25 - sw * 1.5 + work, 4, 11, 2, L.shirt);

function drawBars() {
  S.plots.forEach((p, i) => {
    if (!p.crop || p.prog >= 1) return;
    const s = PLOT_SLOTS[i], c = iso(s.x + .5, s.y + .5);
    rr(c.x - 14, c.y - 26, 28, 4, 2, 'rgba(0,0,0,.35)');
    rr(c.x - 14, c.y - 26, 28 * p.prog, 4, 2, '#9be15d');
  });
  S.trees.forEach((tr, i) => {   // у деревьев: сначала рост, потом созревание плодов
    if (!tr.kind || treeReady(tr)) return;
    const s = ORCHARD_SLOTS[i], c = iso(s.x + .5, s.y + .5), k = tr.grow < 1 ? 0.3 + 0.6 * tr.grow : 1;
    const v = tr.grow < 1 ? tr.grow : tr.fruit;
    rr(c.x - 14, c.y - 62 * k, 28, 4, 2, 'rgba(0,0,0,.35)');
    rr(c.x - 14, c.y - 62 * k, 28 * v, 4, 2, tr.grow < 1 ? '#9be15d' : '#ff8a80');
  });
}

function drawFloats() {
  for (const f of floats) {
    const c = iso(f.x, f.y);
    ctx.globalAlpha = Math.max(0, 1 - f.t / 1.2);
    ctx.font = 'bold 15px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(40,25,10,.8)';

    ctx.fillStyle = '#ffe066'; ctx.fillText(f.text, c.x, c.y - 50 - f.t * 35);

}
