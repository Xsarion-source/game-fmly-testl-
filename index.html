<style>

// воскресенье конца месяца: пикап едет по дороге, сворачивает на грунтовку к складу, грузится и уезжает
let truckCar = null;
// грузовик длинный: кто рядом с ним — рисуется перед ним или за ним по своей стороне дороги, а не по точке
function tz(o, z) {
  const T = truckCar; if (!T) return z;
  const along = T.mir ? o.y - T.y : o.x - T.x, side = T.mir ? o.x - T.x : o.y - T.y;
  if (Math.abs(along) > 1.9 || Math.abs(side) > 1.4) return z;
  return T.x + T.y + (side >= 0 ? .05 : -.05);
}

function sell(v) {

  if (!full) toast(`🙂 Нашлось не всё — покупатель взял, что было`);
  leave(v, full ? 'happy' : 'ok');

// ---------- Мельница и сыроварня ----------

// общее для всех цехов: у мельницы одна очередь, у молочного дома — у каждого котла своя очередь порций

// ---------- 🧈 Молочный дом: у каждого котла своя очередь порций (как печь, но две дорожки) ----------

const ORDER_FROM = ['Кафе «Колосок»', 'Школьная столовая', 'Бабушка Нина', 'Ресторан «Подсолнух»', 'Ярмарка в городе', 'Детский лагерь', 'Гостиница у реки'];
const ORDER_BONUS = 1.6;   // заказ платит в 1,6 раза больше, чем лоток
function newOrder() {
  const pool = Object.keys(GOODS).filter(g => g !== 'sunflower' && canAsk(g));

    const w = pool.filter(g => !goods.includes(g)).map(g => [g, Math.sqrt(GOODS[g].price)]);
    let r = Math.random() * w.reduce((a, [, v]) => a + v, 0);
    goods.push((w.find(([, v]) => (r -= v) < 0) || w[w.length - 1])[0]);
  }
  const value = Math.min(5000, 120 + S.day * 45) * (0.8 + Math.random() * .4), items = {};
  for (const g of goods) items[g] = Math.max(2, Math.min(30, Math.round(value / k / GOODS[g].price)));
  if (items.chick) items.chick = Math.min(items.chick, 2);   // цыплята редкие — просят не больше двух

function routeThrough(list, from) {   // жадный обход: каждый раз к ближайшей клетке
  const out = []; let cx = from ? from.x : Math.floor(P.x), cy = from ? from.y : Math.floor(P.y);

  while (rest.length) {
    let bi = 0, bd = 1e9;
    rest.forEach((t, k) => { const d = Math.abs(t.x - cx) + Math.abs(t.y - cy); if (d < bd) { bd = d; bi = k; } });
    const t = rest.splice(bi, 1)[0]; out.push(t); cx = t.x; cy = t.y;
  }
  return out;
}

const walkable = (x, y) => x >= 0 && y >= 0 && x < W && y < H ? !blocked[y][x] : groveWalk(x, y);   // за краем — только открытая зона сада
// ярмарка за дорогой — вне карты: туда и обратно через «ворота» на нижнем ряду дороги
function findPath(sx, sy, tx, ty) {
  const offS = sy >= H, offT = ty >= H;
  if (!offS && !offT) return gridPath(sx, sy, tx, ty);
  if (offS && offT) return [[tx, ty]];
  // по дорожке через арку до края площади, потом вдоль задней стороны лотков — к своему месту
  const lane = (x) => { const r = []; for (let y = H; y <= 22; y++) r.push([FAIR_GATE, y]); for (let k = FAIR_GATE + 1; k <= x; k++) r.push([k, 22]); return r; };
  if (offT) { const p = gridPath(sx, sy, FAIR_GATE, H - 1); return p ? [...p, ...lane(tx), [tx, ty]] : null; }
  const p = gridPath(FAIR_GATE, H - 1, tx, ty); return p ? [...lane(sx).reverse(), ...p] : null;
}
function gridPath(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) return null;
  const key = (x, y) => (y + 40) * 256 + x + 40, prev = new Map([[key(sx, sy), -1]]), q = [[sx, sy]];   // и отрицательные клетки (зона сада)
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (walkable(nx, ny) && !prev.has(key(nx, ny))) { prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]); }
    }
  }
  if (!prev.has(key(tx, ty))) return null;
  const out = []; let k = key(tx, ty);
  while (k !== -1) { out.push([k % 256 - 40, Math.floor(k / 256) - 40]); k = prev.get(k); }
  return out.reverse();
}
let autoHarvest = false;   // «Собрать» в работе: после маршрута фермер проверяет, не созрело ли что-то ещё
function setTasks(list, keepAuto) { if (!keepAuto) { autoHarvest = false; camFree = false; } tasks = list; path = []; nextTask(); }
function nextTask() {
  while (tasks.length) {
    const t = tasks[0];
    const p = findPath(Math.floor(P.x), Math.floor(P.y), t.x, t.y);
    if (p) { path = p; return; }
    tasks.shift();
  }
  path = [];
}

function stepToward(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy), st = speed * dt;
  if (truckCar && d > st) {   // грузовик едет — люди пропускают его: не шагают ближе к нему
    const T = truckCar, r0 = Math.hypot(o.x - T.x, o.y - T.y), nx = o.x + dx / d * st, ny = o.y + dy / d * st;
    if (r0 < 1.6 && Math.hypot(nx - T.x, ny - T.y) < r0) { o.moving = false; return false; }
  }
  const sdx = dx - dy; if (Math.abs(sdx) > 0.02) o.flip = sdx < 0;
  if (d <= st) { o.x = tx; o.y = ty; return true; }
  o.x += dx / d * st; o.y += dy / d * st; return false;
}

function updatePlayer(dt) {
  if (P.work > 0) { P.work -= dt; P.moving = false; return; }
  if (path.length) {
    const [tx, ty] = path[0];
    if (stepToward(P, tx + .5, ty + .5, SPEED, dt)) path.shift();
    P.moving = true; P.phase += dt * 13;
  } else {
    P.moving = false;
    if (tasks.length) {
      const t = tasks.shift(); if (t.fn) { t.fn(); P.work = 0.2 / PEOPLE_SLOW; } nextTask();
      if (!tasks.length && autoHarvest && !S.night && !harvestRoute(true)) autoHarvest = false;
    }
    else if (!S.night && ((Math.floor(P.x) === COOP_SPOT.x && Math.floor(P.y) === COOP_SPOT.y && coopReady()) || (Math.floor(P.x) === BARN_SPOT.x && Math.floor(P.y) === BARN_SPOT.y && S.barn.milk > 0)) && (P.colT = (P.colT || 0) - dt) <= 0) {
      P.colT = 1;   // стоишь у курятника или коровника — забираешь, что появилось
      if (coopReady() && Math.floor(P.x) === COOP_SPOT.x) collectEggs(); else collectMilk();
      P.work = 0.2 / PEOPLE_SLOW;
    }
    else if ((P.prodT = (P.prodT || 0) - dt) <= 0 && standProd()) { P.prodT = 1; P.work = 0.2 / PEOPLE_SLOW; save(); renderUI(); refreshSheet(); }   // стоишь у цеха — забираешь готовое (и ночью)
    else if (!S.night && [sellSpot(), COUNTER2].some(c => Math.floor(P.x) === c.x && Math.floor(P.y) === c.y) && (P.sellT = (P.sellT || 0) - dt) <= 0) {
      P.sellT = 0.5;   // стоишь за прилавком — торгуешь с его очередью, на кого хватает товара
      const two = !fairOn() && Math.floor(P.x) === COUNTER2.x && Math.floor(P.y) === COUNTER2.y;
      const v = visitors.find(v => v.state === 'waiting' && canSell(v) && (fairOn() || !!v.shop === two));
      if (v) { sell(v); P.work = 0.25 / PEOPLE_SLOW; }

}

const clerk = { x: CLERK2.x + .5, y: CLERK2.y + .5, phase: 0, moving: false, flip: false, t: 0 };
const CLERK_LOOK = { shirt: '#e05a7a', shirtDark: '#b8435f', pants: '#3b4a6b', skin: '#e8b48a', hair: '#6b3e1f', hat: 'cap', capColor: '#fffaf0' };
const clerkOn = () => false;   // своего продавца у второй лавки нет — продают фермер и помощники со станцией «Лавка»
function updateClerk(dt) {
  if (!clerkOn() || (clerk.t -= dt) > 0) return;
  const v = visitors.find(v => v.state === 'waiting' && v.shop === 1 && canSell(v));
  if (v) { clerk.t = 0.5 + 0.3 * v.items.length; sell(v); } else clerk.t = 0.2;   // большая корзинка — дольше

function updateVisitors(dt) {
  for (const v of visitors) {
    if (v.wps.length) {
      const w = v.wps[0];
      if (stepToward(v, w.x, w.y, 2.2, dt)) v.wps.shift();
      v.moving = true; v.phase += dt * 11;
    } else {
      v.moving = false;
      if (v.bench != null) {   // сидит на скамейке
        v.sitting = true; v.flip = true;   // лицом от спинки скамейки — к дороге
        if ((v.sit -= dt) <= 0 || S.night) { v.bench = null; v.sitting = false; v.wps = [{ x: v.x, y: ROAD + 1.2 }, { x: -2, y: ROAD + 1.2 }]; }
        continue;
      }
      if (v.state === 'coming') {
        if (v.slot >= MAX_QUEUE) { S.stats.missed++; leave(v, 'angry'); toast('😤 Очередь полная, покупатель ушёл'); }   // дошёл — а мест нет
        else { v.state = 'waiting'; v.flip = !fairOn(); }   // лицом к лавке (на ярмарке — к шатру)
      }
    }
    if (v.moodT > 0) v.moodT -= dt;
    if (fairOn() && v.state !== 'leaving') {   // ярмарка: товар кончился — берут, сколько осталось, или уходят без обиды
      const it = v.items[0], have = S.fair.stock[it.id] || 0;
      if (!have) { leave(v, null); continue; }
      if (have < it.n) it.n = have;
    }
    if (v.state === 'waiting' && !S.night) {
      v.pat -= dt;
      if (v.pat <= 0) { S.stats.missed++; leave(v, 'angry'); toast('😠 Покупатель не дождался'); }
    }
  }
  visitors = visitors.filter(v => !(v.state === 'leaving' && v.x < -1.5));
}

  const P = side === 'y' ? (a, z) => lift(a, c, z) : (a, z) => lift(c, a, z);

    seg(P((s0 + s1) / 2, z0 + 2), P((s0 + s1) / 2, z1 - 2), 'rgba(40,80,35,.45)', 1);
  }

    : [lift(c, a0 - .05, z0), lift(c, a1 + .05, z0), lift(c + o, a1 + .05, z0), lift(c + o, a0 - .05, z0)];

let econCum = false;
function econChart(hist) {
  const Wd = 320, Hd = 150, L = 34, R = 8, T = 10, B = 22;
  let pts = hist.map(x => ({ d: x.d, e: x.e, s: x.s, n: x.e - x.s, now: x.now }));
  if (econCum) { let e = 0, sp = 0; pts = pts.map(x => ({ ...x, e: e += x.e, s: sp += x.s, n: e - sp })); }
  if (pts.length < 2) return '<div style="color:#7a6650;font-size:13px;margin:4px 0">График появится со второго дня — каждый вечер добавляется точка</div>';
  const vals = pts.flatMap(x => [x.e, x.s, x.n]), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const X = i => L + i * (Wd - L - R) / (pts.length - 1), Y = v => T + (max - v) / (max - min) * (Hd - T - B);
  const fmt = n => Math.abs(n) >= 10000 ? Math.round(n / 1000) + 'к' : Math.round(n).toLocaleString('ru-RU');
  const line = (k, col, w, dash) => `<polyline fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${dash ? ' stroke-dasharray="4 3"' : ''} points="${pts.map((x, i) => X(i).toFixed(1) + ',' + Y(x[k]).toFixed(1)).join(' ')}"/>`;
  const area = `<polygon fill="rgba(91,141,239,.12)" points="${X(0)},${Y(0)} ${pts.map((x, i) => X(i).toFixed(1) + ',' + Y(x.n).toFixed(1)).join(' ')} ${X(pts.length - 1)},${Y(0)}"/>`;
  const grid = [max, (max + min) / 2, min].filter((v, i, a) => a.indexOf(v) === i).map(v => `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6d9bb" stroke-width="1"/><text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="#7a6650">${fmt(v)}</text>`).join('');
  const zero = min < 0 ? `<line x1="${L}" x2="${Wd - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#7a6650" stroke-width="1"/>` : '';
  const step = Math.max(1, Math.ceil(pts.length / 6));
  const xl = pts.map((x, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${X(i)}" y="${Hd - 6}" text-anchor="middle" font-size="9" fill="#7a6650">${x.now ? 'сег.' : cal(x.d).sday}</text>` : '').join('');
  const last = pts[pts.length - 1];
  const dot = (k, col) => `<circle cx="${X(pts.length - 1)}" cy="${Y(last[k])}" r="3" fill="${col}"/>`;
  return `<svg viewBox="0 0 ${Wd} ${Hd}" style="width:100%;height:auto;background:#f6eedb;border-radius:10px">${grid}${zero}${area}
    ${line('s', '#e07a50', 2, true)}${line('e', '#3e9b3a', 2.2)}${line('n', '#4570c4', 2.6)}${dot('e', '#3e9b3a')}${dot('s', '#e07a50')}${dot('n', '#4570c4')}${xl}</svg>
    <div style="font-size:12px;color:#7a6650;text-align:center;margin-top:2px"><b style="color:#3e9b3a">—</b> выручка ${fmt(last.e)} · <b style="color:#e07a50">- -</b> траты ${fmt(last.s)} · <b style="color:#4570c4">—</b> прибыль ${fmt(last.n)}</div>`;
}
