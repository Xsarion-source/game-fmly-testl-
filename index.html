function drawLighting() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const frac = S.night ? 1 : S.t / DAY_LEN;
  if (S.night) {
    ctx.fillStyle = 'rgba(12,22,60,.55)'; ctx.fillRect(0, 0, cv.width, cv.height);
    setWorld(); ctx.globalCompositeOperation = 'lighter';
    const glows = [[lift(4, 2.95, 22), 70], [lift(4, 10.1, 56), S.up.sign >= 3 ? 95 : 60]];
    if (hens()) glows.push([lift(6.4, 9, 17), 45]);
    if (cows()) glows.push([lift(16, 2, 40), 50]);
    for (const [p, r] of glows) {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, 'rgba(255,190,90,.35)'); g.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = g; ctx.fillRect(p.x - r, p.y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  } else if (!S.started) {
    ctx.fillStyle = 'rgba(255,170,150,.12)'; ctx.fillRect(0, 0, cv.width, cv.height);
  } else if (frac > .72) {
    const k = (frac - .72) / .28;
    ctx.fillStyle = `rgba(255,110,40,${.18 * k})`; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = `rgba(30,20,70,${.18 * k})`; ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

// ================== ИНТЕРФЕЙС ==================
const PHASES = [   // [до какой доли дня, подпись, цвет неба]
  [0.18, 'Утро', 'linear-gradient(#ffd6b8,#bfe6ff)'],
  [0.45, 'Полдень', 'linear-gradient(#7fc8ff,#d4f0ff)'],
  [0.72, 'День', 'linear-gradient(#8fd0ff,#e2f4ff)'],
  [0.9, 'Вечер', 'linear-gradient(#ffb27a,#ffe0b0)'],
  [1.01, 'Закат', 'linear-gradient(#e0705a,#ffb07a)'],
];
let hudSig = '';
function renderHud() {
  $('coins').textContent = `💰 ${S.coins}`;
  // солнце идёт по дуге: восход слева, полдень наверху, закат справа
  const frac = S.night ? 1 : S.started ? Math.min(1, S.t / DAY_LEN) : 0;
  const step = Math.round(frac * 60);   // обновляем плавно, но без мельтешения
  const sig = (S.night ? 'n' : S.started ? 'd' : 'r') + step;
  if (sig === hudSig) return; hudSig = sig;
  const box = $('sunbox'), icon = $('sunIcon');
  let label, sky;
  if (S.night) { label = 'Ночь'; sky = 'linear-gradient(#0d1b3d,#2b3a6b)'; }
  else if (!S.started) { label = 'Рассвет'; sky = 'linear-gradient(#f7b8a8,#ffe3c4)'; }
  else { [, label, sky] = PHASES.find(p => frac < p[0]); }
  box.style.background = sky;
  box.classList.toggle('dark', S.night);
  $('phase').textContent = `День ${S.day} · ${label}` + (timeScale > 1 ? ` ⏩${timeScale}` : '');
  if (S.night) { icon.textContent = '🌙'; icon.style.left = '66px'; icon.style.top = '18px'; return; }
  const a = Math.PI * (1 - frac);
  icon.textContent = '☀️';
  icon.style.left = (66 + 52 * Math.cos(a)) + 'px';
  icon.style.top = (40 - 26 * Math.sin(a)) + 'px';
}

function renderUI() {
  hudSig = '';
  $('nightBtn').style.display = S.night ? '' : 'none';
  $('plantAll').style.display = S.night ? 'none' : '';
  $('dayBtn').style.display = S.night ? '' : 'none';
  $('dayBtn').textContent = `☀️ Начать день ${S.day + 1}`;
  $('helperBtn').style.display = S.up.helper > 0 ? '' : 'none';
  const items = Object.keys(GOODS).filter(id => S.inv[id]).map(id => `<span>${GOODS[id].e} ${S.inv[id]}</span>`);
  $('inv').innerHTML = items.length ? items.join('') : '<span style="opacity:.75">Склад пуст</span>';
  const s = $('seeds'); s.innerHTML = '';
  for (const id of S.unlocked) {
    const c = CROP[id], d = document.createElement('div');
    d.className = 'seed' + (S.sel === id ? ' sel' : '') + (S.coins < c.seed ? ' dis' : '');
    d.innerHTML = `<div class="e">${c.e}</div><div class="c">${c.seed ? c.seed + '💰' : 'даром'}</div>`;
    d.onclick = () => { S.sel = id; toast(`${c.e} ${c.name}: семена ${c.seed ? c.seed + '💰' : 'даром'} → продажа ${sellPrice(id)}💰 · растёт ${Math.round(c.grow / growMult())}с`); renderUI(); };
    s.appendChild(d);
  }
  renderHud();
}

// ---------- Профиль и меню ----------
function openProfile() {
  const L = S.life, stat = (k, v) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`;
  const plotsUsed = S.plots.length;
  $('sheet').innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <div style="font-size:44px;width:68px;height:68px;border-radius:50%;background:#f0e5cb;display:flex;align-items:center;justify-content:center">🧑‍🌾</div>
      <div><h2 style="margin:0">Фермер</h2><div style="color:#7a6650">Солнечная ферма · день ${S.day}</div></div></div>
    ${stat('💰 Монет сейчас', S.coins)}${stat('💵 Заработано всего', L.earned)}${stat('🧍 Покупателей обслужено', L.served)}
    ${stat('🧺 Собрано урожая', L.harvested)}${stat('🥚 Собрано яиц', L.eggs)}${stat('🥛 Надоено молока', L.milk)}${stat('🌱 Грядок', plotsUsed)}
    ${stat('🌳 Деревьев', S.trees.filter(t => t.kind).length)}${stat('🐔 Кур', hens())}${stat('🐄 Коров', cows())}${stat('🧑‍🌾 Помощников', S.up.helper)}
    ${stat('🌾 Культур открыто', `${S.unlocked.length} из ${CROPS.length}`)}
    <button class="wide" style="width:100%;margin-top:12px" onclick="closeNight()">Закрыть</button>`;
  $('overlay').classList.add('show');
}
function openMenu() {
  $('sheet').innerHTML = `<h2>☰ Меню</h2><div class="menu">
      <button onclick="${S.night ? 'openNight(false)' : "toast('🌙 Улучшения покупаются ночью')"}">⬆️ Улучшения ${S.night ? '' : '<small style="color:#7a6650">— ночью</small>'}</button>
      ${S.up.helper ? '<button onclick="openHelpers()">🧑‍🌾 Помощники</button>' : ''}
      <button onclick="openProfile()">👤 Профиль</button>
      <button onclick="openHelp()">📖 Как играть</button>
      <button onclick="openCheats()">🛠 Чит-меню <small style="color:#7a6650">— для тестов</small></button>
      <button style="color:#b0503a" onclick="resetGame(this)">🔄 Начать заново</button>
    </div><button class="wide" style="width:100%;margin-top:12px" onclick="closeNight()">Закрыть</button>`;
  $('overlay').classList.add('show');
}
function openHelp() {
  $('sheet').innerHTML = `<h2>📖 Как играть</h2><div style="font-size:14px;line-height:1.5">
    🌱 Выбери семена справа и тапни по грядке (или «Засеять»). День начинается с первой посадки.<br>
    🧺 Собирай урожай, яблоки и яйца — кнопка «Собрать» обходит всё сама.<br>
    🏪 Тапни по лавке — фермер встанет за прилавок и будет продавать всем, на кого хватает товара.<br>
    🌙 Ночью тапай по значкам на ферме — улучшения, сад, курятник. Кур корми ночью — днём будут яйца.<br>
    🐄 Коров корми ночью только 🌻 подсолнухами или 🌾 пшеницей — днём они дают 🥛 молоко.<br>
    🧑‍🌾 Помощникам назначай станции: поле, сад, курятник, коровник или лавка.</div>
    <button class="wide" style="width:100%;margin-top:12px" onclick="openMenu()">Назад</button>`;
  $('overlay').classList.add('show');
}

function openNight(withSummary) {
  const st = S.stats;
  let h = `<h2>🌙 Ночь ${S.day}</h2>`;
  if (withSummary) {
    h += `<div class="summary">За день: заработано <b>${st.earned}💰</b><br>Обслужено: <b>${st.served}</b> · Ушли ни с чем: <b>${st.missed}</b><br>
      Завтра придёт ~<b>${visitorsPerDay(S.day + 1)}</b> покупателей</div>`;
  }
  h += `<div style="font-weight:700;margin:6px 0 2px">У тебя: 💰 ${S.coins}</div>`;
  if (hens()) {
    const fed = fedTomorrow(), need = (hens() - fed) * FEED_PER_HEN;
    const status = fed >= hens() ? `Все ${hens()} кур накормлены на завтра ✔ — будет ~${hens() * 5} яиц`
      : `Кур: ${hens()}${fed ? `, накормлено ${fed}` : ''}. Нужно ${need} любых растений (сначала берутся самые дешёвые), на складе ${feedStock()}`;
    h += `<h3 style="margin:10px 0 0">🐔 Курятник</h3><div class="up"><div class="ico">🐔</div><div class="txt"><b>Покормить кур на завтра</b><small>${status}</small></div>
      <button ${fed >= hens() || feedStock() < FEED_PER_HEN ? 'disabled' : ''} onclick="feedHens(); openNight(false)">Покормить</button></div>`;
  }
  if (cows()) {
    const fed = cowsFedTomorrow(), need = (cows() - fed) * FEED_PER_COW;
    const status = fed >= cows() ? `Все ${cows()} коров накормлены ✔ — будет ~${cows() * 3} 🥛`
      : `Коров: ${cows()}${fed ? `, накормлено ${fed}` : ''}. Нужно ${need} 🌻 или 🌾, на складе ${cowFoodStock()}`;
    h += `<h3 style="margin:10px 0 0">🐄 Коровник</h3><div class="up"><div class="ico">🐄</div><div class="txt"><b>Покормить коров на завтра</b><small>${status}</small></div>
      <button ${fed >= cows() || cowFoodStock() < FEED_PER_COW ? 'disabled' : ''} onclick="feedCows(); openNight(false)">Покормить</button></div>`;
  }
  h += `<h3 style="margin:10px 0 0">Улучшения фермы</h3><small style="color:#7a6650">Можно и прямо на ферме: закрой меню и тапни на замочек или значок ⬆</small>`;
  for (const [key, u] of Object.entries(UPGRADES)) {
    const l = S.up[key], maxed = l >= u.max, cost = u.cost(l);
    h += `<div class="up"><div class="ico">${u.ico}</div><div class="txt"><b>${u.name} <small>ур. ${l}/${u.max}</small></b><small>${maxed ? 'Максимум' : u.desc(l)}</small></div>
      <button ${maxed || S.coins < cost ? 'disabled' : ''} onclick="buyUpgrade('${key}')">${maxed ? '✔' : cost + '💰'}</button></div>`;
  }
  h += `<h3 style="margin:14px 0 0">Новые культуры</h3>`;
  for (const c of CROPS) {
    if (S.unlocked.includes(c.id)) continue;
    const early = S.day + 1 < c.unlockDay;
    h += `<div class="up"><div class="ico">${early ? '❓' : c.e}</div><div class="txt"><b>${early ? '???' : c.name}</b>
      <small>${early ? `Откроется после ${c.unlockDay - 1}-го дня` : `Семена ${c.seed}💰 · растёт ${c.grow}с · продаётся за ${c.price}💰`}</small></div>
      <button ${early || S.coins < c.unlockCost ? 'disabled' : ''} onclick="unlockCrop('${c.id}')">${c.unlockCost}💰</button></div>`;
  }
  h += `<div class="row" style="margin-top:14px"><button class="wide alt" onclick="closeNight()">🌾 К грядкам</button>
        <button class="wide" style="background:#ffd34d" onclick="morning()">☀️ Начать день ${S.day + 1}</button></div>
`;
  $('sheet').innerHTML = h;
  $('overlay').classList.add('show');
}
function closeNight() { $('overlay').classList.remove('show'); }
function morning() { S.day++; startDay(); }
let resetArmed = false;
function resetGame(btn) {
  if (!resetArmed) { resetArmed = true; btn.textContent = 'Точно стереть прогресс? Нажми ещё раз'; setTimeout(() => { resetArmed = false; if (btn.isConnected) btn.textContent = 'Начать заново'; }, 3000); return; }
  resetArmed = false; S = newState(); P.x = S.player.x; P.y = S.player.y; visitors = []; helpers = []; hensState = []; cowsState = []; setTasks([]); startDay();
}

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

$('harvestAll').onclick = () => {   // грядки, яблони и гнездо — по кратчайшему маршруту
  const list = readyJobs().map(j => ({ x: j.x, y: j.y, fn: () => j.act('player') }));
  if (!list.length) { toast('Пока нечего собирать'); return; }
  setTasks(routeThrough(list));
};
$('plantAll').onclick = () => {
  const c = CROP[S.sel], can = c.seed ? Math.floor(S.coins / c.seed) : Infinity;
  const list = [];
  S.plots.forEach((p, i) => { if (!p.crop) list.push({ x: PLOT_SLOTS[i].x, y: PLOT_SLOTS[i].y, fn: () => plotAct(i, 'plant') }); });
  if (!list.length) { toast('Свободных грядок нет'); return; }
  if (!can) { toast('Не хватает монет — посади бесплатный подсолнух 🌻'); return; }
  setTasks(routeThrough(list).slice(0, can));
};
$('nightBtn').onclick = () => openNight(false);
$('dayBtn').onclick = () => morning();
$('profileBtn').onclick = openProfile;
$('menuBtn').onclick = openMenu;

// ================== ЧИТ-МЕНЮ (тройной тап по «День N») ==================
const CHEATS = {
  money:   ['💰 +1000', () => { S.coins += 1000; }],
  money2:  ['💰 +10 000', () => { S.coins += 10000; }],
  goods:   ['📦 +10 всего', () => { for (const id of [...S.unlocked, 'apple', 'egg', 'milk']) S.inv[id] = (S.inv[id] || 0) + 10; }],
  grow:    ['🌱 Всё созрело', () => { S.plots.forEach(p => { if (p.crop) p.prog = 1; }); S.trees.forEach(t => { if (t.kind) { t.grow = 1; t.fruit = 1; } }); if (hens()) S.coop.eggs += 5; if (cows()) S.barn.milk += 3; }],
  crops:   ['🔓 Все культуры', () => { S.unlocked = CROPS.map(c => c.id); }],
  maxup:   ['⭐ Все улучшения', () => {
    for (const [k, u] of Object.entries(UPGRADES)) S.up[k] = u.max;
    while (S.plots.length < MAX_PLOTS) S.plots.push({ crop: null, prog: 0 });
    syncHelpers(); syncTrees(); syncHens(); syncCows();
  }],
  feed:    ['🐔🐄 Накормить всех', () => { if (hens()) { S.coop.fedDay = S.night ? S.day + 1 : S.day; S.coop.fedHens = hens(); } if (cows()) { S.barn.fedDay = S.night ? S.day + 1 : S.day; S.barn.fedCows = cows(); } }],
  visitor: ['🧍 Покупатель', () => { if (!S.night && queueCount() < MAX_QUEUE) { spawnVisitor(); S.spawned--; } }],
  evening: ['🌇 Вечер', () => { if (!S.night) { S.started = true; S.t = Math.max(S.t, DAY_LEN * 0.75); } }],
  sunset:  ['🌆 Закат', () => { if (!S.night) { S.started = true; S.t = Math.max(S.t, DAY_LEN - 4); } }],
  night:   ['🌙 Сразу ночь', () => { if (!S.night) { S.started = true; endDay(); return true; } }],
  morning: ['☀️ Сразу утро', () => { if (S.night) morning(); else { endDay(); morning(); } return true; }],
};
function cheat(k) {
  const leave = CHEATS[k][1]();
  save(); renderUI();
  if (!leave) openCheats(); else if (!S.night) closeNight();
}
function setSpeed(x) { timeScale = x; renderUI(); openCheats(); }
function openCheats() {
  let h = `<h2>🛠 Чит-меню</h2><div style="font-size:13px;color:#7a6650;margin-bottom:8px">Только для тестов</div>
    <div style="font-weight:700;margin-bottom:4px">Скорость времени</div><div class="cheats" style="grid-template-columns:repeat(4,1fr)">`;
  for (const x of [1, 3, 10, 30]) h += `<button class="${timeScale === x ? 'on' : 'alt'}" onclick="setSpeed(${x})">×${x}</button>`;
  h += `</div><div class="cheats">`;
  for (const [k, [label]] of Object.entries(CHEATS)) h += `<button class="alt" onclick="cheat('${k}')">${label}</button>`;
  h += `</div><button class="wide" style="width:100%" onclick="closeNight()">Закрыть</button>`;
  $('sheet').innerHTML = h;
  $('overlay').classList.add('show');
}
$('helperBtn').onclick = openHelpers;
$('sunbox').onclick = () => { if (!S.night && !S.started) beginClock(); else if (!S.night) toast(`Покупателей сегодня: ${S.spawned} из ${S.toSpawn}`); };
$('overlay').onclick = e => { if (e.target.id === 'overlay') closeNight(); };

// ================== СТАРТ ==================
syncHelpers(); syncTrees(); syncHens(); syncCows();
new ResizeObserver(resize).observe($('stage'));
resize();
if (tablet) { centerCam(); clampCam(); }   // на планшете — вся ферма
else { const a = iso(3, 11), b = iso(10, 4); cam.x = (a.x + b.x) / 2; cam.y = (a.y + b.y) / 2 - 10; clampCam(); }   // на телефоне — поле и лавка в кадре
if (S.toSpawn === 0 && !S.night) startDay(); else renderUI();
if (!S.night) S.toSpawn = Math.max(S.toSpawn, visitorsPerDay());   // старые сохранения получают новый поток покупателей сразу
if (S.night) openNight(false);
requestAnimationFrame(tick);
</script>
