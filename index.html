<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5a9e4b">
<title>Солнечная ферма</title>
<!-- приложение на экране «Домой» (когда игра открыта как отдельный сайт) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ферма">
<!-- iOS 26: при «black-translucent» система рисует размытие поверх игры сверху и оставляет пустую полосу снизу. Сплошная строка состояния — игра на весь экран под ней -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  :root {
    --panel: #fff8e7; --ink: #3b2a1a; --accent: #f4a92b; --good: #3e9b3a; --bad: #d9534f; --line: #e2d3b0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #4e8c41; overflow: hidden; }
  #app { display: flex; flex-direction: column; position: fixed; inset: 0; background: #4e8c41; }   /* fixed: после поворота iPhone страница не «съезжает» */

  #stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 10px 0; pointer-events: none; }
  .hr { display: flex; align-items: center; gap: 6px; }
  .round { pointer-events: auto; width: 42px; height: 42px; padding: 0; border-radius: 50%; background: rgba(255,248,231,.95);
           font-size: 20px; line-height: 42px; box-shadow: 0 2px 0 rgba(0,0,0,.18); flex: 0 0 auto; }
  #menuBtn { font-size: 22px; font-weight: 900; }
  .hudrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  #coins { cursor: pointer; pointer-events: auto; }
  #fairBtn { position: absolute; right: 6px; top: calc(60px + env(safe-area-inset-top)); width: 52px; height: 52px; padding: 0; border-radius: 50%; pointer-events: auto;
             background: radial-gradient(circle at 50% 40%, #fffbe8, #ffe9a8); border: 2px solid #f0c24a; box-shadow: 0 3px 0 rgba(0,0,0,.2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; line-height: 1; }
  #fairBtn:not(.soon) .glow { display: none; }
  #fairBtn .glow { position: absolute; inset: -2px; border-radius: 50%; pointer-events: none;
                    box-shadow: 0 0 10px 5px rgba(255,200,40,.85), 0 0 22px 10px rgba(255,220,90,.5); animation: fglow 2.4s ease-in-out infinite; }
  @keyframes fglow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #fairBtn small { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 800; color: var(--ink);
                   background: rgba(255,248,231,.95); border-radius: 999px; padding: 1px 6px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  #fairBtn.hot small { background: #f4a92b; color: #fff; }
  .ebar { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 3px 0; }
  .ebar .el { flex: 0 0 38%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ebar .et { flex: 1; height: 10px; background: #efe3c8; border-radius: 5px; overflow: hidden; }
  .ebar .et i { display: block; height: 100%; border-radius: 5px; }
  .ebar b { flex: 0 0 auto; min-width: 54px; text-align: right; }
  .echart { display: flex; gap: 6px; align-items: flex-end; height: 110px; padding: 6px 4px 0; background: #f6eedb; border-radius: 10px; }
  .ecol { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .ebars { flex: 1; width: 100%; display: flex; gap: 2px; align-items: flex-end; justify-content: center; }
  .ebars i { display: block; width: 40%; max-width: 14px; border-radius: 3px 3px 0 0; min-height: 1px; }
  .ecol small { font-size: 10px; color: #7a6650; padding: 2px 0; }
  .pill { background: rgba(255,248,231,.92); border-radius: 999px; padding: 4px 10px; font-size: 15px; white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #sunbox { position: relative; width: 132px; height: 52px; border-radius: 14px; overflow: hidden; pointer-events: auto;
            box-shadow: 0 2px 0 rgba(0,0,0,.15); transition: background 1.5s; background: #9fd8ff; cursor: default; }
  #sunbox svg { position: absolute; inset: 0; }
  #sunIcon { position: absolute; font-size: 18px; line-height: 1; width: 1.2em; height: 1.2em; transform: translate(-50%, -50%); transition: left .5s linear, top .5s linear; }
  #phase { position: absolute; left: 0; right: 0; bottom: 2px; white-space: nowrap; text-align: center; font-size: 11px; font-weight: 800; color: #3b2a1a; letter-spacing: .02em; }
  #sunbox.dark #phase { color: #e8ecff; }
  .hcard { background: #f0e5cb; border-radius: 12px; padding: 8px 10px; margin-top: 8px; font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  #sunIcon img.ic { display: block; vertical-align: 0; width: 1.2em; height: 1.2em; max-width: none; flex: none; }
  img.ic { width: 1.25em; height: 1.25em; vertical-align: -.28em; display: inline-block; pointer-events: none; -webkit-user-drag: none; }
  .chip { padding: 6px 9px; font-size: 13px; background: #fff; border: 2px solid var(--line); border-radius: 999px; }
  .chip.on { background: #3e9b3a; border-color: #3e9b3a; color: #fff; }
  .recipe { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 5px 0; background: #f6eedb; border: 2px solid transparent; border-radius: 12px; cursor: pointer; }
  .recipe.on { border-color: #3e9b3a; background: #eaf5e1; }
  .recipe.off { opacity: .55; }
  .recipe .re { font-size: 30px; }
  .recipe .rt { flex: 1; font-size: 14px; line-height: 1.35; }
  .recipe .rt small { font-size: 12px; color: #7a6650; }
  .recipe .rn { color: #3e9b3a; }
  .oven { padding: 12px; border-radius: 16px; background: linear-gradient(#8a4b32, #6e3826); color: #fff6ea; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
  .ov-top { font-size: 16px; line-height: 1.3; margin-bottom: 10px; }
  .ov-top small { display: block; font-size: 13px; opacity: .85; margin-top: 2px; }
  .ov-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ov-cell { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 0; background: none; color: inherit; font: inherit; font-weight: 400; text-align: center; }
  .ov-cell small { font-size: 12px; opacity: .9; }
  .ov-mouth { position: relative; height: 74px; border-radius: 40px 40px 10px 10px; background: #2b1a14; border: 4px solid #c46a4a; display: flex; align-items: center; justify-content: center; }
  .oven.hot .ov-cell .ov-mouth { background: radial-gradient(circle at 50% 85%, #ffb347, #c4451c 60%, #3a1d12); }
  .oven.hot .ov-cell:not(:has(.ov-item)) .ov-mouth { background: #2b1a14; }
  .ov-item { font-size: 36px; }
  .ov-n { position: absolute; right: 8px; top: 6px; font-size: 15px; color: #ffe28f; }
  .ov-x { position: absolute; left: 10px; top: 6px; font-style: normal; font-size: 11px; opacity: .7; }
  .ov-fire { position: absolute; bottom: -4px; font-size: 16px; animation: ovf .6s ease-in-out infinite alternate; }
  @keyframes ovf { to { transform: scale(1.25) translateY(-2px); } }
  .ov-bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.35); overflow: hidden; }
  .ov-bar i { display: block; height: 100%; background: #ffd34d; border-radius: 4px; }
  .shelf { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 9px 12px; background: #f0e5cb; border-radius: 12px; font-size: 14px; }
  .shelf small { color: #7a6650; font-size: 12px; }
  .shelf button { flex: none; padding: 9px 16px; }
  .bk-h { margin: 14px 0 6px; font-size: 17px; }
  .bk-h small { font-weight: normal; font-size: 12px; color: #7a6650; }
  .bk-note { font-size: 12px; color: #7a6650; margin: 6px 0; line-height: 1.4; }
  .bq { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .bq-s { position: relative; height: 58px; padding: 2px; border-radius: 12px; background: #fff; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; font: inherit; color: inherit; }
  .bq-s span { font-size: 24px; line-height: 1; }
  .bq-s small { font-size: 10px; color: #7a6650; margin-top: 3px; }
  .bq-s i { position: absolute; top: 1px; right: 4px; font-style: normal; font-size: 10px; color: #b0503a; }
  .bq-s.cur { border-color: #e0873a; background: #fff1de; }
  .bq-s.empty { background: transparent; border-style: dashed; color: #b9a684; font-size: 22px; }
  .bk-r { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin: 6px 0; background: #f6eedb; border-radius: 12px; }
  .bk-r.off { opacity: .55; }
  .bk-r .re { font-size: 30px; }
  .bk-r .rt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
  .bk-r .rt small { font-size: 12px; color: #7a6650; }
  .bk-r .ing { margin: 3px 0 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 15px; }
  .bk-r .ing sub { font-size: 10px; margin-left: 2px; }
  .bk-r .ing .ok sub { color: #3e9b3a; } .bk-r .ing .no { color: #b0503a; }
  .bk-b { display: flex; flex-direction: column; gap: 5px; flex: none; }
  .bk-b button { min-width: 50px; padding: 8px 6px; }
  .cheats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .cheats button { padding: 9px 6px; font-size: 14px; }
  .cheats button.on { background: #3e9b3a; color: #fff; }

  #inv { display: flex; gap: 4px; flex-wrap: wrap; font-size: 13px; font-weight: 800; margin: 8px 64px 0 0; }
  #inv { pointer-events: auto; cursor: pointer; }
  #lvlbox { position: relative; pointer-events: auto; }
  #lvlnum { position: absolute; right: -7px; top: -5px; min-width: 19px; height: 19px; padding: 0 4px; box-sizing: border-box; border-radius: 10px; background: #ffd34d; border: 1.5px solid #c99418;
            font-size: 11px; font-weight: 800; color: #3b2a1a; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #lvlbar { position: absolute; left: 0; right: 0; bottom: -9px; height: 7px; border-radius: 4px; background: rgba(255,248,231,.95); border: 1.5px solid #c99418; box-sizing: border-box; overflow: hidden; pointer-events: none; }
  #lvlbar i { display: block; height: 100%; width: 0; background: #ffd34d; }
  #need { display: none; pointer-events: auto; cursor: pointer; width: fit-content; margin-top: 6px; background: #fff1ec; border: 1.5px solid #d9534f; border-radius: 999px;
          padding: 3px 10px; font-size: 13px; font-weight: 800; color: #8a2a1f; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #need.show { display: block; }
  #inv span.off { opacity: .6; background: rgba(235,225,205,.8); box-shadow: inset 0 0 0 1.5px rgba(120,95,60,.5); }
  #inv span { background: rgba(255,248,231,.88); border-radius: 999px; padding: 2px 8px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  #seeds { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px;
           max-height: calc(100% - 300px); overflow-y: auto; padding: 4px 2px; scrollbar-width: none; }
  .seed { position: relative; flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,248,231,.95);
          border: 3px solid transparent; box-shadow: 0 2px 0 rgba(0,0,0,.18); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .seed .e { font-size: 24px; margin-top: -6px; }
  .seed .c { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 800; }
  .seed.sel { border-color: var(--accent); background: #fff1d1; transform: scale(1.08); }
  .seed.dis { opacity: .45; }
  .seed .ghb { position: absolute; top: -4px; right: -4px; font-size: 13px; background: #fff; border-radius: 50%; width: 19px; height: 19px; display: flex; align-items: center; justify-content: center; }
  #actions { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px calc(10px + env(safe-area-inset-bottom));
             display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #actions button { pointer-events: auto; }
  .arow { display: flex; gap: max(6px, min(14px, calc((100vw - 340px) / 4))); justify-content: center; }
  .act { --s: min(64px, calc((100vw - 20px - var(--n, 5) * 6px) / var(--n, 5))); width: var(--s); height: var(--s); flex: none; padding: 0; border-radius: 50%; background: rgba(255,248,231,.96); box-shadow: 0 3px 0 rgba(0,0,0,.2);
         display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; line-height: 1.1; }
  .act span { font-size: 24px; line-height: 1; margin-bottom: 2px; }
  .sunrise { background: #ffd34d; padding: 12px 22px; border-radius: 999px; font-size: 17px; box-shadow: 0 3px 0 rgba(0,0,0,.2); animation: pulse 1.6s 4; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .menu button { display: block; width: 100%; text-align: left; margin-top: 6px; background: #f0e5cb; padding: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  button { font: inherit; font-weight: 700; border: none; border-radius: 10px; padding: 10px 8px; background: var(--accent); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .45; }
  button.wide { flex: 1; }
  button.alt { background: #e9dcbc; }

  #infoBox { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(10,15,35,.35); padding: 24px; }
  #infoBox.show { display: flex; }
  #lvlUp { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(10,15,35,.55); padding: 24px; }
  #lvlUp.show { display: flex; }
  .lu-card { position: relative; width: 100%; max-width: 340px; text-align: center; padding: 18px 16px 16px; border-radius: 22px; border: 3px solid #f0b429;
             background: radial-gradient(circle at 50% 18%, #fff6cf 0, #fff6cf 30%, var(--panel) 62%); box-shadow: 0 12px 40px rgba(0,0,0,.35); animation: luPop .5s cubic-bezier(.2,1.5,.4,1); }
  .lu-burst { position: absolute; left: 14px; top: 10px; font-size: 30px; transform: rotate(-18deg); }
  .lu-star { font-size: 76px; line-height: 1; }
  .lu-n { font-size: 46px; font-weight: 900; color: #c47a00; margin-top: -6px; text-shadow: 0 2px 0 #fff; }
  .lu-t { font-size: 19px; font-weight: 800; margin: 2px 0 10px; }
  .lu-news { text-align: left; font-size: 15px; line-height: 1.5; background: #f6ecd2; border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }
  .lu-news:empty { display: none; }
  .lu-card button { width: 100%; font-size: 18px; }
  .season-spring { background: linear-gradient(#ffe0ee, #f7a8c8) !important; border: 2px solid #e57fae !important; }
  .season-summer { background: linear-gradient(#fff3b0, #ffc94d) !important; border: 2px solid #e8a820 !important; }
  .season-autumn { background: linear-gradient(#ffd8a8, #ec9550) !important; border: 2px solid #c9661f !important; }
  .season-winter { background: linear-gradient(#f0f8ff, #b2d8f6) !important; border: 2px solid #6fa3d8 !important; }
  @keyframes luPop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  #infoBox > div { background: var(--panel); border-radius: 18px; padding: 16px; max-width: 360px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: 15px; line-height: 1.45; }
  #infoText h3 { margin: 0 0 6px; font-size: 18px; }
  #overlay { position: fixed; inset: 0; background: rgba(10,15,35,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; }
  #sheet { width: 100%; max-width: 640px; height: min(82%, 760px); box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain;   /* одна высота у всех окон — не прыгает при переключении */
           background: var(--panel); border-radius: 18px 18px 0 0;
           padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); animation: up .3s; }
  #sheet h2 { margin: 0 0 6px; font-size: 20px; }
  .summary { background: #f0e5cb; border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .tabs { position: sticky; top: -14px; z-index: 2; display: flex; gap: 6px; margin: 12px -14px 4px; padding: 8px 14px; background: var(--panel); }
  .tabs button { flex: 1; padding: 9px 4px; border-radius: 12px; border: 1.5px solid #ecdcb8; background: #f3e8cf; color: #6b5440; font-weight: 800; font-size: 14px; box-shadow: none; position: relative; }
  .tabs button.on { background: #fff; color: var(--ink); border-color: #f0c24a; box-shadow: 0 2px 0 #dba93c; }
  .tabs .n { position: absolute; top: -7px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; line-height: 20px; }
  .calnav { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px; font-size: 16px; }
  .calnav button { width: 40px; height: 34px; padding: 0; border-radius: 10px; font-size: 20px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: 11px; font-weight: 800; color: #7a6650; }
  .cal .cd { position: relative; min-height: 50px; border-radius: 9px; background: #fffaf0; border: 1.5px solid #ecdcb8; padding: 2px 3px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .cal .cd.we { background: #fff3dc; }
  .cal .cd.past { background: #efe6d2; color: #8d7a63; }
  .cal .cd.today { border-color: #f0a020; box-shadow: 0 0 0 2px #f4c048; background: #fff3c4; }
  .cal .n { font-size: 12px; font-weight: 800; align-self: flex-start; }
  .cal .ev { font-size: 13px; line-height: 1.1; }
  .cal .m { font-size: 10px; font-weight: 800; color: #3e7d32; margin-top: auto; }
  .crates { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0; }
  .crates i { width: 22px; height: 18px; border-radius: 4px; background: #efe6d2; border: 1.5px dashed #cdb994; }
  .crates i.on { background: linear-gradient(#e0b47a, #b8834d); border: 1.5px solid #7a4a2a; }
  .crates b { margin-left: 6px; font-size: 14px; }
  .cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 10px; }
  .crate { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px; border-radius: 14px;
           background: repeating-linear-gradient(0deg, #f6ecd8 0 9px, #efe2c6 9px 10px); border: 2px dashed #cdb994; color: #9a8466; box-shadow: none; font-weight: 700; }
  .crate.full { background: repeating-linear-gradient(0deg, #e8bf86 0 9px, #d4a66a 9px 11px); border: 2px solid #8f5b2b; color: #4a2e18; box-shadow: 0 3px 0 #7a4a2a; }
  .crate .ce { font-size: 30px; line-height: 1.1; } .crate .ce.plus { font-size: 30px; color: #cdb994; }
  .crate b { font-size: 18px; } .crate b i { font-style: normal; font-size: 12px; opacity: .7; } .crate small { font-size: 11px; line-height: 1.1; text-align: center; }
  .crate.lockd { opacity: .55; }
  .crate.sel { outline: 3px solid #f4a92b; outline-offset: 2px; }
  .cgrid .crate { aspect-ratio: 1.15; }
  .cpanel { background: #fffaf0; border: 1.5px solid #ecdcb8; border-radius: 14px; padding: 10px; margin-bottom: 8px; }
  .cptitle { font-size: 15px; margin-bottom: 6px; }
  .gchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .gchip { flex: none; display: flex; flex-direction: column; align-items: center; min-width: 52px; padding: 5px 6px; border-radius: 12px; background: #f3ead6; border: 1.5px solid #ecdcb8; box-shadow: none; }
  .gchip span { font-size: 24px; line-height: 1.1; } .gchip small { font-size: 11px; font-weight: 800; color: #7a6650; }

<script>
// ================== ДАННЫЕ ==================
const CROPS = [

  { id: 'sunflower',  name: 'Подсолнух', e: '🌻', seed: 0, grow: 9,  price: 2,  unlockCost: 0,   lvl: 1 },

  { id: 'corn',       name: 'Кукуруза', e: '🌽', seed: 10, grow: 33, price: 26, unlockCost: 80,  lvl: 3 },

const CROP = Object.fromEntries(CROPS.map(c => [c.id, c]));

const DAY_LEN = 180;      // секунд реального времени на день
const MAX_QUEUE = 5;
const SPEED = 3.2;        // клеток в секунду

// Деревья сада: сажаются один раз и потом плодоносят снова и снова.
// Чтобы добавить грушу — допиши сюда запись и товар в GOODS.
const TREES = {
  apple: { name: 'Яблоня', e: '🍎', fruit: 'apple', sapling: 40, mature: 225, regrow: 75, yield: 3, leaf: '#4f9e45', leafLight: '#6dbb5a', fruitColor: '#e0393e' },
};
// Всё, что продаётся на лотке
const GOODS = {
  ...Object.fromEntries(CROPS.map(c => [c.id, { e: c.e, name: c.name, price: c.price }])),
  apple: { e: '🍎', name: 'Яблоко', price: 12 },
  egg:   { e: '🥚', name: 'Яйцо',   price: 9 },
  chick: { e: '🐣', name: 'Цыплёнок', price: 60 },
  goldegg: { e: '🟡', name: 'Золотое яйцо', price: 150 },
  milk:  { e: '🥛', name: 'Молоко', price: 22 },
  flour: { e: '🍚', name: 'Мука',   price: 30 },
  cheese:{ e: '🧀', name: 'Сыр',    price: 85 },
  bread: { e: '🍞', name: 'Хлеб',    price: 100 },
  pie:   { e: '🥧', name: 'Яблочный пирог', price: 170 },
  pizza: { e: '🍕', name: 'Пицца',   price: 270 },
  cake:  { e: '🎂', name: 'Клубничный торт', price: 380 },
  // особые находки: лежат в S.special (у каждой свой размер), на складе — только их число; продаются, лишь если выставить вручную
  sp_pumpkin:    { e: '🎃', name: 'Гигантская тыква', price: 650, sp: 'pumpkin' },
  sp_corn:       { e: '🌽', name: 'Королевский початок', price: 380, sp: 'corn' },
  sp_strawberry: { e: '🍓', name: 'Золотая клубника', price: 450, sp: 'strawberry' },
  sp_cheese:     { e: '🧀', name: 'Отборный сыр', price: 500, sp: 'cheese' },
};
// Планировка: каждая постройка нарисована в своих «старых» координатах и сдвинута на [dx, dy] клеток.
// Чтобы раздвинуть или передвинуть что-то — поменяй смещение здесь (сохранения от этого не зависят).
const LAYOUT = {
  home: [1, 0], mail: [4, 1], dog: [0, 1], orchard: [0, 2], flowers: [1, 2], well: [1, 4], swing: [0, 2],
  stall: [2, 5], stall2: [-1, 5], benchA: [3, 5], benchB: [0, 5], ads: [8, 5], field: [3, 0], fert: [4, 0], coop: [3, 3], pond: [5, 4],
  barn: [6, 1], gh: [7, 2], mill: [8, 1], dairy: [8, 2], path: [2, 0],
};
const at = (g, x, y) => ({ x: x + LAYOUT[g][0], y: y + LAYOUT[g][1] });   // клетка/точка постройки на новой карте
const isoG = (g, x, y) => iso(x + LAYOUT[g][0], y + LAYOUT[g][1]);
const liftG = (g, x, y, z) => lift(x + LAYOUT[g][0], y + LAYOUT[g][1], z);
// Производство: сырьё со склада → товар. Работает днём, как растут грядки
const PROD = {
  mill:  { name: 'Мельница',  ico: '🌬️', in: 'wheat', n: 3, out: 'flour',  time: 36, cap: 8, spot: at('mill', 18, 7) },
  dairy: { name: 'Сыроварня', ico: '🧀', in: 'milk',  n: 2, out: 'cheese', time: 54, cap: 8, spot: at('dairy', 17, 7) },
};
// Пекарня — пристройка к дому: печёт из муки и продуктов фермы по выбранному рецепту
const BAKE = {
  bread: { in: { flour: 2, egg: 1 }, time: 30 },
  pie:   { in: { flour: 2, apple: 3, egg: 2 }, time: 40 },
  pizza: { in: { flour: 2, cheese: 1, tomato: 3 }, time: 45 },
  cake:  { in: { flour: 2, strawberry: 4, egg: 2, milk: 2 }, time: 60 },
};
const BAKE_CAP = 6, BAKE_SPOT = at('home', 4, 4);   // BAKE_CAP — мест в очереди (ждут, пока освободится отделение)
const OVENS = 2, trayN = () => 1 + (S.up.trays || 0);   // в печи два отделения; противни — по 2–3 штуки в отделение
const MAIL = at('mail', 4, 5), MAIL_SPOT = at('mail', 3, 5);   // почтовый ящик через тропинку от пекарни; фермер встаёт на тропинку
// Уют: что появляется у дома на каждом уровне
const COZY = ['🌷 Клумбы у сада', '🐕 Собака и будка', '🪣 Колодец', '🌳 Качели у лавки', '🐓 Флюгер и фонарики на доме'];
const COZY_SPOTS = [at('flowers', 4, 6), at('dog', 1, 4), at('well', 4, 8), at('swing', 1, 9), at('home', 3, 4)];
const COZY_CELLS = [[2, ...Object.values(at('dog', 1, 4))], [3, ...Object.values(at('well', 4, 8))], [4, ...Object.values(at('swing', 1, 9))], [4, ...Object.values(at('swing', 2, 9))]];   // [уровень, x, y] — занятые клетки   // [уровень, x, y] — занятые клетки
const GH_CROPS = ['tomato', 'strawberry'];   // растут только в теплице
const GH_YIELD = 6, GH_SLOW = 3;             // в теплице зреют гроздью по 6, но в 3 раза дольше
const FEED_PER_HEN = 3;            // растений на курицу на день
const EGG_EVERY = DAY_LEN / 3.4;   // сытая курица несёт ~3–4 яйца за день
const COW_FOOD = ['sunflower', 'wheat'];   // коровы едят только подсолнухи и пшеницу
const FEED_PER_COW = 4;            // растений на корову на день (клевер уменьшает — см. feedPerCow)
const feedPerCow = () => FEED_PER_COW - (S.up.clover || 0);
const MILK_EVERY = DAY_LEN / 4;    // сытая корова даёт ~4 бутылки молока за день

const UPGRADES = {
  land:   { name: 'Расширить участок', ico: '🚜', desc: l => `+4 грядки (сейчас ${8 + l*4})`, cost: l => 40 + l*l*40 + l*30, max: 4 },
  orchard:{ name: 'Фруктовый сад',     ico: '🌳', desc: l => l === 0 ? 'Место под 2 яблони. Саженец 40💰, растёт ~день, потом плодоносит каждый день' : '+2 места под деревья', cost: l => [150, 260][l], max: 2 },
  coop:   { name: 'Курятник',          ico: '🐔', desc: l => l === 0 ? 'Курятник и 2 курицы. Ночью корми их урожаем — днём несут яйца' : `+1 курица (сейчас ${hens()}, мест в вольере ${hensCap()})`, cost: l => [150, 100, 140, 190, 240, 300, 360, 430][l],
            get max() { return Math.max(S.up.coop, Math.min(8, hensCap() - 1 - (S.coop.extra || 0) - (S.coop.chicks || 0))); } },   // кур не больше, чем мест в вольере
  nests:  { name: 'Уютные гнёзда',     ico: '🪺', desc: l => `Куры несутся чаще: +${(l + 1) * 20}% яиц (сейчас +${l * 20}%)`, cost: l => [300, 600, 1000][l], max: 3, need: () => hens() > 0, needText: 'Откроется, когда построишь курятник 🐔' },
  rooster:{ name: 'Петух',             ico: '🐓', desc: l => 'Иногда двойное яйцо, чаще золотые 🟡 — и из яиц вылупляются цыплята 🐣: есть место — вырастают в кур, нет — продаются за 60💰', cost: l => [800][l], max: 1, need: () => S.up.nests >= 1, needText: 'Откроется после уютных гнёзд 🪺' },
  yard:   { name: 'Просторный вольер', ico: '🐔', desc: l => `+2 места для кур (сейчас ${hensCap()}). Займут цыплята или новые куры`, cost: l => [1500, 3000][l], max: 2, need: () => S.up.coop >= 4, needText: 'Откроется, когда в курятнике будет 5 кур 🐔' },
  barn:   { name: 'Коровник',          ico: '🐄', desc: l => l === 0 ? 'Коровник, пастбище и корова. Ночью корми подсолнухами или пшеницей — днём даёт молоко' : `+1 корова (сейчас ${l})`, cost: l => [220, 180, 260, 420, 520, 650, 800][l],
            get max() { return 3 + 2 * (S.up.pasture || 0); } },
  milker: { name: 'Доильный аппарат',  ico: '🥛', desc: l => `Каждая корова даёт больше молока: ${Math.round(4 * (1 + l / 3))} → ${Math.round(4 * (1 + (l + 1) / 3))} бутылок в день`, cost: l => [500, 1000, 1800][l], max: 3, need: () => cows() > 0, needText: 'Откроется, когда построишь коровник 🐄' },
  clover: { name: 'Клевер на пастбище', ico: '🍀', desc: l => `Коровы едят меньше: ${feedPerCow()} → ${feedPerCow() - 1} 🌻/🌾 на корову`, cost: l => [700, 1400][l], max: 2, need: () => cows() > 0, needText: 'Откроется, когда построишь коровник 🐄' },
  hay:    { name: 'Сеновал',           ico: '🟨', desc: l => 'Каждую ночь сам кормит коров 🌻/🌾 со склада — не нужно ходить и не нужен помощник', cost: l => [1200][l], max: 1, need: () => S.up.milker >= 1, needText: 'Откроется после доильного аппарата 🥛' },
  pasture:{ name: 'Большое пастбище',  ico: '🐄', desc: l => `+2 места для коров (сейчас ${3 + 2 * l}). Новых коров покупай в «Коровнике»`, cost: l => [2000, 4000][l], max: 2, need: () => S.up.barn >= 3, needText: 'Откроется, когда в коровнике будет 3 коровы 🐄' },
  greenhouse: { name: 'Теплица',      ico: '🏡', desc: l => l === 0 ? 'Стеклянная теплица на 3 грядки. Только в ней растут 🍅 помидоры и 🍓 клубника — медленнее, зато гроздью по 6' : '+3 грядки в теплице', cost: l => [260, 380][l], max: 2 },
  clear:  { name: 'Расчистить лес',    ico: '🪓', desc: l => l === 0 ? 'Вырубить лес справа от пастбища — место под новое здание' : 'Вырубить лес у теплицы — место ещё под одно здание', cost: l => [2500, 4000][l], max: 2 },

  let seed = fd * 7919 + 13; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const pool = Object.keys(GOODS).filter(g => !GOODS[g].sp && !['sunflower', 'chick', 'goldegg'].includes(g) && (canMake(g) || basics.includes(g)));
  const s = RIVALS_DEF.map(() => {
    const goods = [], st = {}, pr = {};
    while (goods.length < 3 && goods.length < pool.length) { const g = pool[Math.floor(r() * pool.length)]; if (!goods.includes(g)) goods.push(g); }
    for (const g of goods) { st[g] = 10 + Math.floor(r() * 22); pr[g] = Math.max(1, Math.round(GOODS[g].price * seasonPrice(g) * (1.05 + r() * .35))); }
    return { stock: st, price: pr };
  });
  S.fair.rv = { d: fd, s }; return s;
}

// ---------- Почта: заказы на несколько дней ----------
const ORDER_FROM = ['Кафе «Колосок»', 'Школьная столовая', 'Бабушка Нина', 'Ресторан «Подсолнух»', 'Ярмарка в городе', 'Детский лагерь', 'Гостиница у реки'];
const ORDER_BONUS = 1.6;   // заказ платит в 1,6 раза больше, чем лоток
function newOrder() {
  const pool = Object.keys(GOODS).filter(g => g !== 'sunflower' && canMake(g));
  if (pool.length < 2) return null;
  const k = Math.min(pool.length, S.day >= 10 && Math.random() < .5 ? 3 : 2);
  const goods = [];
  while (goods.length < k) {   // дорогое — чаще: вес растёт с ценой
    const w = pool.filter(g => !goods.includes(g)).map(g => [g, Math.sqrt(GOODS[g].price)]);
    let r = Math.random() * w.reduce((a, [, v]) => a + v, 0);
    goods.push((w.find(([, v]) => (r -= v) < 0) || w[w.length - 1])[0]);
  }
  const value = Math.min(5000, 120 + S.day * 45) * (0.8 + Math.random() * .4), items = {};
  for (const g of goods) items[g] = Math.max(2, Math.min(30, Math.round(value / k / GOODS[g].price)));
  if (items.chick) items.chick = Math.min(items.chick, 2);   // цыплята редкие — просят не больше двух
  return { from: pick(ORDER_FROM), items, due: S.day + 2, seen: false };
}

let cowsState = [];
function syncCows() {
  while (cowsState.length < cows()) cowsState.push({ x: PASTURE.x0 + .6 + Math.random() * (PASTURE.x1 - PASTURE.x0 - 1.2), y: PASTURE.y0 + .7 + Math.random() * (PASTURE.y1 - PASTURE.y0 - 1.3), tx: 0, ty: 0, wait: Math.random() * 12, phase: 0, moving: false, flip: false });
  cowsState.length = cows();
}
function updateCows(dt) {
  cowsState.forEach((c, i) => {
    if (S.night) { const p = { x: PASTURE.x0 + .7 + (i % 4) * .75, y: PASTURE.y0 + .55 + Math.floor(i / 4) * .8 }, done = stepToward(c, p.x, p.y, 0.5, dt); c.moving = !done; c.phase += dt * 6; return; }   // ночью у ворот коровника
    if (c.wait > 0) { c.wait -= dt; c.moving = false; if ((c.gt = (c.gt || 0) - dt) <= 0) { c.graze = !c.graze; c.gt = 4 + Math.random() * 6; } return; }   // то щиплет траву, то стоит
    if (!c.moving) {   // корова переходит недалеко и подолгу пасётся на месте
      const cl = (v, a, b) => Math.max(a, Math.min(b, v));
      c.tx = cl(c.x + (Math.random() - .5) * 2.4, PASTURE.x0 + .5, PASTURE.x1 - .5); c.ty = cl(c.y + (Math.random() - .5) * 2, PASTURE.y0 + .6, PASTURE.y1 - .5); c.moving = true;
    }
    if (stepToward(c, c.tx, c.ty, 0.45, dt)) { c.moving = false; c.wait = 12 + Math.random() * 14; }
    c.phase += dt * 7;
  });
}

// Всё, что можно собрать прямо сейчас: грядки, деревья, гнездо, молоко
function readyJobs() {
  const jobs = [];

  S.gh.forEach((p, i) => { if (p.crop && p.prog >= 1) jobs.push({ x: GH_SLOTS[i].x, y: GH_SLOTS[i].y, act: () => plotAct(i, 'harvest', true) }); });
  S.trees.forEach((t, i) => { if (treeReady(t)) jobs.push({ x: ORCHARD_SLOTS[i].x, y: ORCHARD_SLOTS[i].y, act: () => treeAct(i, 'harvest') }); });
  if (coopReady() > 0) jobs.push({ ...COOP_SPOT, act: collectEggs });
  if (S.barn.milk > 0) jobs.push({ ...BARN_SPOT, act: collectMilk });
  for (const k in PROD) if (S.up[k] && S.prod[k].out > 0) jobs.push({ ...PROD[k].spot, act: () => collectProd(k) });
  if (S.up.bakery && bakeOut() > 0) jobs.push({ ...BAKE_SPOT, act: collectBake });
  return jobs;
}

function routeThrough(list) {   // жадный обход: каждый раз к ближайшей клетке
  const out = []; let cx = Math.floor(P.x), cy = Math.floor(P.y);
  const rest = list.slice();
  while (rest.length) {
    let bi = 0, bd = 1e9;
    rest.forEach((t, k) => { const d = Math.abs(t.x - cx) + Math.abs(t.y - cy); if (d < bd) { bd = d; bi = k; } });
    const t = rest.splice(bi, 1)[0]; out.push(t); cx = t.x; cy = t.y;
  }
  return out;
}

function drawUpBadges(t) {
  badgeHits = [];
  if (!S.night) return;
  ctx.font = '800 10px system-ui, sans-serif';
  const avail = k => S.up[k] < UPGRADES[k].max && !upLocked(k), width = k => 22 + ctx.measureText(`▲ ${UPGRADES[k].cost(S.up[k])}`).width;
  const place = [], grouped = new Set();
  for (const g of BADGE_GROUPS) {
    g.keys.forEach(k => grouped.add(k));
    const ks = g.keys.filter(avail); if (!ks.length) continue;
    const c = g.at();
    for (let r = 0; r * 3 < ks.length; r++) {   // по три в ряд, следующий ряд — выше
      const row = ks.slice(r * 3, r * 3 + 3), ws = row.map(width), tot = ws.reduce((a, b) => a + b, 0) + (row.length - 1) * 4;
      let x = c.x - tot / 2;
      row.forEach((k, i) => { place.push([k, x + ws[i] / 2, c.y - r * 24, ws[i]]); x += ws[i] + 4; });
    }
  }
  for (const k in UPGRADES) {   // остальное — над своим местом (поле, сад, расчистка, щит…)
    if (grouped.has(k) || !avail(k)) continue;
    const s = upSpot(k); if (!s) continue;
    const c = lift(s.x + .5, s.y + .5, BADGE_Z[k] || 30);
    place.push([k, c.x, c.y, width(k)]);
  }
  for (const [key, x, y, w] of place) {
    const u = UPGRADES[key], l = S.up[key], ok = S.coins >= u.cost(l), label = `▲ ${u.cost(l)}`;
    badgeHits.push({ key, x, y, w });
    // плашка «⬆ цена»: это предложение купить улучшение, а не уведомление о состоянии
    ctx.globalAlpha = ok ? 1 : .65;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - 10, w, 20, 10); ctx.fillStyle = ok ? '#3e9b3a' : '#7a6a55'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.globalAlpha = 1;

}

const walkable = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !blocked[y][x];
// ярмарка за дорогой — вне карты: туда и обратно через «ворота» на нижнем ряду дороги
function findPath(sx, sy, tx, ty) {
  const offS = sy >= H, offT = ty >= H;
  if (!offS && !offT) return gridPath(sx, sy, tx, ty);

// Общий график: выручка, траты и прибыль по дням или нарастающим итогом (SVG)
let econCum = false;
function econChart(hist) {
  const Wd = 320, Hd = 150, L = 34, R = 8, T = 10, B = 22;
  let pts = hist.map(x => ({ d: x.d, e: x.e, s: x.s, n: x.e - x.s, now: x.now }));
  if (econCum) { let e = 0, sp = 0; pts = pts.map(x => ({ ...x, e: e += x.e, s: sp += x.s, n: e - sp })); }

  const X = i => L + i * (Wd - L - R) / (pts.length - 1), Y = v => T + (max - v) / (max - min) * (Hd - T - B);

  const area = `<polygon fill="rgba(91,141,239,.12)" points="${X(0)},${Y(0)} ${pts.map((x, i) => X(i).toFixed(1) + ',' + Y(x.n).toFixed(1)).join(' ')} ${X(pts.length - 1)},${Y(0)}"/>`;
  const grid = [max, (max + min) / 2, min].filter((v, i, a) => a.indexOf(v) === i).map(v => `<line x1="${L}" x2="${Wd - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e6d9bb" stroke-width="1"/><text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="#7a6650">${fmt(v)}</text>`).join('');
  const zero = min < 0 ? `<line x1="${L}" x2="${Wd - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#7a6650" stroke-width="1"/>` : '';
  const step = Math.max(1, Math.ceil(pts.length / 6));
  const xl = pts.map((x, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${X(i)}" y="${Hd - 6}" text-anchor="middle" font-size="9" fill="#7a6650">${x.now ? 'сег.' : cal(x.d).sday}</text>` : '').join('');
  const last = pts[pts.length - 1];
  const dot = (k, col) => `<circle cx="${X(pts.length - 1)}" cy="${Y(last[k])}" r="3" fill="${col}"/>`;
  return `<svg viewBox="0 0 ${Wd} ${Hd}" style="width:100%;height:auto;background:#f6eedb;border-radius:10px">${grid}${zero}${area}
    ${line('s', '#e07a50', 2, true)}${line('e', '#3e9b3a', 2.2)}${line('n', '#4570c4', 2.6)}${dot('e', '#3e9b3a')}${dot('s', '#e07a50')}${dot('n', '#4570c4')}${xl}</svg>
    <div style="font-size:12px;color:#7a6650;text-align:center;margin-top:2px"><b style="color:#3e9b3a">—</b> выручка ${fmt(last.e)} · <b style="color:#e07a50">- -</b> траты ${fmt(last.s)} · <b style="color:#4570c4">—</b> прибыль ${fmt(last.n)}</div>`;

  if (top < t.offsetHeight + 70) { t.style.bottom = 'auto'; t.style.top = 'calc(6px + env(safe-area-inset-top))'; }
  else { t.style.top = 'auto'; t.style.bottom = Math.max(90, bottom) + 'px'; }
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT);
  placeToast();
  toastT = setTimeout(() => t.classList.remove('show'), Math.min(7000, Math.max(2500, 1200 + String(msg).length * 60)));
}
new MutationObserver(() => { if ($('toast').classList.contains('show')) placeToast(); }).observe($('overlay'), { attributes: true, attributeFilter: ['class'] });   // меню открылось/закрылось — подсказка переезжает
new MutationObserver(() => { if ($('toast').classList.contains('show')) requestAnimationFrame(placeToast); }).observe($('sheet'), { childList: true });
$('toast').onclick = () => { clearTimeout(toastT); $('toast').classList.remove('show'); };

$('harvestAll').onclick = () => { if (harvestRoute(false)) autoHarvest = true; };
function harvestRoute(again) {   // грядки, яблони и гнездо — по кратчайшему маршруту
  const covered = new Set(S.helpers.flatMap(c => c.stations));
  const kindOf = j => Object.keys(PROD).find(k => PROD[k].spot.x === j.x && PROD[k].spot.y === j.y) || (j.x === BAKE_SPOT.x && j.y === BAKE_SPOT.y ? 'bakery' : j.x === COOP_SPOT.x && j.y === COOP_SPOT.y ? 'coop' : j.x === BARN_SPOT.x && j.y === BARN_SPOT.y ? 'barn' : orchardAt(j.x, j.y) >= 0 ? 'orchard' : ghAt(j.x, j.y) >= 0 ? 'gh' : 'field');
  const zoneTaken = j => zoneOwner(zoneOfXY(j.x, j.y)) >= 0;   // на поле — только участки без помощника
  const all = readyJobs(), mine = all.filter(j => kindOf(j) === 'field' ? !zoneTaken(j) : !covered.has(kindOf(j)));
  const list = mine.map(j => ({ x: j.x, y: j.y, fn: () => j.act('player') }));
  if (!list.length) { if (!again) toast(all.length ? '🧑‍🌾 Это уже собирают помощники' : 'Пока нечего собирать'); return false; }
  setTasks(routeThrough(list), true);
  return true;
}
$('plantAll').onclick = () => {
  const c = CROP[S.sel], can = c.seed ? Math.floor(S.coins / c.seed) : Infinity;
  const list = [];
  if (GH_CROPS.includes(S.sel)) {   // помидоры и клубника — в теплицу
    if (!S.gh.length) { toast(`${c.e} растёт только в теплице 🏡 — построй её ночью`); return; }
    const ghSows = S.helpers.some(h => h.stations.includes('gh') && h.ghReplant);
    S.gh.forEach((p, i) => { if (!p.crop && !ghSows) list.push({ x: GH_SLOTS[i].x, y: GH_SLOTS[i].y, fn: () => plotAct(i, 'plant', true) }); });
    if (!list.length) { toast(ghSows && S.gh.some(p => !p.crop) ? '🧑‍🌾 Теплицу засеет помощник' : 'В теплице свободных грядок нет'); return; }
  } else {
    const sows = i => { const o = zoneOwner(zoneOf(i)); return o >= 0 && S.helpers[o].replant; };   // там сажает помощник
    S.plots.forEach((p, i) => { if (!p.crop && !sows(i)) list.push({ x: PLOT_SLOTS[i].x, y: PLOT_SLOTS[i].y, fn: () => plotAct(i, 'plant') }); });
    if (!list.length) { toast(S.plots.some((p, i) => !p.crop) ? '🧑‍🌾 Пустые грядки засеют помощники' : 'Свободных грядок нет'); return; }
  }
  if (!can) { toast('Не хватает монет — посади бесплатный подсолнух 🌻'); return; }
  setTasks(routeThrough(list).slice(0, can));
};
$('nightBtn').onclick = () => openNight(false);
$('dayBtn').onclick = () => morning();
$('profileBtn').onclick = openProfile;
$('coins').onclick = openEconomy;
$('menuBtn').onclick = openMenu;

// ================== ЧИТ-МЕНЮ (тройной тап по «День N») ==================
const CHEATS = {
  money:   ['💰 +1000', () => { S.coins += 1000; }],
  special: ['🌟 Особая находка', () => { const k = contestOf() === 'goldegg' ? 'pumpkin' : contestOf(); const q = Math.round(40 + Math.random() * 55); S.special.push({ k, q, d: S.day }); syncSpecial(); specialFound(k, q); }],
  season:  ['🍂 Следующий сезон', () => { S.day = (Math.floor((S.day - 1) / SEASON_LEN) + 1) * SEASON_LEN + 1; toast(`${season().e} ${season().name}: ${season().text}`); }],
  money2:  ['💰 +10 000', () => { S.coins += 10000; }],
  goods:   ['📦 +10 всего', () => { for (const id of [...S.unlocked, 'apple', 'egg', 'milk', 'flour', 'cheese', ...(S.up.bakery ? Object.keys(BAKE) : [])]) S.inv[id] = (S.inv[id] || 0) + 10; }],
  grow:    ['🌱 Всё созрело', () => { [...S.plots, ...S.gh].forEach(p => { if (p.crop) p.prog = 1; }); S.trees.forEach(t => { if (t.kind) { t.grow = 1; t.fruit = 1; } }); if (hens()) S.coop.eggs += 5; if (cows()) S.barn.milk += 3; for (const k in PROD) if (S.up[k]) S.prod[k].out += 3; if (S.up.bakery) S.bake.out[S.bake.sel] = (S.bake.out[S.bake.sel] || 0) + 3; }],
  crops:   ['🔓 Все культуры', () => { S.unlocked = CROPS.map(c => c.id); }],
  maxup:   ['⭐ Все улучшения', () => {
    for (const [k, u] of Object.entries(UPGRADES)) S.up[k] = u.max;
    while (S.plots.length < MAX_PLOTS) S.plots.push({ crop: null, prog: 0 });
    syncHelpers(); syncTrees(); syncHens(); syncCows(); syncGh(); applyLots();
  }],
  feed:    ['🐔🐄 Накормить всех', () => { if (hens()) { S.coop.fedDay = S.night ? S.day + 1 : S.day; S.coop.fedHens = hens(); } if (cows()) { S.barn.fedDay = S.night ? S.day + 1 : S.day; S.barn.fedCows = cows(); } }],
  visitor: ['🧍 Покупатель', () => { if (!S.night && queueCount() < MAX_QUEUE) { spawnVisitor(); S.spawned--; } }],
  evening: ['🌇 Вечер', () => { if (!S.night) { S.started = true; S.t = Math.max(S.t, DAY_LEN * 0.75); } }],
  sunset:  ['🌆 Закат', () => { if (!S.night) { S.started = true; S.t = Math.max(S.t, DAY_LEN - 4); } }],
  night:   ['🌙 Сразу ночь', () => { if (!S.night) { S.started = true; endDay(); return true; } }],
  morning: ['☀️ Сразу утро', () => { if (S.night) morning(); else { endDay(); morning(); } return true; }],
};
function cheat(k) {
  const leave = CHEATS[k][1]();
  save(); renderUI();
  if (!leave) openCheats(); else if (!S.night) closeNight();
}
function setSpeed(x) { timeScale = x; renderUI(); openCheats(); }
function openCheats() {
  let h = `<h2>🛠 Чит-меню</h2><div style="font-size:13px;color:#7a6650;margin-bottom:8px">Только для тестов</div>
    <div style="font-weight:700;margin-bottom:4px">Скорость времени</div><div class="cheats" style="grid-template-columns:repeat(4,1fr)">`;
  for (const x of [1, 3, 10, 30]) h += `<button class="${timeScale === x ? 'on' : 'alt'}" onclick="setSpeed(${x})">×${x}</button>`;
  h += `</div><div class="cheats">`;
  for (const [k, [label]] of Object.entries(CHEATS)) h += `<button class="alt" onclick="cheat('${k}')">${label}</button>`;
  h += `</div><button class="wide" style="width:100%" onclick="closeNight()">Закрыть</button>`;
  $('sheet').dataset.view = ''; $('sheet').innerHTML = h;
  $('overlay').classList.add('show');
}
$('helperBtn').onclick = openHelpers;
$('sunbox').onclick = () => { if (!S.night && !S.started) beginClock(); else openCalendar(); };
$('overlay').onclick = e => { if (e.target.id === 'overlay') closeNight(); };

// ================== СТАРТ ==================
applyYard(); applyPasture(); syncHelpers(); syncTrees(); syncHens(); syncCows(); syncGh(); applyLots(); orderMorning();
new ResizeObserver(resize).observe($('stage'));
// iPhone после поворота иногда оставляет страницу прокрученной — возвращаем на место
const unshift = () => { if (scrollX || scrollY) scrollTo(0, 0); if (document.scrollingElement) document.scrollingElement.scrollTop = 0; };
addEventListener('orientationchange', () => [0, 100, 300, 700].forEach(t => setTimeout(unshift, t)));
addEventListener('resize', unshift); addEventListener('scroll', unshift, { passive: true });
resize();
if (tablet) { centerCam(); clampCam(); }   // на планшете — вся ферма
else { const a = iso(5, 15), b = iso(11, 6); cam.x = (a.x + b.x) / 2; cam.y = (a.y + b.y) / 2 - 10; clampCam(); }   // на телефоне — поле и лавка в кадре
if (S.toSpawn === 0 && !S.night) startDay(); else renderUI();
if (!S.night) S.toSpawn = Math.max(S.toSpawn, visitorsPerDay());   // старые сохранения получают новый поток покупателей сразу
if (S.night) openNight(false);
// Приложение на экране «Домой» держит старую версию в памяти — проверяем сайт и обновляемся сами (ферма сохраняется до перезагрузки)
let updBusy = false;
async function checkUpdate() {
  if (EMBED || updBusy || !/^https?:/.test(location.protocol)) return; updBusy = true;
  try {
    const t = await (await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })).text();
    const b = (t.match(/const BUILD = '([^']+)'/) || [])[1];
    let tried = ''; try { tried = sessionStorage.getItem('farm-upd') || ''; } catch {}
    if (b && b !== BUILD && b !== tried) {
      try { sessionStorage.setItem('farm-upd', b); } catch {}
      save(); noSave = true; wnSet({ slot: SLOT, msg: '✨ Игра обновилась' });
      location.replace(location.pathname + '?v=' + encodeURIComponent(b)); return;
    }
  } catch {}
  updBusy = false;
}
setTimeout(checkUpdate, 1500);
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); cloudPushActive(); } else checkUpdate(); });   // свернули — сохраняемся сразу (и в облако)
addEventListener('pagehide', save);
if (WN.msg) setTimeout(() => toast(WN.msg), 600);
if (isRest() && !S.night && S.picnic !== S.day) setTimeout(openSunday, 900);   // открыли игру в воскресенье — сразу предложить, чем заняться
cloudInit();
requestAnimationFrame(tick);
</script>
